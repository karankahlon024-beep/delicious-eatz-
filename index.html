      <div class="border-t border-gray-700 pt-2 mb-3 flex justify-between items-center font-bold text-base">
        <span>Total:</span>
        <span id="cart-total" class="text-orange-500 text-lg">₹0</span>

      <button onclick="checkoutOrder()" class="w-full bg-green-600 hover:bg-green-700 active:scale-95 font-bold py-3 rounded-xl text-base shadow-lg transition duration-200">
        Place Order & Print Bill

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = 'cat-btn px-3 py-1.5 bg-gray-800 text-gray-400 font-bold rounded-lg whitespace-nowrap';
      });
      document.getElementById('cat-' + cat).className = 'cat-btn px-3 py-1.5 bg-orange-600 text-white font-bold rounded-lg whitespace-nowrap';
      renderMenu();
    }

    function renderMenu() {
      const container = document.getElementById('menu-items');
      const filtered = currentCategory === 'all' ? menu : menu.filter(i => i.category === currentCategory);
      
      container.innerHTML = filtered.map((item) => {
        let priceDisplay = '';
        if (item.price) {
          priceDisplay = `₹${item.price}`;
        } else if (item.prices) {
          priceDisplay = `From ₹${Math.min(...Object.values(item.prices))}`;
        }
        return `
          <button onclick="handleItemClick('${item.name.replace(/'/g, "\\'")}')" class="bg-gray-800 hover:bg-gray-700 active:scale-95 p-3 rounded-xl text-left border border-gray-700 transition shadow flex flex-col justify-between">
            <div class="font-bold text-xs text-white line-clamp-2">${item.name}</div>
            <div class="text-orange-400 font-semibold text-xs mt-2">${priceDisplay}</div>
          </button>
        `;
      }).join('');
    }

    function handleItemClick(name) {
      const item = menu.find(i => i.name === name);
      if (!item) return;

      if (item.price) {
        addToCart(item.name, item.price, 'Regular');
      } else if (item.prices) {
        openVariantModal(item);
      }
    }

    function openVariantModal(item) {
      const modal = document.getElementById('variant-modal');
      const title = document.getElementById('modal-title');
      const options = document.getElementById('modal-options');

      title.innerText = `Select Size: ${item.name}`;
      options.innerHTML = Object.entries(item.prices).map(([size, price]) => `
        <button onclick="selectVariant('${item.name.replace(/'/g, "\\'")}', '${size}', ${price})" class="w-full flex justify-between items-center p-3 bg-gray-700 hover:bg-gray-600 rounded-xl font-bold text-sm transition">
          <span>${size}</span>
          <span class="text-orange-400">₹${price}</span>
        </button>
      `).join('');

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function selectVariant(name, size, price) {
      addToCart(`${name} (${size})`, price, size);
      closeModal();
    }

    function closeModal() {
      const modal = document.getElementById('variant-modal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    function setOrderType(type) {
      orderType = type;
      document.getElementById('type-dine').className = type === 'Dine In' ? 'flex-1 py-2 bg-orange-600 rounded-lg font-bold text-xs transition shadow' : 'flex-1 py-2 bg-gray-800 rounded-lg font-bold text-xs text-gray-400 transition shadow';
      document.getElementById('type-take').className = type === 'Takeaway' ? 'flex-1 py-2 bg-orange-600 rounded-lg font-bold text-xs transition shadow' : 'flex-1 py-2 bg-gray-800 rounded-lg font-bold text-xs text-gray-400 transition shadow';
    }

    function addToCart(name, price, variant) {
      const cartKey = `${name}`;
      const existing = cart.find(i => i.cartKey === cartKey);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ cartKey, name, price, qty: 1 });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const list = document.getElementById('cart-list');
      if (cart.length === 0) {
        list.innerHTML = '<p class="text-gray-500 italic">Cart is empty</p>';
        document.getElementById('cart-total').innerText = '₹0';
        return;
      }
      list.innerHTML = cart.map((i, index) => `
        <div class="flex justify-between items-center bg-gray-900/60 p-2 rounded-lg border border-gray-800">
          <div>
            <div class="font-medium text-xs">${i.name}</div>
            <div class="text-orange-400 font-semibold text-[11px]">₹${i.price * i.qty}</div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="decreaseQty(${index})" class="w-6 h-6 bg-gray-700 hover:bg-gray-600 rounded font-bold text-xs">-</button>
            <span class="text-xs font-bold">${i.qty}</span>
            <button onclick="increaseQty(${index})" class="w-6 h-6 bg-gray-700 hover:bg-gray-600 rounded font-bold text-xs">+</button>
          </div>
        </div>
      `).join('');
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById('cart-total').innerText = '₹' + total;
    }

    function increaseQty(index) {
      cart[index].qty++;
      updateCartUI();
    }

    function decreaseQty(index) {
      cart[index].qty--;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      updateCartUI();
    }

    function checkoutOrder() {
      if (cart.length === 0) {
        alert('Please add items to the cart first!');
        return;
      }

      const invoiceNum = Math.floor(1000 + Math.random() * 9000);
      const totalAmount = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const itemsString = cart.map(i => `${i.name} x${i.qty}`).join(', ');

      const orderData = {
        Invoice: invoiceNum,
        Type: orderType,
        Items: itemsString,
        Total: totalAmount,
        Timestamp: new Date().toLocaleString()
      };

      fetch(SHEETDB_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: [orderData] })
      })
      .then(res => res.json())
      .then(() => {
        alert('Order #' + invoiceNum + ' placed successfully! Printing on counter...');
        cart = [];
        updateCartUI();
      })
      .catch(err => {
        alert('Error saving order. Check your internet connection.');
        console.error(err);
      });
    }

    renderMenu();
  </script>
