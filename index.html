<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delicious Eatz - POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">

  <div class="max-w-md mx-auto">
    <header class="text-center mb-6">
      <h1 class="text-3xl font-extrabold tracking-wider text-orange-500 uppercase">Eatz</h1>
      <p class="text-xs text-gray-400">Delicious Eatz POS Terminal</p>
    </header>

    <!-- Order Type Selection -->
    <div class="flex gap-2 mb-4">
      <button onclick="setOrderType('Dine In')" id="type-dine" class="flex-1 py-2 bg-orange-600 rounded font-bold text-sm">Dine In</button>
      <button onclick="setOrderType('Takeaway')" id="type-take" class="flex-1 py-2 bg-gray-800 rounded font-bold text-sm text-gray-400">Takeaway</button>
    </div>

    <!-- Menu Grid -->
    <div class="grid grid-cols-2 gap-3 mb-6" id="menu-items">
      <!-- Items populated dynamically -->
    </div>

    <!-- Cart Summary -->
    <div class="bg-gray-800 p-4 rounded-lg mb-4">
      <h2 class="text-sm font-bold text-gray-400 mb-2 uppercase tracking-wide">Current Order</h2>
      <div id="cart-list" class="space-y-2 mb-3 text-sm max-h-40 overflow-y-auto">
        <p class="text-gray-500 italic">Cart is empty</p>
      </div>
      <div class="border-t border-gray-700 pt-2 flex justify-between font-bold text-lg">
        <span>Total:</span>
        <span id="cart-total" class="text-orange-500">₹0</span>
      </div>
    </div>

    <!-- Checkout Button -->
    <button onclick="checkoutOrder()" class="w-full bg-green-600 hover:bg-green-700 font-bold py-3 rounded-lg text-lg shadow-lg transition duration-200">
      Print Bill & Save Order
    </button>
  </div>

  <script>
    const SHEETDB_API = 'https://sheetdb.io/api/v1/mbu5t23na13vg';
    let orderType = 'Dine In';
    let cart = [];

    const menu = [
      { name: 'Allu Petty Burger', price: 40 },
      { name: 'Paneer Burger', price: 80 },
      { name: 'Onion Pizza', price: 70 },
      { name: 'Capsicum Pizza', price: 80 },
      { name: 'Margherita (Reg)', price: 150 },
      { name: 'Makhni Lover (Reg)', price: 190 }
    ];

    function renderMenu() {
      const container = document.getElementById('menu-items');
      container.innerHTML = menu.map((item, index) => `
        <button onclick="addToCart('${item.name}', ${item.price})" class="bg-gray-800 hover:bg-gray-700 p-3 rounded-lg text-left border border-gray-700 transition">
          <div class="font-bold text-sm text-white">${item.name}</div>
          <div class="text-orange-400 font-semibold text-xs mt-1">₹${item.price}</div>
        </button>
      `).join('');
    }

    function setOrderType(type) {
      orderType = type;
      document.getElementById('type-dine').className = type === 'Dine In' ? 'flex-1 py-2 bg-orange-600 rounded font-bold text-sm' : 'flex-1 py-2 bg-gray-800 rounded font-bold text-sm text-gray-400';
      document.getElementById('type-take').className = type === 'Takeaway' ? 'flex-1 py-2 bg-orange-600 rounded font-bold text-sm' : 'flex-1 py-2 bg-gray-800 rounded font-bold text-sm text-gray-400';
    }

    function addToCart(name, price) {
      const existing = cart.find(i => i.name === name);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ name, price, qty: 1 });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const list = document.getElementById('cart-list');
      if (cart.length === 0) {
        list.innerHTML = '<p class="text-gray-500 italic">Cart is empty</p>';
        document.getElementById('cart-total').innerText = '₹0';
        return;
      }
      list.innerHTML = cart.map(i => `
        <div class="flex justify-between items-center bg-gray-900/50 p-2 rounded">
          <span>${i.name} x${i.qty}</span>
          <span class="text-orange-400">₹${i.price * i.qty}</span>
        </div>
      `).join('');
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById('cart-total').innerText = '₹' + total;
    }

    function checkoutOrder() {
      if (cart.length === 0) {
        alert('Please add items to the cart first!');
        return;
      }

      const invoiceNum = Math.floor(1000 + Math.random() * 9000);
      const totalAmount = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const itemsString = cart.map(i => `${i.name} x${i.qty}`).join(', ');

      const orderData = {
        Invoice: invoiceNum,
        Type: orderType,
        Items: itemsString,
        Total: totalAmount,
        Timestamp: new Date().toLocaleString()
      };

      fetch(SHEETDB_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: [orderData] })
      })
      .then(res => res.json())
      .then(data => {
        alert('Order #' + invoiceNum + ' placed successfully! Printing on counter...');
        cart = [];
        updateCartUI();
      })
      .catch(err => {
        alert('Error saving order. Check your internet connection.');
        console.error(err);
      });
    }

    renderMenu();
  </script>
</body>
</html>
