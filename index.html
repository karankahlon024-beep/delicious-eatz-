<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Delicious Eatz - POS Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #0f172a; overflow: hidden; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pos-btn:active { transform: translateY(1px); }
  </style>
</head>
<body class="h-screen w-screen flex flex-col bg-[#0f172a]">

  <header class="bg-[#090d16] border-b border-[#1e293b] px-2 py-1.5 flex items-center justify-between text-white flex-shrink-0 z-30">
    <div class="flex items-center space-x-1.5">
      <div class="bg-white text-black px-1.5 py-0.5 rounded font-black text-[10px] tracking-wider flex items-center">
        POS
      </div>
      <span class="font-extrabold text-xs tracking-tight text-white">EATZ</span>
    </div>

    <div class="flex items-center space-x-1">
      <button onclick="switchView('tables')" id="nav-btn-tables" class="px-2 py-1 bg-white text-black font-extrabold text-xs rounded shadow-sm flex items-center">
        <i class="fa-solid fa-table-cells text-[10px]"></i>
      </button>
      <button onclick="switchView('sales')" id="nav-btn-sales" class="px-2 py-1 bg-[#1e293b] text-white font-bold text-xs rounded border border-[#334155] flex items-center">
        <i class="fa-solid fa-chart-line text-[10px]"></i>
      </button>
      <button onclick="switchView('held')" id="nav-btn-held" class="px-2 py-1 bg-[#1e293b] text-amber-400 font-bold text-xs rounded border border-[#334155] flex items-center">
        <i class="fa-solid fa-pause text-[10px] mr-0.5"></i><span id="held-count-badge">0</span>
      </button>
      <button onclick="switchView('menu')" id="nav-btn-menu" class="px-2 py-1 bg-[#1e293b] text-neutral-300 font-bold text-xs rounded border border-[#334155]">
        <i class="fa-solid fa-sliders text-[10px]"></i>
      </button>
    </div>
  </header>

  <main id="view-tables" class="flex-1 flex flex-col p-3 bg-[#0b1120] overflow-y-auto">
    <div class="bg-[#131d31] border border-[#1e293b] rounded-xl p-2.5 flex flex-col sm:flex-row items-center justify-between gap-2 mb-3 shadow-lg">
      <div class="flex items-center space-x-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="text-xs font-black text-white uppercase tracking-wider">Floor Plan & Orders</span>
      </div>

      <div class="flex items-center space-x-2 w-full sm:w-auto">
        <button onclick="setModeAndOpen('Delivery')" class="pos-btn flex-1 sm:flex-none px-3 py-2 bg-black hover:bg-neutral-900 border border-[#334155] text-amber-400 font-extrabold text-xs rounded-lg shadow flex items-center justify-center">
          <i class="fa-solid fa-motorcycle mr-1.5 text-sm"></i> DELIVERY
        </button>
        <button onclick="setModeAndOpen('Takeaway')" class="pos-btn flex-1 sm:flex-none px-3 py-2 bg-black hover:bg-neutral-900 border border-[#334155] text-white font-extrabold text-xs rounded-lg shadow flex items-center justify-center">
          <i class="fa-solid fa-bag-shopping mr-1.5 text-sm"></i> TAKEAWAY
        </button>
      </div>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3" id="table-cards-container"></div>
  </main>

  <main id="view-register" class="flex-1 flex flex-col md:flex-row overflow-hidden hidden bg-white">
    <section class="w-full md:w-[62%] flex flex-col overflow-hidden bg-[#f8fafc] border-r border-[#cbd5e1] h-1/2 md:h-full">
      <div class="p-2 border-b border-[#cbd5e1] bg-white flex items-center space-x-2 flex-shrink-0">
        <button onclick="switchView('tables')" class="px-3 py-1.5 bg-[#0f172a] hover:bg-black text-white rounded-lg text-xs font-black flex items-center">
          <i class="fa-solid fa-arrow-left mr-1.5"></i> TABLES
        </button>
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-neutral-400"></i>
          <input id="item-search" type="text" placeholder="Search menu..." oninput="renderItems()" class="w-full pl-8 pr-3 py-1.5 bg-[#f1f5f9] border border-[#cbd5e1] rounded-lg text-xs font-bold text-black focus:outline-none focus:border-black" />
        </div>
      </div>

      <div class="flex items-center bg-[#e2e8f0] border-b border-[#cbd5e1] p-1 flex-shrink-0">
        <button onclick="scrollCategories(-140)" class="w-6 h-7 bg-white hover:bg-neutral-200 border border-[#cbd5e1] rounded flex items-center justify-center text-xs font-black mr-1 flex-shrink-0">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div id="category-bar" onwheel="handleCatWheel(event)" class="flex-1 flex items-center space-x-1.5 overflow-x-auto no-scrollbar scroll-smooth"></div>
        <button onclick="scrollCategories(140)" class="w-6 h-7 bg-white hover:bg-neutral-200 border border-[#cbd5e1] rounded flex items-center justify-center text-xs font-black ml-1 flex-shrink-0">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <div id="items-grid" class="flex-1 overflow-y-auto p-2 grid grid-cols-2 lg:grid-cols-3 gap-2 content-start no-scrollbar"></div>
    </section>

    <section class="w-full md:w-[38%] flex flex-col overflow-hidden bg-white h-1/2 md:h-full border-t md:border-t-0">
      <div class="p-2 bg-[#f8fafc] border-b border-[#cbd5e1] space-y-1.5 flex-shrink-0 shadow-sm">
        <div class="flex items-center justify-between">
          <div class="grid grid-cols-3 gap-1 flex-1 mr-2">
            <button onclick="setOrderMode('Dine In', this)" class="mode-btn py-1 rounded text-[10px] font-black uppercase tracking-wider bg-black text-white">Dine In</button>
            <button onclick="setOrderMode('Takeaway', this)" class="mode-btn py-1 rounded text-[10px] font-bold uppercase tracking-wider bg-white border border-[#cbd5e1] text-neutral-700">Pickup</button>
            <button onclick="setOrderMode('Delivery', this)" class="mode-btn py-1 rounded text-[10px] font-bold uppercase tracking-wider bg-white border border-[#cbd5e1] text-neutral-700">Delivery</button>
          </div>
          <span id="current-invoice-tag" class="font-mono text-black text-xs font-black bg-[#e2e8f0] px-2 py-0.5 rounded">#TBL-1</span>
        </div>

        <div id="delivery-phone-wrap" class="hidden">
          <div class="flex items-center bg-white border-2 border-amber-500 rounded-lg px-2 py-1">
            <i class="fa-solid fa-phone text-amber-600 text-xs mr-2"></i>
            <input id="delivery-phone-input" type="tel" placeholder="Customer Contact Number..." class="w-full bg-transparent text-xs font-bold font-mono text-black placeholder-neutral-400 focus:outline-none" />
          </div>
        </div>

        <div class="bg-white p-2 rounded-lg border border-[#cbd5e1] flex flex-col space-y-1">
          <div class="flex items-center justify-between text-xs">
            <span class="text-neutral-500 font-bold">Sub: <strong id="cart-subtotal" class="text-black font-mono">₹0</strong></span>
            <div class="flex items-center space-x-1">
              <span class="text-neutral-500 font-bold">Disc:</span>
              <input id="cart-discount" type="number" value="0" min="0" oninput="recalcCart()" class="w-12 bg-[#f1f5f9] border border-[#cbd5e1] rounded px-1 py-0.5 text-right font-mono font-bold text-xs" />
            </div>
            <div>
              <span class="text-[10px] font-bold text-neutral-400">NET:</span>
              <span id="cart-grand" class="text-black font-mono font-black text-sm ml-0.5">₹0</span>
            </div>
          </div>
          <div id="bogo-applied-info" class="hidden text-emerald-700 text-[10px] font-black flex justify-between border-t border-neutral-200 pt-1">
            <span><i class="fa-solid fa-gift mr-1"></i> BOGO Applied:</span>
            <span id="bogo-discount-amount" class="font-mono">-₹0</span>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-1">
          <button onclick="setPayment('Cash', this)" class="pay-btn py-1 rounded text-[10px] font-black uppercase bg-amber-400 text-black border border-amber-500 shadow-xs">Cash</button>
          <button onclick="setPayment('UPI', this)" class="pay-btn py-1 rounded text-[10px] font-bold uppercase bg-white border border-[#cbd5e1] text-neutral-700">UPI</button>
          <button onclick="setPayment('Card', this)" class="pay-btn py-1 rounded text-[10px] font-bold uppercase bg-white border border-[#cbd5e1] text-neutral-700">Card</button>
        </div>

        <div class="grid grid-cols-6 gap-1 pt-0.5">
          <button onclick="printOnlyKOT()" class="pos-btn py-1.5 rounded bg-[#334155] text-white text-[9px] font-black uppercase shadow">KOT</button>
          <button id="btn-bogo-toggle" onclick="toggleBogo()" class="pos-btn py-1.5 rounded bg-white text-neutral-800 border border-[#cbd5e1] text-[9px] font-black uppercase">BOGO</button>
          <button onclick="saveBillOnly()" class="pos-btn py-1.5 rounded bg-emerald-600 text-white text-[9px] font-black uppercase shadow">SAVE</button>
          <button onclick="holdCurrentCart()" class="pos-btn py-1.5 rounded bg-amber-500 text-black text-[9px] font-black uppercase">HOLD</button>
          <button onclick="clearCart()" class="pos-btn py-1.5 rounded bg-[#e2e8f0] text-neutral-800 text-[9px] font-black uppercase">CLR</button>
          <button onclick="settleBillAndPrint()" class="pos-btn py-1.5 rounded bg-black text-white text-[9px] font-black uppercase shadow-lg">SETTLE</button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-2 space-y-1.5 no-scrollbar bg-white" id="cart-items-container"></div>
    </section>
  </main>

  <main id="view-sales" class="flex-1 flex flex-col p-3 bg-[#0b1120] overflow-y-auto hidden">
    <div class="bg-white rounded-xl shadow-xl overflow-hidden flex flex-col flex-1 border border-neutral-300">
      <div class="p-3 bg-[#0f172a] text-white flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
        <div>
          <h2 class="text-sm font-black uppercase tracking-wider">Sales Ledger</h2>
          <p id="sales-report-date-tag" class="text-[11px] text-neutral-400 font-mono">Today</p>
        </div>

        <div class="flex items-center space-x-1.5 flex-wrap">
          <button id="btn-sales-month" onclick="filterSales('month')" class="px-2 py-1 bg-[#1e293b] border border-neutral-700 rounded-lg text-xs font-bold text-white">Month</button>
          <button id="btn-sales-yesterday" onclick="filterSales('yesterday')" class="px-2 py-1 bg-[#1e293b] border border-neutral-700 rounded-lg text-xs font-bold text-white">Yesterday</button>
          <button id="btn-sales-today" onclick="filterSales('today')" class="px-2 py-1 bg-white text-black rounded-lg text-xs font-black shadow">Today</button>
          <button onclick="switchView('tables')" class="px-2 py-1 bg-neutral-700 text-white rounded-lg text-xs font-bold">Close</button>
        </div>
      </div>

      <div class="bg-[#f8fafc] border-b border-[#cbd5e1] p-3 flex items-center justify-between">
        <span class="text-xs sm:text-sm font-bold text-neutral-600">Net Revenue: <strong id="sales-total-amount" class="text-lg sm:text-xl text-black font-mono font-black ml-1">₹0.00</strong></span>
        <span class="text-xs font-bold text-neutral-500">Invoices: <strong id="sales-total-bills" class="font-mono text-black text-sm ml-1">0</strong></span>
      </div>

      <div class="flex-1 overflow-y-auto no-scrollbar">
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-[#f1f5f9] border-b border-[#cbd5e1] text-neutral-700 font-extrabold sticky top-0">
            <tr>
              <th class="p-2.5 border-r border-[#cbd5e1]">Bill #</th>
              <th class="p-2.5 border-r border-[#cbd5e1]">Timestamp</th>
              <th class="p-2.5 border-r border-[#cbd5e1]">Tender</th>
              <th class="p-2.5 border-r border-[#cbd5e1]">Type</th>
              <th class="p-2.5 border-r border-[#cbd5e1] text-right">Disc</th>
              <th class="p-2.5 text-right">Net</th>
            </tr>
          </thead>
          <tbody id="sales-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <main id="view-held" class="flex-1 overflow-y-auto p-3 bg-[#0b1120] hidden">
    <div class="max-w-xl mx-auto space-y-3">
      <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow-md border border-neutral-300">
        <h2 class="text-xs font-black uppercase text-neutral-900 tracking-wider"><i class="fa-solid fa-pause text-amber-500 mr-2"></i> Held Tickets Queue</h2>
        <span id="held-total-badge" class="px-2.5 py-1 rounded bg-[#f1f5f9] border border-[#cbd5e1] text-xs text-neutral-800 font-mono font-black">0 Held</span>
      </div>
      <div id="held-orders-list" class="space-y-2"></div>
    </div>
  </main>

  <main id="view-menu" class="flex-1 overflow-y-auto p-3 bg-[#0b1120] hidden">
    <div class="max-w-xl mx-auto space-y-3">
      <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow-md border border-neutral-300">
        <h2 class="text-xs font-black uppercase text-neutral-900 tracking-wider"><i class="fa-solid fa-sliders text-neutral-700 mr-2"></i> Menu Editor</h2>
        <div class="flex space-x-2">
          <button onclick="toggleAddForm()" class="px-3 py-1 bg-black text-white text-xs font-black rounded-lg">+ Add Item</button>
          <button onclick="resetMenuToOriginal()" class="px-3 py-1 bg-[#e2e8f0] text-black text-xs font-bold rounded-lg">Reset</button>
        </div>
      </div>

      <div id="add-item-card" class="bg-white border border-[#cbd5e1] p-3 rounded-xl hidden space-y-2 shadow-lg">
        <h3 class="text-xs font-black text-black uppercase">Create New Item</h3>
        <div class="space-y-2">
          <div>
            <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Item Name</label>
            <input id="new-item-name" type="text" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-2 text-xs font-bold text-black focus:outline-none" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Category</label>
              <select id="new-item-category" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-2 text-xs font-bold text-black"></select>
            </div>
            <div>
              <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Pricing Type</label>
              <select id="new-item-type" onchange="toggleSizeInputs(this.value)" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-2 text-xs font-bold text-black">
                <option value="single">Single Price</option>
                <option value="sizes">Sizes (R/M/L)</option>
              </select>
            </div>
          </div>
          <div id="new-single-price-wrap">
            <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Price (₹)</label>
            <input id="new-item-price" type="number" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-2 text-xs font-bold text-black font-mono" />
          </div>
          <div id="new-sizes-price-wrap" class="hidden grid grid-cols-3 gap-2">
            <div>
              <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Regular</label>
              <input id="new-item-price-reg" type="number" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-1.5 text-xs font-bold text-black font-mono" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Medium</label>
              <input id="new-item-price-med" type="number" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-1.5 text-xs font-bold text-black font-mono" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Large</label>
              <input id="new-item-price-lrg" type="number" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-1.5 text-xs font-bold text-black font-mono" />
            </div>
          </div>
          <div class="flex justify-end space-x-2 pt-2">
            <button onclick="toggleAddForm()" class="px-3 py-1.5 bg-[#e2e8f0] rounded text-xs font-bold">Cancel</button>
            <button onclick="saveNewItem()" class="px-4 py-1.5 bg-black rounded text-xs text-white font-black">Save Item</button>
          </div>
        </div>
      </div>

      <div id="menu-editor-list" class="space-y-2"></div>
    </div>
  </main>

    <div class="bg-white border border-[#cbd5e1] w-full max-w-xs rounded-2xl p-4 shadow-2xl">
      <div class="flex justify-between items-center mb-3">
        <h4 id="size-modal-title" class="text-sm font-black text-black">Select Portion</h4>
        <button onclick="closeSizeModal()" class="text-neutral-400 hover:text-black text-sm"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="size-modal-options" class="space-y-2"></div>
    </div>
  </div>

      isBogoActive = !isBogoActive;
      const btn = document.getElementById('btn-bogo-toggle');
      if (isBogoActive) {
        btn.classList.remove('bg-white', 'text-neutral-800', 'border-[#cbd5e1]');

    function getUniqueCategories() {
      const cats = new Set(DEFAULT_CATEGORIES);
      menu.forEach(it => cats.add(it.category));

    function renderItems() {
      const grid = document.getElementById('items-grid');
      grid.innerHTML = '';
      const query = (document.getElementById('item-search').value || '').toLowerCase();

      const items = menu.filter(it => {
        const matchesCat = activeCategory === 'All' || it.category === activeCategory;
        const matchesQuery = it.name.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      items.forEach(it => {
        const hasSizes = it.price_medium !== undefined && it.price_medium !== null && it.price_medium > 0;

        btn.className = `pos-btn bg-white hover:bg-[#f1f5f9] border border-[#cbd5e1] active:border-black rounded-xl p-2.5 flex flex-col justify-between text-left h-24 transition shadow-xs ${!it.available ? 'opacity-40' : ''}`;
        btn.onclick = () => handleItemSelect(it);

        btn.innerHTML = `
          <div>
            <span class="text-[8px] font-black text-neutral-400 block uppercase tracking-wider">${it.category}</span>

          </div>
          <div class="flex justify-between items-center w-full mt-1">
            <span class="font-mono text-sm font-black text-black">₹${it.price_regular}</span>
            ${hasSizes ? '<span class="text-[8px] px-1.5 py-0.5 rounded bg-neutral-100 text-black border border-neutral-300 font-extrabold">SIZES</span>' : ''}
          </div>
        `;
        grid.appendChild(btn);
      });
    }

    function handleItemSelect(item) {
      if (!item.available) return alert('This item is currently disabled.');
      if (item.price_medium !== undefined && item.price_medium !== null && item.price_medium > 0) {
        document.getElementById('size-modal-title').innerText = item.name;
        const container = document.getElementById('size-modal-options');
        container.innerHTML = `
          <button onclick="addToCart(${item.id}, 'r', ${item.price_regular})" class="pos-btn w-full py-2.5 bg-[#f1f5f9] hover:bg-[#e2e8f0] border border-[#cbd5e1] rounded-xl flex justify-between px-3 text-xs font-black text-black">
            <span>Regular (r)</span><span class="font-mono font-black">₹${item.price_regular}</span>
          </button>
          <button onclick="addToCart(${item.id}, 'm', ${item.price_medium})" class="pos-btn w-full py-2.5 bg-[#f1f5f9] hover:bg-[#e2e8f0] border border-[#cbd5e1] rounded-xl flex justify-between px-3 text-xs font-black text-black">
            <span>Medium (m)</span><span class="font-mono font-black">₹${item.price_medium}</span>
          </button>
          <button onclick="addToCart(${item.id}, 'l', ${item.price_large})" class="pos-btn w-full py-2.5 bg-[#f1f5f9] hover:bg-[#e2e8f0] border border-[#cbd5e1] rounded-xl flex justify-between px-3 text-xs font-black text-black">

        addToCart(item.id, 'Std', item.price_regular);
      }
    }

    function closeSizeModal() {
      document.getElementById('size-modal').classList.add('hidden');
    }

    function addToCart(id, variant, price) {
      const item = menu.find(i => i.id === id);
      const key = `${id}_${variant}`;
      if (cart[key]) {
        cart[key].qty += 1;
      } else {
        cart[key] = { id, name: item.name, category: item.category, variant, price, qty: 1 };
      }
      closeSizeModal();
      renderCart();
    }

    function updateQty(key, delta) {
      if (cart[key]) {
        cart[key].qty += delta;
        if (cart[key].qty <= 0) delete cart[key];
      }
      renderCart();
    }

    function removeItem(key) {
      delete cart[key];
      renderCart();
    }

    function clearCart() {
      if (Object.keys(cart).length === 0) return;
      if (confirm('Clear running order?')) resetCartFields();
    }

    function resetCartFields() {
      cart = {};
      activeResumedHoldId = null;
      document.getElementById('cart-discount').value = 0;
      document.getElementById('delivery-phone-input').value = '';
      if (isBogoActive) toggleBogo();
      renderCart();
    }

    function holdCurrentCart() {
      const itemsInCart = Object.values(cart);
      if (itemsInCart.length === 0) return alert('Cart is empty.');

      const { sub, disc, bogoDiscount, grand } = recalcCart();
      const phone = document.getElementById('delivery-phone-input').value.trim();

      const heldEntry = {
        hold_id: `HOLD-${Date.now().toString().slice(-4)}`,
        timestamp: new Date().toISOString(),
        mode: currentOrderMode,
        table: currentOrderMode === 'Dine In' ? selectedTable : null,
        phone: phone || null,
        cart: JSON.parse(JSON.stringify(cart)),
        isBogoActive: isBogoActive,
        bogoDiscount: bogoDiscount,
        discount: disc,
        grand: grand
      };

      heldOrders.unshift(heldEntry);
      saveState();
      resetCartFields();
      switchView('tables');
    }

    function resumeHeldOrder(holdId) {
      const idx = heldOrders.findIndex(h => h.hold_id === holdId);
      if (idx === -1) return;

      const target = heldOrders[idx];
      cart = JSON.parse(JSON.stringify(target.cart));
      document.getElementById('cart-discount').value = target.discount || 0;
      if (target.phone) document.getElementById('delivery-phone-input').value = target.phone;
      
      if (target.isBogoActive !== isBogoActive) {
        toggleBogo();
      }

      activeResumedHoldId = holdId;
      selectedTable = target.table || '1';
      currentOrderMode = target.mode || 'Dine In';

      saveState();
      switchView('register');
      renderCart();
    }

    function deleteHeldOrder(holdId) {
      if (confirm('Delete this held order?')) {
        heldOrders = heldOrders.filter(h => h.hold_id !== holdId);
        saveState();
        renderHeldOrders();
      }
    }

    function renderHeldOrders() {
      const container = document.getElementById('held-orders-list');
      container.innerHTML = '';
      document.getElementById('held-total-badge').innerText = `${heldOrders.length} Held`;

      if (heldOrders.length === 0) {
        container.innerHTML = '<p class="text-neutral-400 text-xs py-10 text-center bg-white rounded-xl border border-neutral-300">No orders currently on hold.</p>';
        return;
      }

      heldOrders.forEach(h => {
        const card = document.createElement('div');
        card.className = 'bg-white border border-[#cbd5e1] p-3 rounded-xl flex justify-between items-center shadow-sm';
        const summaryItems = Object.values(h.cart).map(i => `${i.name} (x${i.qty})`).join(', ');

        card.innerHTML = `
          <div class="flex-1 pr-3">
            <div class="flex items-center space-x-2">
              <span class="font-mono font-bold text-black text-xs">${h.hold_id}</span>
              <span class="px-2 py-0.5 rounded text-[10px] bg-[#f1f5f9] border border-[#cbd5e1] text-black font-extrabold uppercase">${h.mode}${h.table ? ' T' + h.table : ''}</span>
              ${h.isBogoActive ? '<span class="px-1.5 py-0.5 rounded text-[9px] bg-black text-white font-black">BOGO</span>' : ''}
            </div>
            <p class="text-[11px] text-neutral-600 line-clamp-1 mt-1 font-semibold">${summaryItems}</p>
            <p class="font-mono font-black text-black text-sm mt-1">₹${h.grand}</p>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="resumeHeldOrder('${h.hold_id}')" class="pos-btn px-3 py-1.5 bg-black hover:bg-neutral-800 text-white text-xs font-black rounded-lg">Resume</button>
            <button onclick="deleteHeldOrder('${h.hold_id}')" class="pos-btn px-2.5 py-1.5 bg-[#f1f5f9] hover:bg-[#e2e8f0] text-neutral-600 text-xs rounded-lg border border-[#cbd5e1]"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        container.appendChild(card);

    function renderCart() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';
      const entries = Object.entries(cart);

      if (entries.length === 0) {
        container.innerHTML = `
          <div class="h-36 flex flex-col items-center justify-center text-neutral-400 text-xs">
            <i class="fa-solid fa-receipt text-2xl mb-2 text-neutral-300"></i>
            <span class="font-bold">No Items in Current Ticket</span>
          </div>
        `;
      } else {
        entries.forEach(([key, it]) => {
          const isEligibleBogo = ['1 Veg', '2 Veg', '3 Veg'].includes(it.category) && (it.variant === 'm' || it.variant === 'l');
          const row = document.createElement('div');
          row.className = 'bg-[#f8fafc] border border-[#e2e8f0] rounded-lg p-2 flex items-center justify-between text-xs shadow-xs';
          row.innerHTML = `
            <div class="flex-1 pr-1 truncate">
              <div class="flex items-center space-x-1.5">
                <p class="font-black text-neutral-900 truncate text-[11px]">${it.name.toUpperCase()}</p>
                ${isEligibleBogo && isBogoActive ? '<span class="text-[8px] bg-black text-white px-1.5 py-0.2 rounded font-mono font-black">BOGO</span>' : ''}
              </div>
              <p class="text-[9px] font-bold text-neutral-400">${it.variant !== 'Std' ? '(' + it.variant + ') · ' : ''}₹${it.price}</p>
            </div>
            <div class="flex items-center space-x-1.5 flex-shrink-0">
              <button onclick="updateQty('${key}', -1)" class="w-5 h-5 rounded bg-[#e2e8f0] text-black font-black flex items-center justify-center text-xs">-</button>
              <span class="w-4 text-center font-mono font-black text-black text-xs">${it.qty}</span>
              <button onclick="updateQty('${key}', 1)" class="w-5 h-5 rounded bg-[#e2e8f0] text-black font-black flex items-center justify-center text-xs">+</button>
              <span class="w-12 text-right font-mono font-black text-black text-xs">₹${it.price * it.qty}</span>
              <button onclick="removeItem('${key}')" class="text-neutral-400 hover:text-black pl-1 text-xs"><i class="fa-solid fa-xmark"></i></button>
            </div>
          `;
          container.appendChild(row);
        });
      }

      recalcCart();
    }

    function recalcCart() {
      let sub = 0;
      let totalItemsCount = 0;
      let bogoEligibleUnits = [];

      Object.values(cart).forEach(it => {
        sub += it.price * it.qty;
        totalItemsCount += it.qty;
        if (isBogoActive && ['1 Veg', '2 Veg', '3 Veg'].includes(it.category) && (it.variant === 'm' || it.variant === 'l')) {
          for (let q = 0; q < it.qty; q++) {
            bogoEligibleUnits.push(it.price);
          }
        }
      });

      bogoEligibleUnits.sort((a, b) => a - b);
      let freePizzaCount = Math.floor(bogoEligibleUnits.length / 2);
      let bogoDiscount = 0;
      for (let i = 0; i < freePizzaCount; i++) {
        bogoDiscount += bogoEligibleUnits[i];
      }

      const manualDisc = Math.max(0, parseFloat(document.getElementById('cart-discount').value) || 0);
      const totalDisc = Math.min(sub, bogoDiscount + manualDisc);
      const grand = Math.max(0, sub - totalDisc);

      document.getElementById('cart-subtotal').innerText = `₹${sub}`;
      document.getElementById('cart-grand').innerText = `₹${grand}`;

      const bogoInfo = document.getElementById('bogo-applied-info');
      if (isBogoActive && bogoDiscount > 0) {
        bogoInfo.classList.remove('hidden');
        document.getElementById('bogo-discount-amount').innerText = `-₹${bogoDiscount} (${freePizzaCount} Free)`;
      } else {
        bogoInfo.classList.add('hidden');
      }

      return { sub, disc: manualDisc, bogoDiscount, totalDisc, grand, totalItemsCount };
    }

      btn.className = 'mode-btn py-1 rounded text-[10px] font-black uppercase tracking-wider bg-black text-white';

      if (mode === 'Delivery') {
        document.getElementById('delivery-phone-wrap').classList.remove('hidden');
        document.getElementById('delivery-phone-input').focus();
      } else {
        document.getElementById('delivery-phone-wrap').classList.add('hidden');
      }
    }

      document.querySelectorAll('.pay-btn').forEach(b => {

    }

    function openTableRegister(tbl, holdId = null) {

    function renderSalesReport() {
      const tbody = document.getElementById('sales-table-body');
      tbody.innerHTML = '';

      const now = new Date();
      const pad = n => n.toString().padStart(2, '0');

      let filtered = orders;

      if (activeSalesFilter === 'today') {
        const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
        filtered = orders.filter(o => {
          const d = new Date(o.time);
          return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` === todayStr;
        });
      } else if (activeSalesFilter === 'yesterday') {
        const yest = new Date();
        yest.setDate(now.getDate() - 1);
        const yestStr = `${yest.getFullYear()}-${pad(yest.getMonth() + 1)}-${pad(yest.getDate())}`;
        filtered = orders.filter(o => {
          const d = new Date(o.time);
          return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` === yestStr;
        });
      } else if (activeSalesFilter === 'month') {
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();
        filtered = orders.filter(o => {
          const d = new Date(o.time);
          return d.getFullYear() === currentYear && d.getMonth() === currentMonth;
        });
      }

      let totalSales = 0;
      filtered.forEach(o => totalSales += Number(o.grand_total) || 0);

      document.getElementById('sales-total-amount').innerText = `₹${totalSales.toFixed(2)}`;
      document.getElementById('sales-total-bills').innerText = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-neutral-400 font-bold text-xs">No records found for this period.</td></tr>`;
        return;
      }

      filtered.forEach(o => {
        const dateObj = new Date(o.time);
        const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dateStr = `${pad(dateObj.getDate())}-${pad(dateObj.getMonth() + 1)}-${dateObj.getFullYear()}`;
        const discountVal = (Number(o.discount) || 0) + (Number(o.bogo_discount) || 0);

        const tr = document.createElement('tr');
        tr.className = 'border-b border-[#cbd5e1] hover:bg-[#f8fafc] font-semibold';
        tr.innerHTML = `
          <td class="p-2.5 font-mono font-bold text-black border-r border-[#cbd5e1]">${o.invoice_no}</td>
          <td class="p-2.5 text-neutral-600 border-r border-[#cbd5e1] font-mono">${dateStr} ${timeStr}</td>
          <td class="p-2.5 border-r border-[#cbd5e1]"><span class="px-2 py-0.5 rounded text-[10px] bg-[#f1f5f9] border border-[#cbd5e1] font-black">${o.payment_mode || 'Cash'}</span></td>
          <td class="p-2.5 border-r border-[#cbd5e1] uppercase font-bold">${o.mode}${o.table ? ' (T' + o.table + ')' : ''}</td>
          <td class="p-2.5 border-r border-[#cbd5e1] text-right font-mono text-neutral-500">${discountVal.toFixed(2)}</td>
          <td class="p-2.5 text-right font-mono font-black text-black">₹${Number(o.grand_total).toFixed(2)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function syncToCloud(record) {
      const payload = {
        data: {
          Invoice: record.invoice_no,
          Time: new Date(record.time).toLocaleString(),
          Mode: record.mode + (record.table ? ' T' + record.table : ''),
          Payment: record.payment_mode || 'Cash',
          Discount: (Number(record.discount) || 0) + (Number(record.bogo_discount) || 0),
          Total: Number(record.grand_total) || 0
        }
      };

      fetch(SHEETDB_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => console.error('Cloud Sync Error:', err));
    }

    function fetchCloudSales() {
      fetch(SHEETDB_API)
        .then(res => res.json())
        .then(data => {
          if (Array.isArray(data) && data.length > 0) {
            const cloudOrders = data.map(row => {
              let parsedTime = new Date();
              if (row.Time) {
                const parts = row.Time.split(', ');
                if (parts.length === 2) {
                  const dateParts = parts[0].split('/');
                  if (dateParts.length === 3) {
                    parsedTime = new Date(`${dateParts[2]}-${dateParts[1]}-${dateParts[0]} ${parts[1]}`);
                  }
                } else {
                  parsedTime = new Date(row.Time);
                }
              }

              return {
                invoice_no: row.Invoice ? row.Invoice.toString() : '0000',
                time: isNaN(parsedTime.getTime()) ? new Date().toISOString() : parsedTime.toISOString(),
                mode: row.Mode ? row.Mode.split(' T')[0] : 'Dine In',
                table: row.Mode && row.Mode.includes('T') ? row.Mode.split('T')[1] : null,
                payment_mode: row.Payment || 'Cash',
                discount: Number(row.Discount) || 0,
                bogo_discount: 0,
                grand_total: Number(row.Total) || 0
              };
            }).reverse();

            const existingInvoices = new Set(orders.map(o => o.invoice_no));
            cloudOrders.forEach(co => {
              if (!existingInvoices.has(co.invoice_no)) {
                orders.push(co);
              }
            });

            saveState();
            if (!document.getElementById('view-sales').classList.contains('hidden')) {
              renderSalesReport();
            }
          }
        })
        .catch(err => console.error('Cloud Fetch Error:', err));
    }

    function switchView(view) {
      ['tables', 'register', 'sales', 'held', 'menu'].forEach(v => {
        const el = document.getElementById(`view-${v}`);
        if (el) el.classList.add('hidden');
      });

      const targetView = document.getElementById(`view-${view}`);
      if (targetView) targetView.classList.remove('hidden');

      ['tables', 'sales', 'held', 'menu'].forEach(v => {
        const btn = document.getElementById(`nav-btn-${v}`);
        if (btn) {
          if (v === view) {
            btn.classList.add('bg-white', 'text-black');
            btn.classList.remove('bg-[#1e293b]', 'text-white', 'text-neutral-300');
          } else {
            btn.classList.remove('bg-white', 'text-black');
            btn.classList.add('bg-[#1e293b]', 'text-white');
          }
        }
      });

      if (view === 'tables') renderTableCards();
      if (view === 'sales') {
        fetchCloudSales();
        filterSales('today');
      }
      if (view === 'held') renderHeldOrders();
      if (view === 'menu') renderMenuEditor();
    }

          window.addEventListener('DOMContentLoaded', () => {
      fetchCloudSales();
      switchView('tables');
    });
