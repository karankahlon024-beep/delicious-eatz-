<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Delicious Eatz POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #17181f;
      color: #e2e8f0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-mono { font-family: 'Space Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .brand-red { background-color: #e53935; }
    .brand-red-hover:hover { background-color: #d32f2f; }
    .brand-blue { background-color: #1976d2; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

  <!-- TOP BAR -->
  <header class="bg-[#101116] border-b border-[#2a2d3d] px-2.5 py-1.5 flex items-center justify-between text-xs z-30 flex-shrink-0">
    <div class="flex items-center space-x-1.5">
      <span class="px-1.5 py-0.5 rounded brand-red font-bold text-[9px] text-white">POS</span>
      <span class="font-black tracking-wider text-[11px] text-white">DELICIOUS EATZ</span>
    </div>

    <div class="flex items-center space-x-1.5 font-mono text-neutral-300 text-[10px]">
      <button onclick="switchView('held')" id="btn-held-count" class="px-2 py-0.5 bg-[#252836] hover:bg-[#323648] border border-amber-500/50 rounded text-amber-400 font-sans font-semibold">
        <i class="fa-solid fa-pause mr-0.5"></i> Held (<span id="held-count-badge">0</span>)
      </button>
      <button onclick="switchView('menu')" class="px-2 py-0.5 bg-[#252836] hover:bg-[#323648] border border-neutral-700 rounded text-neutral-200 font-sans">
        <i class="fa-solid fa-pen-to-square mr-0.5"></i> Edit Menu
      </button>
      <button onclick="switchView('orders')" class="px-2 py-0.5 bg-[#252836] hover:bg-[#323648] border border-neutral-700 rounded text-neutral-200 font-sans">
        <i class="fa-solid fa-clock-rotate-left mr-0.5"></i> Orders
      </button>
      <button onclick="switchView('register')" id="btn-back-pos" class="px-2 py-0.5 brand-blue hover:bg-blue-700 rounded text-white font-sans hidden">
        <i class="fa-solid fa-cash-register mr-0.5"></i> POS
      </button>
    </div>
  </header>

  <!-- 1. MAIN TERMINAL -->
  <main id="view-register" class="flex-1 flex flex-row overflow-hidden">
    
    <!-- LEFT PANEL: ITEMS & CATEGORIES -->
    <section class="w-[58%] sm:w-[60%] flex flex-col overflow-hidden bg-[#121319] border-r border-[#2a2d3d]">
      <div class="p-1.5 border-b border-[#2a2d3d] bg-[#181922] flex items-center space-x-1.5 flex-shrink-0">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-[10px] text-neutral-400"></i>
          <input id="item-search" type="text" placeholder="Search menu..." oninput="renderItems()" class="w-full pl-7 pr-2 py-1 bg-[#20222d] border border-neutral-700 rounded-md text-[11px] text-white focus:outline-none focus:border-red-500" />
        </div>
      </div>
      <div id="category-bar" class="flex items-center space-x-1 p-1.5 bg-[#15161f] border-b border-[#2a2d3d] overflow-x-auto no-scrollbar text-xs flex-shrink-0"></div>
      <div id="items-grid" class="flex-1 overflow-y-auto p-1.5 grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-1.5 content-start no-scrollbar"></div>
    </section>

    <!-- RIGHT PANEL: CHECKOUT CONTROLS -->
    <section class="w-[42%] sm:w-[40%] bg-[#1a1b23] flex flex-col overflow-hidden flex-shrink-0">
      <div class="p-1.5 bg-[#14151b] border-b border-[#2a2d3d] text-xs flex-shrink-0 space-y-1.5 shadow-md">
        
        <div class="flex items-center justify-between">
          <div class="grid grid-cols-3 gap-1 flex-1 mr-2">
            <button onclick="setOrderMode('Dine In', this)" class="mode-btn py-0.5 rounded text-[9px] font-bold bg-blue-600 text-white truncate">Dine</button>
            <button onclick="setOrderMode('Takeaway', this)" class="mode-btn py-0.5 rounded text-[9px] font-semibold bg-[#20222d] text-neutral-300 truncate">Away</button>
            <button onclick="setOrderMode('Delivery', this)" class="mode-btn py-0.5 rounded text-[9px] font-semibold bg-[#20222d] text-amber-400 truncate">Deliv</button>
          </div>
          <span id="current-invoice-tag" class="font-mono text-neutral-400 text-[9px]">#PENDING</span>
        </div>

        <div id="table-select-row" class="flex items-center space-x-1 overflow-x-auto no-scrollbar">
          <button onclick="setTable('1', this)" class="table-chip px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/40 text-[9px] font-bold">1</button>
          <button onclick="setTable('2', this)" class="table-chip px-1.5 py-0.5 rounded bg-[#20222d] text-neutral-300 text-[9px]">2</button>
          <button onclick="setTable('3', this)" class="table-chip px-1.5 py-0.5 rounded bg-[#20222d] text-neutral-300 text-[9px]">3</button>
          <button onclick="setTable('4', this)" class="table-chip px-1.5 py-0.5 rounded bg-[#20222d] text-neutral-300 text-[9px]">4</button>
          <button onclick="setTable('5', this)" class="table-chip px-1.5 py-0.5 rounded bg-[#20222d] text-neutral-300 text-[9px]">5</button>
        </div>

        <div id="delivery-phone-wrap" class="hidden">
          <div class="flex items-center bg-[#20222c] border border-amber-500 rounded px-1.5 py-0.5">
            <i class="fa-solid fa-phone text-amber-400 text-[9px] mr-1"></i>
            <input id="delivery-phone-input" type="tel" placeholder="Customer Phone #..." class="w-full bg-transparent text-[10px] text-white placeholder-neutral-500 focus:outline-none font-mono" />
          </div>
        </div>

        <!-- Totals Line -->
        <div class="bg-[#1b1d28] p-1.5 rounded border border-[#2b2e3e] flex flex-col space-y-0.5 text-[10px]">
          <div class="flex items-center justify-between">
            <span class="text-neutral-400">Sub: <strong id="cart-subtotal" class="text-white font-mono">₹0</strong></span>
            <div class="flex items-center space-x-1">
              <span class="text-neutral-400">Disc:</span>
              <input id="cart-discount" type="number" value="0" min="0" oninput="recalcCart()" class="w-10 bg-[#121319] border border-neutral-700 rounded px-1 text-right text-amber-400 font-mono text-[9px]" />
            </div>
            <div class="text-right">
              <span class="text-[9px] text-neutral-400">Net:</span>
              <span id="cart-grand" class="text-emerald-400 font-mono font-black text-sm ml-1">₹0</span>
            </div>
          </div>
          <!-- BOGO line -->
          <div id="bogo-applied-info" class="hidden text-emerald-400 text-[9px] font-bold flex justify-between border-t border-neutral-700/60 pt-0.5">
            <span><i class="fa-solid fa-tag mr-0.5"></i> BOGO Free Item:</span>
            <span id="bogo-discount-amount" class="font-mono">-₹0</span>
          </div>
        </div>

        <!-- Payment Modes -->
        <div class="grid grid-cols-3 gap-1">
          <button onclick="setPayment('Cash', this)" class="pay-btn py-1 rounded text-[9px] font-bold bg-amber-500 text-black">Cash</button>
          <button onclick="setPayment('UPI', this)" class="pay-btn py-1 rounded text-[9px] font-semibold bg-[#252835] text-neutral-300">UPI</button>
          <button onclick="setPayment('Card', this)" class="pay-btn py-1 rounded text-[9px] font-semibold bg-[#252835] text-neutral-300">Card</button>
        </div>

        <!-- Action Row -->
        <div class="grid grid-cols-4 gap-1">
          <button id="btn-bogo-toggle" onclick="toggleBogo()" class="py-1.5 rounded bg-[#20222d] text-neutral-300 hover:bg-[#2a2d3c] border border-neutral-700 text-[10px] font-bold tracking-tight">
            <i class="fa-solid fa-gift mr-0.5 text-amber-400"></i> BOGO
          </button>
          <button onclick="holdCurrentCart()" class="py-1.5 rounded bg-amber-600 hover:bg-amber-500 text-black text-[10px] font-bold tracking-tight">
            <i class="fa-solid fa-pause mr-0.5"></i> Hold
          </button>
          <button onclick="clearCart()" class="py-1.5 rounded bg-neutral-800 hover:bg-neutral-700 text-neutral-300 text-[10px] font-bold tracking-tight">
            <i class="fa-solid fa-trash-can mr-0.5 text-red-400"></i> Clear
          </button>
          <button onclick="settleBillAndPrint()" class="py-1.5 rounded brand-red brand-red-hover text-white text-[10px] font-bold tracking-tight shadow-lg">
            <i class="fa-solid fa-print mr-0.5"></i> Settle
          </button>
        </div>
      </div>

      <!-- Ticket Items List -->
      <div class="flex-1 overflow-y-auto p-1.5 space-y-1 no-scrollbar" id="cart-items-container"></div>
    </section>
  </main>

  <!-- 2. HELD ORDERS VIEW -->
  <main id="view-held" class="flex-1 overflow-y-auto p-3 bg-[#121319] hidden pb-16">
    <div class="max-w-xl mx-auto space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold text-white"><i class="fa-solid fa-pause text-amber-400 mr-1.5"></i> Held Orders</h2>
        <span id="held-total-badge" class="px-2 py-0.5 rounded bg-[#20222d] border border-neutral-700 text-[10px] text-neutral-300 font-mono">0 Held</span>
      </div>
      <div id="held-orders-list" class="space-y-1.5"></div>
    </div>
  </main>

  <!-- 3. EDIT MENU VIEW -->
  <main id="view-menu" class="flex-1 overflow-y-auto p-3 bg-[#121319] hidden pb-16">
    <div class="max-w-xl mx-auto space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold text-white"><i class="fa-solid fa-pen-to-square text-amber-400 mr-1.5"></i> Menu Manager</h2>
        <div class="flex space-x-1.5">
          <button onclick="toggleAddForm()" class="px-2 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-[10px] text-white font-bold">
            <i class="fa-solid fa-plus mr-0.5"></i> Add New
          </button>
          <button onclick="resetMenuToOriginal()" class="px-2 py-1 rounded bg-neutral-800 text-[10px] text-amber-400 border border-neutral-700">
            Reset
          </button>
        </div>
      </div>

      <div id="add-item-card" class="bg-[#1b1c26] border border-emerald-500/40 p-2.5 rounded-xl hidden space-y-2">
        <h3 class="text-xs font-bold text-emerald-400">Add Item</h3>
        <div class="space-y-1.5">
          <div>
            <label class="text-[9px] text-neutral-400 block mb-0.5">Item Name</label>
            <input id="new-item-name" type="text" class="w-full bg-[#13141a] border border-neutral-700 rounded p-1.5 text-xs text-white focus:outline-none" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[9px] text-neutral-400 block mb-0.5">Category</label>
              <select id="new-item-category" class="w-full bg-[#13141a] border border-neutral-700 rounded p-1.5 text-[11px] text-white"></select>
            </div>
            <div>
              <label class="text-[9px] text-neutral-400 block mb-0.5">Pricing Type</label>
              <select id="new-item-type" onchange="toggleSizeInputs(this.value)" class="w-full bg-[#13141a] border border-neutral-700 rounded p-1.5 text-[11px] text-white">
                <option value="single">Single Price</option>
                <option value="sizes">Sizes (R/M/L)</option>
              </select>
            </div>
          </div>
          <div id="new-single-price-wrap">
            <label class="text-[9px] text-neutral-400 block mb-0.5">Price (₹)</label>
            <input id="new-item-price" type="number" class="w-full bg-[#13141a] border border-neutral-700 rounded p-1.5 text-xs text-white font-mono" />
          </div>
          <div id="new-sizes-price-wrap" class="hidden grid grid-cols-3 gap-1.5">
            <div>
              <label class="text-[9px] text-neutral-400 block mb-0.5">Regular</label>
              <input id="new-item-price-reg" type="number" class="w-full bg-[#13141a] border border-neutral-700 rounded p-1 text-xs text-white font-mono" />
            </div>
            <div>
              <label class="text-[9px] text-neutral-400 block mb-0.5">Medium</label>
              <input id="new-item-price-med" type="number" class="w-full bg-[#13141a] border border-neutral-700 rounded p-1 text-xs text-white font-mono" />
            </div>
            <div>
              <label class="text-[9px] text-neutral-400 block mb-0.5">Large</label>
              <input id="new-item-price-lrg" type="number" class="w-full bg-[#13141a] border border-neutral-700 rounded p-1 text-xs text-white font-mono" />
            </div>
          </div>
          <div class="flex justify-end space-x-1.5 pt-1">
            <button onclick="toggleAddForm()" class="px-2.5 py-1 bg-neutral-700 rounded text-[10px] text-neutral-200">Cancel</button>
            <button onclick="saveNewItem()" class="px-3 py-1 bg-emerald-600 rounded text-[10px] text-white font-bold">Save</button>
          </div>
        </div>
      </div>

      <div id="menu-editor-list" class="space-y-1.5"></div>
    </div>
  </main>

  <!-- 4. ORDERS VIEW -->
  <main id="view-orders" class="flex-1 overflow-y-auto p-3 bg-[#121319] hidden">
    <div class="max-w-xl mx-auto">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-xs font-bold text-white"><i class="fa-solid fa-list-check text-amber-400 mr-1.5"></i> Cleared Bills</h2>
        <span id="order-count-badge" class="px-2 py-0.5 rounded bg-[#20222d] border border-neutral-700 text-[10px] text-neutral-300 font-mono">0 Orders</span>
      </div>
      <div id="orders-table" class="space-y-1.5"></div>
    </div>
  </main>

  <!-- VARIANT SIZE MODAL -->
  <div id="size-modal" class="fixed inset-0 bg-black/75 flex items-center justify-center p-3 z-50 hidden">
    <div class="bg-[#1b1c25] border border-[#2d3040] w-full max-w-xs rounded-xl p-3 shadow-2xl">
      <div class="flex justify-between items-center mb-2">
        <h4 id="size-modal-title" class="text-xs font-bold text-white">Select Size</h4>
        <button onclick="closeSizeModal()" class="text-neutral-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="size-modal-options" class="space-y-1.5"></div>
    </div>
  </div>

    function saveState() {
      localStorage.setItem('de_menu_v12', JSON.stringify(menu));

      localStorage.setItem('de_held_orders_v12', JSON.stringify(heldOrders));

    function updateHeldBadge() {
      const count = heldOrders.length;
      document.getElementById('held-count-badge').innerText = count;
      const btn = document.getElementById('btn-held-count');
      if (count > 0) {
        btn.classList.add('border-amber-400', 'text-amber-400');
        btn.classList.remove('border-neutral-700', 'text-neutral-300');
      } else {
        btn.classList.remove('border-amber-400', 'text-amber-400');
        btn.classList.add('border-neutral-700', 'text-neutral-300');
      }
    }

    function toggleBogo() {
      isBogoActive = !isBogoActive;
      const btn = document.getElementById('btn-bogo-toggle');
      if (isBogoActive) {
        btn.classList.remove('bg-[#20222d]', 'text-neutral-300', 'border-neutral-700');
        btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-400');
      } else {

        btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-400');

    function resetMenuToOriginal() {
      if (confirm('Reset all items back to standard prices?')) {
        menu = JSON.parse(JSON.stringify(DEFAULT_MENU));
        saveState();
        renderCategories();
        renderItems();
        renderMenuEditor();
      }

    function getUniqueCategories() {
      const cats = new Set(DEFAULT_CATEGORIES);
      menu.forEach(it => cats.add(it.category));
      return Array.from(cats);
    }

    function renderCategories() {
      const bar = document.getElementById('category-bar');
      bar.innerHTML = '';
      const allCats = ['All', ...getUniqueCategories()];
      allCats.forEach(cat => {
        const btn = document.createElement('button');
        btn.innerText = cat;
        btn.className = `px-2 py-0.5 rounded font-semibold whitespace-nowrap text-[10px] transition ${
          cat === activeCategory ? 'bg-red-600 text-white' : 'bg-[#20222d] text-neutral-300 hover:bg-[#282a38]'
        }`;
        btn.onclick = () => {
          activeCategory = cat;
          renderCategories();
          renderItems();
        };
        bar.appendChild(btn);
      });
    }

    function renderItems() {
      const grid = document.getElementById('items-grid');
      grid.innerHTML = '';
      const query = (document.getElementById('item-search').value || '').toLowerCase();

      const items = menu.filter(it => {
        const matchesCat = activeCategory === 'All' || it.category === activeCategory;
        const matchesQuery = it.name.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      items.forEach(it => {
        const hasSizes = it.price_medium !== undefined && it.price_medium !== null && it.price_medium > 0;
        const btn = document.createElement('button');
        btn.className = `bg-[#1a1b24] hover:bg-[#222430] border border-[#2b2e3e] active:border-red-500 rounded-lg p-1.5 flex flex-col justify-between text-left h-20 transition ${!it.available ? 'opacity-40' : ''}`;
        btn.onclick = () => handleItemSelect(it);

        btn.innerHTML = `

            <span class="text-[7px] font-semibold text-neutral-400 block">${it.category}</span>
            <p class="text-[10px] font-bold text-white line-clamp-2 leading-tight mt-0.5">${it.name}</p>
          </div>
          <div class="flex justify-between items-center w-full mt-1">
            <span class="font-mono text-[11px] font-bold text-amber-400">₹${it.price_regular}</span>
            ${hasSizes ? '<span class="text-[7px] px-1 py-0.2 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30 font-semibold">Sizes</span>' : ''}
          </div>
        `;
        grid.appendChild(btn);
      });

    function handleItemSelect(item) {
      if (!item.available) return alert('This item is currently disabled.');
      if (item.price_medium !== undefined && item.price_medium !== null && item.price_medium > 0) {
        document.getElementById('size-modal-title').innerText = item.name;
        const container = document.getElementById('size-modal-options');
        container.innerHTML = `
          <button onclick="addToCart(${item.id}, 'r', ${item.price_regular})" class="w-full py-1.5 bg-[#232634] hover:bg-[#2c3042] rounded-lg flex justify-between px-2.5 text-xs font-bold text-white">
            <span>Regular (r)</span><span class="font-mono text-amber-400">₹${item.price_regular}</span>
          </button>
          <button onclick="addToCart(${item.id}, 'm', ${item.price_medium})" class="w-full py-1.5 bg-[#232634] hover:bg-[#2c3042] rounded-lg flex justify-between px-2.5 text-xs font-bold text-white">
            <span>Medium (m)</span><span class="font-mono text-amber-400">₹${item.price_medium}</span>
          </button>
          <button onclick="addToCart(${item.id}, 'l', ${item.price_large})" class="w-full py-1.5 bg-[#232634] hover:bg-[#2c3042] rounded-lg flex justify-between px-2.5 text-xs font-bold text-white">
            <span>Large (l)</span><span class="font-mono text-amber-400">₹${item.price_large}</span>
          </button>
        `;
        document.getElementById('size-modal').classList.remove('hidden');
      } else {
        addToCart(item.id, 'Std', item.price_regular);
      }
    }

    function closeSizeModal() {
      document.getElementById('size-modal').classList.add('hidden');
    }

    function addToCart(id, variant, price) {
      const item = menu.find(i => i.id === id);
      const key = `${id}_${variant}`;
      if (cart[key]) {
        cart[key].qty += 1;
      } else {
        cart[key] = { id, name: item.name, category: item.category, variant, price, qty: 1 };
      }
      closeSizeModal();
      renderCart();
    }

    function updateQty(key, delta) {
      if (cart[key]) {
        cart[key].qty += delta;
        if (cart[key].qty <= 0) delete cart[key];
      }
      renderCart();
    }

    function removeItem(key) {
      delete cart[key];
      renderCart();
    }

    function clearCart() {
      if (Object.keys(cart).length === 0) return;
      if (confirm('Clear running order?')) resetCartFields();
    }

    function resetCartFields() {
      cart = {};
      document.getElementById('cart-discount').value = 0;
      document.getElementById('delivery-phone-input').value = '';
      if (isBogoActive) toggleBogo();
      renderCart();
    }

    function holdCurrentCart() {
      const itemsInCart = Object.values(cart);
      if (itemsInCart.length === 0) return alert('Cart is empty.');

      const { sub, disc, bogoDiscount, grand } = recalcCart();
      const phone = document.getElementById('delivery-phone-input').value.trim();

      const heldEntry = {
        hold_id: `HOLD-${Date.now().toString().slice(-4)}`,
        timestamp: new Date().toISOString(),
        mode: currentOrderMode,
        table: currentOrderMode === 'Dine In' ? selectedTable : null,
        phone: phone || null,
        cart: JSON.parse(JSON.stringify(cart)),
        isBogoActive: isBogoActive,
        bogoDiscount: bogoDiscount,
        discount: disc,
        grand: grand
      };

      heldOrders.unshift(heldEntry);
      saveState();
      resetCartFields();
      alert(`Order #${heldEntry.hold_id} placed on HOLD.`);
    }

    function resumeHeldOrder(holdId) {
      const idx = heldOrders.findIndex(h => h.hold_id === holdId);
      if (idx === -1) return;

      const target = heldOrders[idx];
      cart = JSON.parse(JSON.stringify(target.cart));
      document.getElementById('cart-discount').value = target.discount || 0;
      if (target.phone) document.getElementById('delivery-phone-input').value = target.phone;
      
      if (target.isBogoActive !== isBogoActive) {
        toggleBogo();
      }

      heldOrders.splice(idx, 1);
      saveState();
      switchView('register');
      renderCart();
    }

    function deleteHeldOrder(holdId) {
      if (confirm('Delete this held order?')) {
        heldOrders = heldOrders.filter(h => h.hold_id !== holdId);
        saveState();
        renderHeldOrders();
      }
    }

    function renderHeldOrders() {
      const container = document.getElementById('held-orders-list');
      container.innerHTML = '';
      document.getElementById('held-total-badge').innerText = `${heldOrders.length} Held`;

      if (heldOrders.length === 0) {
        container.innerHTML = '<p class="text-neutral-500 text-xs py-8 text-center">No orders currently on hold.</p>';

      heldOrders.forEach(h => {
        const card = document.createElement('div');
        card.className = 'bg-[#1a1b24] border border-amber-500/40 p-2.5 rounded-lg flex justify-between items-center text-xs';

              ${h.isBogoActive ? '<span class="px-1 py-0.2 rounded text-[8px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold">BOGO</span>' : ''}
            </div>
            <p class="text-[10px] text-neutral-300 line-clamp-1 mt-0.5">${summaryItems}</p>
            <p class="font-mono font-bold text-emerald-400 text-xs mt-1">₹${h.grand}</p>
          </div>
          <div class="flex items-center space-x-1.5">
            <button onclick="resumeHeldOrder('${h.hold_id}')" class="px-2.5 py-1 bg-amber-500 hover:bg-amber-400 text-black text-[10px] font-bold rounded">Resume</button>
            <button onclick="deleteHeldOrder('${h.hold_id}')" class="px-2 py-1 bg-neutral-800 hover:bg-red-500/20 text-neutral-400 hover:text-red-400 text-[10px] rounded border border-neutral-700"><i class="fa-solid fa-trash"></i></button>
          </div>

    function renderCart() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';
      const entries = Object.entries(cart);

      if (entries.length === 0) {
        container.innerHTML = `
          <div class="h-24 flex flex-col items-center justify-center text-neutral-600 text-[11px]">
            <i class="fa-solid fa-receipt text-lg mb-1"></i>
            <span>No items in order</span>
          </div>
        `;
      } else {
        entries.forEach(([key, it]) => {
          const isEligibleBogo = ['1 Veg', '2 Veg', '3 Veg'].includes(it.category) && (it.variant === 'm' || it.variant === 'l');
          const row = document.createElement('div');
          row.className = 'bg-[#15161d] border border-[#262837] rounded p-1.5 flex items-center justify-between text-[11px]';
          row.innerHTML = `
            <div class="flex-1 pr-1 truncate">
              <div class="flex items-center space-x-1">
                <p class="font-bold text-white truncate text-[10px]">${it.name.toUpperCase()}</p>
                ${isEligibleBogo && isBogoActive ? '<span class="text-[7px] bg-emerald-500/20 text-emerald-400 px-1 py-0.2 rounded border border-emerald-500/30 font-mono">BOGO</span>' : ''}
              </div>
              <p class="text-[8px] text-neutral-400">${it.variant !== 'Std' ? '(' + it.variant + ') · ' : ''}₹${it.price}</p>
            </div>
            <div class="flex items-center space-x-1 flex-shrink-0">
              <button onclick="updateQty('${key}', -1)" class="w-4 h-4 rounded bg-[#20222d] text-white font-bold flex items-center justify-center text-[10px]">-</button>
              <span class="w-3 text-center font-mono font-bold text-amber-400 text-[10px]">${it.qty}</span>
              <button onclick="updateQty('${key}', 1)" class="w-4 h-4 rounded bg-[#20222d] text-white font-bold flex items-center justify-center text-[10px]">+</button>
              <span class="w-9 text-right font-mono font-bold text-white text-[10px]">₹${it.price * it.qty}</span>
              <button onclick="removeItem('${key}')" class="text-neutral-500 hover:text-red-400 pl-0.5 text-[9px]"><i class="fa-solid fa-xmark"></i></button>
            </div>
          `;
          container.appendChild(row);
        });
      }

      recalcCart();
    }

    function recalcCart() {
      let sub = 0;
      let totalItemsCount = 0;
      let bogoEligibleUnits = [];

      Object.values(cart).forEach(it => {
        sub += it.price * it.qty;
        totalItemsCount += it.qty;
        if (isBogoActive && ['1 Veg', '2 Veg', '3 Veg'].includes(it.category) && (it.variant === 'm' || it.variant === 'l')) {
          for (let q = 0; q < it.qty; q++) {
            bogoEligibleUnits.push(it.price);
          }
        }
      });

      bogoEligibleUnits.sort((a, b) => a - b);
      let freePizzaCount = Math.floor(bogoEligibleUnits.length / 2);
      let bogoDiscount = 0;
      for (let i = 0; i < freePizzaCount; i++) {
        bogoDiscount += bogoEligibleUnits[i];
      }

      const manualDisc = Math.max(0, parseFloat(document.getElementById('cart-discount').value) || 0);
      const totalDisc = Math.min(sub, bogoDiscount + manualDisc);
      const grand = Math.max(0, sub - totalDisc);

      document.getElementById('cart-subtotal').innerText = `₹${sub}`;
      document.getElementById('cart-grand').innerText = `₹${grand}`;

      const bogoInfo = document.getElementById('bogo-applied-info');
      if (isBogoActive && bogoDiscount > 0) {
        bogoInfo.classList.remove('hidden');
        document.getElementById('bogo-discount-amount').innerText = `-₹${bogoDiscount} (${freePizzaCount} Free)`;
      } else {
        bogoInfo.classList.add('hidden');
      }

      return { sub, disc: manualDisc, bogoDiscount, totalDisc, grand, totalItemsCount };
    }

        </head>
        <body>
          <div class="center">
            <div class="title">Delicious Eatz</div>
            <div class="subtitle">Vop Budhabarh Tehsil Hajipur Dist Hoshiarpur</div>
            <div class="subtitle" style="font-weight: 600;">Ph: 7888950664, 8360084534</div>
          </div>

          <hr class="solid-hr" />

          <div class="name-row">Name:</div>

          <hr class="solid-hr" />

          <div class="meta-grid">
            <div>Date: ${dateFormatted}</div>
            <div class="bold">${currentOrderMode === 'Dine In' ? 'Dine In: ' + selectedTable : currentOrderMode}</div>
          </div>
          <div class="meta-grid">
            <div>${timeFormatted}</div>
            <div></div>
          </div>
          <div class="meta-grid">
            <div>Cashier: biller</div>
            <div>Bill No.: ${invoiceNo}</div>
          </div>

          <hr class="thick-hr" />

          <table>
            <thead>
              <tr>
                <th style="text-align: left; width: 44%;">Item</th>
                <th style="text-align: center; width: 14%;">Qty.</th>
                <th style="text-align: right; width: 21%;">Price</th>
                <th style="text-align: right; width: 21%;">Amount</th>
              </tr>
            </thead>
          </table>

          <hr class="thick-hr" />

          <table>
            <tbody>
              ${itemRows}
            </tbody>
          </table>

          <hr class="solid-hr" style="margin-top: 6px;" />

          <div class="meta-grid bold" style="font-size: 13px;">
            <div>Total Qty: ${totalItemsCount}</div>
            <div style="text-align: right;">Sub Total &nbsp; ${parseFloat(sub).toFixed(2)}</div>
          </div>

          <hr class="thick-hr" />

          <div class="grand-box">
            <span style="font-size: 14.5px;">Grand Total</span>
            <span>₹ ${parseFloat(grand).toFixed(2)}</span>
          </div>

          <hr class="thick-hr" />

          <div class="center bold" style="font-size: 13.5px; padding: 4px 0 2px;">

        </body>
        </html>
      `;

      let printFrame = document.getElementById('print-iframe');
      if (!printFrame) {
        printFrame = document.createElement('iframe');
        printFrame.id = 'print-iframe';
        printFrame.style.position = 'fixed';
        printFrame.style.right = '0';
        printFrame.style.bottom = '0';
        printFrame.style.width = '0';
        printFrame.style.height = '0';
        printFrame.style.border = '0';
        document.body.appendChild(printFrame);
      }

      const frameDoc = printFrame.contentWindow.document;
      frameDoc.open();
      frameDoc.write(receiptHTML);
      frameDoc.close();

      setTimeout(() => {
        printFrame.contentWindow.focus();
        printFrame.contentWindow.print();
        resetCartFields();
      }, 300);
    }

    // MENU EDIT & ADD
    function toggleAddForm() {
      const card = document.getElementById('add-item-card');
      card.classList.toggle('hidden');
      if (!card.classList.contains('hidden')) {
        populateCategoryDropdown();
        document.getElementById('new-item-name').focus();
      }
    }

    function populateCategoryDropdown() {
      const select = document.getElementById('new-item-category');
      select.innerHTML = '';
      getUniqueCategories().forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.innerText = c;
        select.appendChild(opt);
      });
    }

    function toggleSizeInputs(type) {
      if (type === 'sizes') {
        document.getElementById('new-single-price-wrap').classList.add('hidden');
        document.getElementById('new-sizes-price-wrap').classList.remove('hidden');
      } else {
        document.getElementById('new-single-price-wrap').classList.remove('hidden');
        document.getElementById('new-sizes-price-wrap').classList.add('hidden');
      }
    }

    function saveNewItem() {
      const name = document.getElementById('new-item-name').value.trim();
      const category = document.getElementById('new-item-category').value;
      const type = document.getElementById('new-item-type').value;

      if (!name) return alert('Enter item name');

      const newItem = { id: Date.now(), name, category, available: true };
      if (type === 'sizes') {
        newItem.price_regular = parseFloat(document.getElementById('new-item-price-reg').value) || 0;
        newItem.price_medium = parseFloat(document.getElementById('new-item-price-med').value) || 0;
        newItem.price_large = parseFloat(document.getElementById('new-item-price-lrg').value) || 0;
      } else {
        newItem.price_regular = parseFloat(document.getElementById('new-item-price').value) || 0;
      }

      menu.unshift(newItem);
      saveState();
      toggleAddForm();
      renderCategories();
      renderItems();
      renderMenuEditor();
    }

    function deleteItem(id) {
      if (confirm('Delete item?')) {
        menu = menu.filter(it => it.id !== id);
        saveState();
        renderCategories();
        renderItems();
        renderMenuEditor();
      }
    }

    function renderMenuEditor() {
      const container = document.getElementById('menu-editor-list');
      container.innerHTML = '';

      menu.forEach(it => {
        const card = document.createElement('div');
        card.className = 'bg-[#1a1b24] border border-[#2a2d3d] p-2 rounded-lg flex items-center justify-between text-xs';
        card.innerHTML = `
          <div class="flex-1 pr-2">
            <div class="flex items-center space-x-2">
              <p class="font-bold text-white text-[11px]">${it.name}</p>
              <button onclick="deleteItem(${it.id})" class="text-neutral-500 hover:text-red-400 text-[10px]"><i class="fa-solid fa-trash"></i></button>
            </div>
            <p class="text-[9px] text-neutral-400">${it.category}</p>
            <div class="flex items-center space-x-1.5 mt-1">
              <span class="text-[9px] text-amber-400 font-bold">₹</span>
              <input type="number" value="${it.price_regular}" onchange="updatePrice(${it.id}, 'price_regular', this.value)" class="w-14 bg-[#20222d] border border-neutral-700 rounded px-1 py-0.5 text-white text-[10px] font-mono" />
            </div>
          </div>
          <button onclick="toggleItemStatus(${it.id})" class="px-2 py-1 rounded text-[10px] font-bold ${it.available ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-red-500/20 text-red-400 border border-red-500/30'}">
            ${it.available ? 'Active' : 'Disabled'}
          </button>
        `;
        container.appendChild(card);
      });
    }

    function updatePrice(id, field, value) {
      const item = menu.find(i => i.id === id);
      if (item) {
        item[field] = parseFloat(value) || 0;
        saveState();
        renderItems();
      }
    }

    function toggleItemStatus(id) {
      const item = menu.find(i => i.id === id);
      if (item) {
        item.available = !item.available;
        saveState();
        renderItems();
        renderMenuEditor();
      }
    }

    function switchView(view) {
      ['register', 'held', 'menu', 'orders'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden'));
      document.getElementById(`view-${view}`).classList.remove('hidden');
      const btnBack = document.getElementById('btn-back-pos');
      if (view === 'register') {
        btnBack.classList.add('hidden');
      } else {
        btnBack.classList.remove('hidden');
        if (view === 'held') renderHeldOrders();
        if (view === 'menu') renderMenuEditor();
        if (view === 'orders') renderOrders();
      }
    }

    function renderOrders() {
      const container = document.getElementById('orders-table');
      container.innerHTML = '';
      document.getElementById('order-count-badge').innerText = `${orders.length} Bills`;

      orders.forEach(o => {
        const card = document.createElement('div');
        card.className = 'bg-[#1a1b24] border border-[#2a2d3d] p-2.5 rounded-lg flex justify-between items-center text-xs';
        card.innerHTML = `
          <div>
            <div class="flex items-center space-x-1.5">
              <span class="font-mono font-bold text-white text-[11px]">${o.invoice_no}</span>
              <span class="px-1.5 py-0.5 rounded text-[9px] bg-amber-500/10 text-amber-400 font-semibold">${o.mode}</span>
              <span class="px-1.5 py-0.5 rounded text-[9px] bg-blue-500/10 text-blue-400">${o.payment_mode}</span>
              ${o.bogo_discount > 0 ? '<span class="px-1 py-0.2 rounded text-[8px] bg-emerald-500/20 text-emerald-400 font-bold">BOGO</span>' : ''}
            </div>
            <p class="text-neutral-400 text-[9px] mt-0.5">${new Date(o.time).toLocaleString()}</p>
          </div>
          <p class="text-sm font-black font-mono text-emerald-400">₹${o.grand_total}</p>
        `;
        container.appendChild(card);
      });
    }

    renderCategories();
    renderItems();
    renderCart();
    updateHeldBadge();
  </script>
</body>
</html>
