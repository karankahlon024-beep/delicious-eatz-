<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Delicious Eatz POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f5f7;
      color: #111827;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col bg-[#eef0f3]">

  <!-- TOP HEADER (BLACK THEME) -->
  <header class="bg-[#111827] text-white px-2.5 py-1.5 flex items-center justify-between text-xs z-30 flex-shrink-0 shadow-sm border-b border-black">
    <div class="flex items-center space-x-2">
      <button onclick="switchView('tables')" class="bg-black hover:bg-neutral-800 text-white font-extrabold px-2.5 py-1 rounded text-[11px] tracking-wider border border-neutral-700">
        <i class="fa-solid fa-layer-group mr-1 text-[10px]"></i> TABLES
      </button>
      <button onclick="startDirectOrder()" class="bg-neutral-800 hover:bg-neutral-700 text-white px-2.5 py-1 rounded text-[10px] font-bold border border-neutral-700">
        + New Order
      </button>
      <span class="text-[12px] font-extrabold tracking-wide text-neutral-200 hidden sm:inline ml-1">
        DELICIOUS EATZ
      </span>
      <span class="text-neutral-400 text-[10px] hidden md:inline">| Budhabarh</span>
    </div>

    <!-- Right Utilities -->
    <div class="flex items-center space-x-1.5 text-[10px]">
      <button onclick="switchView('sales')" class="bg-white hover:bg-neutral-100 text-black font-extrabold px-2.5 py-1 rounded shadow-sm flex items-center">
        <i class="fa-solid fa-chart-pie mr-1"></i> Sales Report
      </button>
      <button onclick="switchView('held')" class="bg-neutral-800 hover:bg-neutral-700 text-amber-300 border border-neutral-700 font-bold px-2 py-1 rounded">
        Held (<span id="held-count-badge">0</span>)
      </button>
      <button onclick="switchView('menu')" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-200 border border-neutral-700 font-semibold px-2 py-1 rounded">
        Menu Manager
      </button>
    </div>
  </header>

  <!-- 1. TABLE LAYOUT (MAIN FACE) -->
  <main id="view-tables" class="flex-1 flex flex-col p-2 bg-[#eef0f3] overflow-y-auto">
    <div class="bg-white border border-neutral-300 rounded p-1.5 flex items-center justify-between shadow-sm mb-2">
      <div class="flex items-center space-x-2">
        <span class="font-extrabold text-xs text-neutral-900 tracking-wide uppercase">Table Layout</span>
        <span class="text-[10px] bg-neutral-100 text-neutral-600 px-1.5 py-0.5 rounded border border-neutral-200 font-semibold">Dine In</span>
      </div>

      <div class="flex items-center space-x-1.5">
        <button onclick="setModeAndOpen('Delivery')" class="bg-black hover:bg-neutral-800 text-white font-bold text-[11px] px-3 py-1 rounded shadow-sm">
          <i class="fa-solid fa-motorcycle mr-1"></i> Delivery
        </button>
        <button onclick="setModeAndOpen('Takeaway')" class="bg-black hover:bg-neutral-800 text-white font-bold text-[11px] px-3 py-1 rounded shadow-sm">
          <i class="fa-solid fa-bag-shopping mr-1"></i> Pick Up
        </button>
      </div>
    </div>

    <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2">
      <button onclick="openTableRegister('1')" class="h-20 bg-white hover:bg-neutral-50 border-2 border-neutral-400 hover:border-black rounded-lg flex flex-col items-center justify-center p-1 shadow-sm transition">
        <span class="text-lg font-black text-neutral-900">1</span>
        <span class="text-[9px] text-neutral-500 font-bold uppercase mt-0.5">Table 1</span>
      </button>
      <button onclick="openTableRegister('2')" class="h-20 bg-white hover:bg-neutral-50 border-2 border-neutral-400 hover:border-black rounded-lg flex flex-col items-center justify-center p-1 shadow-sm transition">
        <span class="text-lg font-black text-neutral-900">2</span>
        <span class="text-[9px] text-neutral-500 font-bold uppercase mt-0.5">Table 2</span>
      </button>
      <button onclick="openTableRegister('3')" class="h-20 bg-white hover:bg-neutral-50 border-2 border-neutral-400 hover:border-black rounded-lg flex flex-col items-center justify-center p-1 shadow-sm transition">
        <span class="text-lg font-black text-neutral-900">3</span>
        <span class="text-[9px] text-neutral-500 font-bold uppercase mt-0.5">Table 3</span>
      </button>
      <button onclick="openTableRegister('4')" class="h-20 bg-white hover:bg-neutral-50 border-2 border-neutral-400 hover:border-black rounded-lg flex flex-col items-center justify-center p-1 shadow-sm transition">
        <span class="text-lg font-black text-neutral-900">4</span>
        <span class="text-[9px] text-neutral-500 font-bold uppercase mt-0.5">Table 4</span>
      </button>
      <button onclick="openTableRegister('5')" class="h-20 bg-white hover:bg-neutral-50 border-2 border-neutral-400 hover:border-black rounded-lg flex flex-col items-center justify-center p-1 shadow-sm transition">
        <span class="text-lg font-black text-neutral-900">5</span>
        <span class="text-[9px] text-neutral-500 font-bold uppercase mt-0.5">Table 5</span>
      </button>
    </div>
  </main>

  <!-- 2. REGISTER / BILLING -->
  <main id="view-register" class="flex-1 flex flex-row overflow-hidden hidden bg-white">
    <!-- LEFT: MENU ITEMS -->
    <section class="w-[58%] sm:w-[60%] flex flex-col overflow-hidden bg-[#fafbfc] border-r border-neutral-300">
      <div class="p-1.5 border-b border-neutral-300 bg-white flex items-center space-x-1.5 flex-shrink-0">
        <button onclick="switchView('tables')" class="px-2 py-1 bg-neutral-100 hover:bg-neutral-200 border border-neutral-300 rounded text-[10px] font-extrabold text-neutral-800">
          <i class="fa-solid fa-arrow-left mr-0.5"></i> Tables
        </button>
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-[10px] text-neutral-400"></i>
          <input id="item-search" type="text" placeholder="Search menu..." oninput="renderItems()" class="w-full pl-7 pr-2 py-1 bg-white border border-neutral-300 rounded text-[11px] text-black focus:outline-none focus:border-black" />
        </div>
      </div>

      <!-- Scrollable Category Ribbon -->
      <div class="relative flex items-center bg-neutral-100 border-b border-neutral-300 px-1 py-1 flex-shrink-0">
        <button onclick="scrollCategories(-120)" class="w-5 h-6 bg-white hover:bg-neutral-200 border border-neutral-300 rounded flex items-center justify-center text-[10px] text-neutral-800 font-bold mr-1 flex-shrink-0 shadow-xs">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div id="category-bar" onwheel="handleCatWheel(event)" class="flex-1 flex items-center space-x-1 overflow-x-auto no-scrollbar scroll-smooth"></div>
        <button onclick="scrollCategories(120)" class="w-5 h-6 bg-white hover:bg-neutral-200 border border-neutral-300 rounded flex items-center justify-center text-[10px] text-neutral-800 font-bold ml-1 flex-shrink-0 shadow-xs">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Items Grid -->
      <div id="items-grid" class="flex-1 overflow-y-auto p-1.5 grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-1.5 content-start no-scrollbar"></div>
    </section>

    <!-- RIGHT: CART & CONTROLS -->
    <section class="w-[42%] sm:w-[40%] bg-white flex flex-col overflow-hidden flex-shrink-0 border-l border-neutral-200">
      <div class="p-1.5 bg-neutral-50 border-b border-neutral-300 text-xs flex-shrink-0 space-y-1.5 shadow-sm">
        
        <div class="flex items-center justify-between">
          <div class="grid grid-cols-3 gap-1 flex-1 mr-2">
            <button onclick="setOrderMode('Dine In', this)" class="mode-btn py-0.5 rounded text-[9px] font-extrabold bg-black text-white truncate">Dine In</button>
            <button onclick="setOrderMode('Takeaway', this)" class="mode-btn py-0.5 rounded text-[9px] font-bold bg-white border border-neutral-300 text-neutral-700 truncate">Pick Up</button>
            <button onclick="setOrderMode('Delivery', this)" class="mode-btn py-0.5 rounded text-[9px] font-bold bg-white border border-neutral-300 text-neutral-700 truncate">Delivery</button>
          </div>
          <span id="current-invoice-tag" class="font-mono text-neutral-800 text-[10px] font-black">#TBL-1</span>
        </div>

        <div id="table-select-row" class="flex items-center space-x-1 overflow-x-auto no-scrollbar">
          <button onclick="setTable('1', this)" class="table-chip px-1.5 py-0.5 rounded bg-black text-white border border-black text-[9px] font-black">T1</button>
          <button onclick="setTable('2', this)" class="table-chip px-1.5 py-0.5 rounded bg-white text-neutral-700 border border-neutral-300 text-[9px]">T2</button>
          <button onclick="setTable('3', this)" class="table-chip px-1.5 py-0.5 rounded bg-white text-neutral-700 border border-neutral-300 text-[9px]">T3</button>
          <button onclick="setTable('4', this)" class="table-chip px-1.5 py-0.5 rounded bg-white text-neutral-700 border border-neutral-300 text-[9px]">T4</button>
          <button onclick="setTable('5', this)" class="table-chip px-1.5 py-0.5 rounded bg-white text-neutral-700 border border-neutral-300 text-[9px]">T5</button>
        </div>

        <div id="delivery-phone-wrap" class="hidden">
          <div class="flex items-center bg-white border border-amber-500 rounded px-1.5 py-0.5">
            <i class="fa-solid fa-phone text-amber-600 text-[9px] mr-1"></i>
            <input id="delivery-phone-input" type="tel" placeholder="Customer Phone #..." class="w-full bg-transparent text-[10px] text-black placeholder-neutral-400 focus:outline-none font-mono" />
          </div>
        </div>

        <!-- Totals Line -->
        <div class="bg-white p-1.5 rounded border border-neutral-300 flex flex-col space-y-0.5 text-[10px]">
          <div class="flex items-center justify-between">
            <span class="text-neutral-600">Sub: <strong id="cart-subtotal" class="text-black font-mono">₹0</strong></span>
            <div class="flex items-center space-x-1">
              <span class="text-neutral-600">Disc:</span>
              <input id="cart-discount" type="number" value="0" min="0" oninput="recalcCart()" class="w-10 bg-neutral-50 border border-neutral-300 rounded px-1 text-right text-black font-mono font-bold text-[9px]" />
            </div>
            <div class="text-right">
              <span class="text-[9px] text-neutral-500">Net:</span>
              <span id="cart-grand" class="text-black font-mono font-black text-sm ml-1">₹0</span>
            </div>
          </div>
          <div id="bogo-applied-info" class="hidden text-emerald-700 text-[9px] font-bold flex justify-between border-t border-neutral-200 pt-0.5">
            <span><i class="fa-solid fa-tag mr-0.5"></i> BOGO Free Item:</span>
            <span id="bogo-discount-amount" class="font-mono">-₹0</span>
          </div>
        </div>

        <!-- Payment Modes -->
        <div class="grid grid-cols-3 gap-1">
          <button onclick="setPayment('Cash', this)" class="pay-btn py-1 rounded text-[9px] font-black bg-amber-400 text-black border border-amber-500">Cash</button>
          <button onclick="setPayment('UPI', this)" class="pay-btn py-1 rounded text-[9px] font-bold bg-white border border-neutral-300 text-neutral-700">UPI</button>
          <button onclick="setPayment('Card', this)" class="pay-btn py-1 rounded text-[9px] font-bold bg-white border border-neutral-300 text-neutral-700">Card</button>
        </div>

        <!-- Actions -->
        <div class="grid grid-cols-5 gap-1">
          <button onclick="printOnlyKOT()" class="py-1.5 rounded bg-neutral-800 hover:bg-neutral-900 text-white text-[10px] font-extrabold tracking-tight shadow-sm">
            KOT
          </button>
          <button id="btn-bogo-toggle" onclick="toggleBogo()" class="py-1.5 rounded bg-white text-neutral-800 hover:bg-neutral-100 border border-neutral-300 text-[10px] font-extrabold tracking-tight">
            BOGO
          </button>
          <button onclick="holdCurrentCart()" class="py-1.5 rounded bg-amber-500 hover:bg-amber-600 text-black text-[10px] font-black tracking-tight">
            Hold
          </button>
          <button onclick="clearCart()" class="py-1.5 rounded bg-neutral-200 hover:bg-neutral-300 text-neutral-800 text-[10px] font-bold tracking-tight">
            Clear
          </button>
          <button onclick="settleBillAndPrint()" class="py-1.5 rounded bg-black hover:bg-neutral-800 text-white text-[10px] font-black tracking-tight shadow-md">
            Settle
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-1.5 space-y-1 no-scrollbar bg-white" id="cart-items-container"></div>
    </section>
  </main>

  <!-- 3. SALES REPORT -->
  <main id="view-sales" class="flex-1 flex flex-col p-2 bg-[#eef0f3] overflow-y-auto hidden">
    <div class="bg-white border border-neutral-300 rounded-t p-2 shadow-sm flex flex-col space-y-2">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xs font-black uppercase text-neutral-900">Sales Summary</h2>
          <p id="sales-report-date-tag" class="text-[10px] text-neutral-500">Sales Report : Today</p>
        </div>
        <div class="flex items-center space-x-1.5">
          <button id="btn-sales-yesterday" onclick="filterSales('yesterday')" class="px-3 py-1 bg-neutral-100 hover:bg-neutral-200 border border-neutral-300 rounded text-[10px] font-bold text-neutral-700">
            Yesterday Sales
          </button>
          <button id="btn-sales-today" onclick="filterSales('today')" class="px-3 py-1 bg-black text-white rounded text-[10px] font-bold shadow-sm">
            Today Sales
          </button>
          <button onclick="switchView('tables')" class="px-2.5 py-1 bg-neutral-200 text-neutral-700 rounded text-[10px] font-bold">
            Close
          </button>
        </div>
      </div>

      <div class="bg-neutral-50 border border-neutral-300 rounded p-1.5 flex items-center justify-between text-xs">
        <span class="font-bold text-neutral-800">Total Net Sales: <strong id="sales-total-amount" class="text-base text-black font-mono font-black">₹0.00</strong></span>
        <span class="font-semibold text-neutral-600 text-[11px]">Total Bills: <strong id="sales-total-bills" class="font-mono text-black font-bold">0</strong></span>
      </div>
    </div>

    <div class="bg-white border-x border-b border-neutral-300 rounded-b flex-1 overflow-y-auto no-scrollbar shadow-sm">
      <table class="w-full text-left text-[11px] border-collapse">
        <thead class="bg-neutral-100 border-b border-neutral-300 text-neutral-700 font-extrabold sticky top-0">
          <tr>
            <th class="p-2 border-r border-neutral-200">Order No.</th>
            <th class="p-2 border-r border-neutral-200">Date & Time</th>
            <th class="p-2 border-r border-neutral-200">Payment</th>
            <th class="p-2 border-r border-neutral-200">Order Type</th>
            <th class="p-2 border-r border-neutral-200 text-right">Discount (₹)</th>
            <th class="p-2 text-right">Amount (₹)</th>
          </tr>
        </thead>
        <tbody id="sales-table-body"></tbody>
      </table>
    </div>
  </main>

  <!-- 4. HELD ORDERS -->
  <main id="view-held" class="flex-1 overflow-y-auto p-3 bg-[#eef0f3] hidden pb-16">
    <div class="max-w-xl mx-auto space-y-3">
      <div class="flex justify-between items-center bg-white p-2 rounded border border-neutral-300">
        <h2 class="text-xs font-black text-neutral-900 uppercase"><i class="fa-solid fa-pause text-amber-500 mr-1.5"></i> Held Orders</h2>
        <span id="held-total-badge" class="px-2 py-0.5 rounded bg-neutral-100 border border-neutral-300 text-[10px] text-neutral-800 font-mono font-bold">0 Held</span>
      </div>
      <div id="held-orders-list" class="space-y-1.5"></div>
    </div>
  </main>

  <!-- 5. EDIT MENU -->
  <main id="view-menu" class="flex-1 overflow-y-auto p-3 bg-[#eef0f3] hidden pb-16">
    <div class="max-w-xl mx-auto space-y-3">
      <div class="flex justify-between items-center bg-white p-2 rounded border border-neutral-300">
        <h2 class="text-xs font-black text-neutral-900 uppercase"><i class="fa-solid fa-pen-to-square mr-1.5"></i> Menu Manager</h2>
        <div class="flex space-x-1.5">
          <button onclick="toggleAddForm()" class="px-2 py-1 rounded bg-black hover:bg-neutral-800 text-[10px] text-white font-bold">
            + Add New
          </button>
          <button onclick="resetMenuToOriginal()" class="px-2 py-1 rounded bg-neutral-200 text-[10px] text-neutral-800 font-bold">
            Reset Defaults
          </button>
        </div>
      </div>

      <div id="add-item-card" class="bg-white border border-neutral-300 p-2.5 rounded-lg hidden space-y-2 shadow-sm">
        <h3 class="text-xs font-black text-neutral-900">Add Item</h3>
        <div class="space-y-1.5">
          <div>
            <label class="text-[9px] text-neutral-500 block mb-0.5">Item Name</label>
            <input id="new-item-name" type="text" class="w-full bg-neutral-50 border border-neutral-300 rounded p-1.5 text-xs text-black focus:outline-none font-bold" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[9px] text-neutral-500 block mb-0.5">Category</label>
              <select id="new-item-category" class="w-full bg-neutral-50 border border-neutral-300 rounded p-1.5 text-[11px] text-black font-semibold"></select>
            </div>
            <div>
              <label class="text-[9px] text-neutral-500 block mb-0.5">Pricing Type</label>
              <select id="new-item-type" onchange="toggleSizeInputs(this.value)" class="w-full bg-neutral-50 border border-neutral-300 rounded p-1.5 text-[11px] text-black">
                <option value="single">Single Price</option>
                <option value="sizes">Sizes (R/M/L)</option>
              </select>
            </div>
          </div>
          <div id="new-single-price-wrap">
            <label class="text-[9px] text-neutral-500 block mb-0.5">Price (₹)</label>
            <input id="new-item-price" type="number" class="w-full bg-neutral-50 border border-neutral-300 rounded p-1.5 text-xs text-black font-mono font-bold" />
          </div>
          <div id="new-sizes-price-wrap" class="hidden grid grid-cols-3 gap-1.5">
            <div>
              <label class="text-[9px] text-neutral-500 block mb-0.5">Regular</label>
              <input id="new-item-price-reg" type="number" class="w-full bg-neutral-50 border border-neutral-300 rounded p-1 text-xs text-black font-mono font-bold" />
            </div>
            <div>
              <label class="text-[9px] text-neutral-500 block mb-0.5">Medium</label>
              <input id="new-item-price-med" type="number" class="w-full bg-neutral-50 border border-neutral-300 rounded p-1 text-xs text-black font-mono font-bold" />
            </div>
            <div>
              <label class="text-[9px] text-neutral-500 block mb-0.5">Large</label>
              <input id="new-item-price-lrg" type="number" class="w-full bg-neutral-50 border border-neutral-300 rounded p-1 text-xs text-black font-mono font-bold" />
            </div>
          </div>
          <div class="flex justify-end space-x-1.5 pt-1">
            <button onclick="toggleAddForm()" class="px-2.5 py-1 bg-neutral-200 rounded text-[10px] text-neutral-700 font-bold">Cancel</button>
            <button onclick="saveNewItem()" class="px-3 py-1 bg-black rounded text-[10px] text-white font-extrabold">Save</button>
          </div>
        </div>
      </div>

      <div id="menu-editor-list" class="space-y-1.5"></div>
    </div>
  </main>

  <!-- SIZE MODAL -->
  <div id="size-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-3 z-50 hidden">
    <div class="bg-white border border-neutral-300 w-full max-w-xs rounded-xl p-3 shadow-2xl">
      <div class="flex justify-between items-center mb-2">
        <h4 id="size-modal-title" class="text-xs font-black text-neutral-900">Select Size</h4>
        <button onclick="closeSizeModal()" class="text-neutral-400 hover:text-black"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="size-modal-options" class="space-y-1.5"></div>
    </div>
  </div>

      { id: 104, name: 'Mushroom Pizza', category: '1. Pizza Mania', price_regular: 80, available: true },

    function toggleBogo() {
      isBogoActive = !isBogoActive;
      const btn = document.getElementById('btn-bogo-toggle');
      if (isBogoActive) {
        btn.classList.remove('bg-white', 'text-neutral-800', 'border-neutral-300');
        btn.classList.add('bg-black', 'text-white', 'border-black');
      } else {
        btn.classList.add('bg-white', 'text-neutral-800', 'border-neutral-300');

        menu = JSON.parse(JSON.stringify(DEFAULT_MENU));

    function getUniqueCategories() {
      const cats = new Set(DEFAULT_CATEGORIES);
      menu.forEach(it => cats.add(it.category));
      return Array.from(cats);
    }

    function renderCategories() {
      const bar = document.getElementById('category-bar');
      bar.innerHTML = '';
      const allCats = ['All', ...getUniqueCategories()];
      allCats.forEach(cat => {
        const btn = document.createElement('button');
        btn.innerText = cat;
        btn.className = `px-2.5 py-1 rounded font-bold whitespace-nowrap text-[10.5px] transition flex-shrink-0 ${
          cat === activeCategory ? 'bg-black text-white shadow-sm' : 'bg-white text-neutral-700 hover:bg-neutral-200 border border-neutral-300'

        btn.onclick = () => {
          activeCategory = cat;
          renderCategories();
          renderItems();
        };
        bar.appendChild(btn);
      });
    }

    function renderItems() {
      const grid = document.getElementById('items-grid');
      grid.innerHTML = '';
      const query = (document.getElementById('item-search').value || '').toLowerCase();

      const items = menu.filter(it => {
        const matchesCat = activeCategory === 'All' || it.category === activeCategory;
        const matchesQuery = it.name.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      items.forEach(it => {
        const hasSizes = it.price_medium !== undefined && it.price_medium !== null && it.price_medium > 0;
        const btn = document.createElement('button');
        btn.className = `bg-white hover:bg-neutral-50 border border-neutral-300 active:border-black rounded p-1.5 flex flex-col justify-between text-left h-20 transition shadow-xs ${!it.available ? 'opacity-40' : ''}`;
        btn.onclick = () => handleItemSelect(it);

        btn.innerHTML = `
          <div>
            <span class="text-[7.5px] font-bold text-neutral-400 block uppercase tracking-tight">${it.category}</span>

          </div>
          <div class="flex justify-between items-center w-full mt-1">
            <span class="font-mono text-[13px] font-black text-neutral-900">₹${it.price_regular}</span>
            ${hasSizes ? '<span class="text-[7.5px] px-1 py-0.2 rounded bg-neutral-100 text-black border border-neutral-300 font-extrabold">Sizes</span>' : ''}
          </div>
        `;
        grid.appendChild(btn);
      });
    }

    function handleItemSelect(item) {
      if (!item.available) return alert('This item is currently disabled.');
      if (item.price_medium !== undefined && item.price_medium !== null && item.price_medium > 0) {
        document.getElementById('size-modal-title').innerText = item.name;
        const container = document.getElementById('size-modal-options');
        container.innerHTML = `
          <button onclick="addToCart(${item.id}, 'r', ${item.price_regular})" class="w-full py-2 bg-neutral-100 hover:bg-neutral-200 border border-neutral-300 rounded flex justify-between px-2.5 text-xs font-black text-neutral-900">
            <span>Regular (r)</span><span class="font-mono">₹${item.price_regular}</span>
          </button>
          <button onclick="addToCart(${item.id}, 'm', ${item.price_medium})" class="w-full py-2 bg-neutral-100 hover:bg-neutral-200 border border-neutral-300 rounded flex justify-between px-2.5 text-xs font-black text-neutral-900">
            <span>Medium (m)</span><span class="font-mono">₹${item.price_medium}</span>
          </button>
          <button onclick="addToCart(${item.id}, 'l', ${item.price_large})" class="w-full py-2 bg-neutral-100 hover:bg-neutral-200 border border-neutral-300 rounded flex justify-between px-2.5 text-xs font-black text-neutral-900">
            <span>Large (l)</span><span class="font-mono">₹${item.price_large}</span>
          </button>
        `;
        document.getElementById('size-modal').classList.remove('hidden');
      } else {
        addToCart(item.id, 'Std', item.price_regular);
      }
    }

    function closeSizeModal() {
      document.getElementById('size-modal').classList.add('hidden');
    }

    function addToCart(id, variant, price) {
      const item = menu.find(i => i.id === id);
      const key = `${id}_${variant}`;
      if (cart[key]) {
        cart[key].qty += 1;
      } else {
        cart[key] = { id, name: item.name, category: item.category, variant, price, qty: 1 };
      }
      closeSizeModal();
      renderCart();
    }

    function updateQty(key, delta) {
      if (cart[key]) {
        cart[key].qty += delta;
        if (cart[key].qty <= 0) delete cart[key];
      }
      renderCart();
    }

    function removeItem(key) {
      delete cart[key];
      renderCart();
    }

    function clearCart() {
      if (Object.keys(cart).length === 0) return;
      if (confirm('Clear running order?')) resetCartFields();
    }

    function resetCartFields() {
      cart = {};
      activeResumedHoldId = null;
      document.getElementById('cart-discount').value = 0;
      document.getElementById('delivery-phone-input').value = '';
      if (isBogoActive) toggleBogo();
      renderCart();
    }

    function holdCurrentCart() {
      const itemsInCart = Object.values(cart);
      if (itemsInCart.length === 0) return alert('Cart is empty.');

      const { sub, disc, bogoDiscount, grand } = recalcCart();
      const phone = document.getElementById('delivery-phone-input').value.trim();

      const heldEntry = {
        hold_id: `HOLD-${Date.now().toString().slice(-4)}`,
        timestamp: new Date().toISOString(),
        mode: currentOrderMode,
        table: currentOrderMode === 'Dine In' ? selectedTable : null,
        phone: phone || null,
        cart: JSON.parse(JSON.stringify(cart)),
        isBogoActive: isBogoActive,
        bogoDiscount: bogoDiscount,
        discount: disc,
        grand: grand
      };

      heldOrders.unshift(heldEntry);
      saveState();
      resetCartFields();
      switchView('tables');
      alert(`Order #${heldEntry.hold_id} placed on HOLD.`);
    }

    function resumeHeldOrder(holdId) {
      const idx = heldOrders.findIndex(h => h.hold_id === holdId);
      if (idx === -1) return;

      const target = heldOrders[idx];
      cart = JSON.parse(JSON.stringify(target.cart));
      document.getElementById('cart-discount').value = target.discount || 0;
      if (target.phone) document.getElementById('delivery-phone-input').value = target.phone;
      
      if (target.isBogoActive !== isBogoActive) {
        toggleBogo();
      }

      activeResumedHoldId = holdId;

      saveState();
      switchView('register');
      renderCart();
    }

    function deleteHeldOrder(holdId) {
      if (confirm('Delete this held order?')) {
        heldOrders = heldOrders.filter(h => h.hold_id !== holdId);
        saveState();
        renderHeldOrders();
      }
    }

    function renderHeldOrders() {
      const container = document.getElementById('held-orders-list');
      container.innerHTML = '';
      document.getElementById('held-total-badge').innerText = `${heldOrders.length} Held`;

      if (heldOrders.length === 0) {
        container.innerHTML = '<p class="text-neutral-500 text-xs py-8 text-center bg-white rounded border border-neutral-300">No orders currently on hold.</p>';
        return;
      }

      heldOrders.forEach(h => {
        const card = document.createElement('div');
        card.className = 'bg-white border border-neutral-300 p-2.5 rounded flex justify-between items-center text-xs shadow-sm';
        const summaryItems = Object.values(h.cart).map(i => `${i.name} (x${i.qty})`).join(', ');

        card.innerHTML = `
          <div class="flex-1 pr-2">
            <div class="flex items-center space-x-1.5">
              <span class="font-mono font-bold text-black text-[11px]">${h.hold_id}</span>
              <span class="px-1.5 py-0.5 rounded text-[9px] bg-neutral-100 border border-neutral-200 text-neutral-800 font-bold">${h.mode}</span>
              ${h.isBogoActive ? '<span class="px-1 py-0.2 rounded text-[8px] bg-neutral-100 text-black border border-neutral-300 font-black">BOGO</span>' : ''}
            </div>
            <p class="text-[10px] text-neutral-600 line-clamp-1 mt-0.5">${summaryItems}</p>
            <p class="font-mono font-bold text-neutral-900 text-xs mt-1">₹${h.grand}</p>
          </div>
          <div class="flex items-center space-x-1.5">
            <button onclick="resumeHeldOrder('${h.hold_id}')" class="px-2.5 py-1 bg-black hover:bg-neutral-800 text-white text-[10px] font-bold rounded">Resume</button>
            <button onclick="deleteHeldOrder('${h.hold_id}')" class="px-2 py-1 bg-neutral-100 hover:bg-neutral-200 text-neutral-600 text-[10px] rounded border border-neutral-300"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderCart() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';
      const entries = Object.entries(cart);

      if (entries.length === 0) {
        container.innerHTML = `
          <div class="h-28 flex flex-col items-center justify-center text-neutral-400 text-[11px]">
            <i class="fa-solid fa-receipt text-xl mb-1"></i>
            <span>No items added</span>
          </div>
        `;
      } else {
        entries.forEach(([key, it]) => {
          const isEligibleBogo = ['1 Veg', '2 Veg', '3 Veg'].includes(it.category) && (it.variant === 'm' || it.variant === 'l');
          const row = document.createElement('div');
          row.className = 'bg-white border border-neutral-200 rounded p-1.5 flex items-center justify-between text-[11px] shadow-xs';
          row.innerHTML = `
            <div class="flex-1 pr-1 truncate">
              <div class="flex items-center space-x-1">
                <p class="font-bold text-neutral-900 truncate text-[10.5px]">${it.name.toUpperCase()}</p>
                ${isEligibleBogo && isBogoActive ? '<span class="text-[7px] bg-neutral-100 text-black px-1 py-0.2 rounded border border-neutral-300 font-mono font-bold">BOGO</span>' : ''}
              </div>
              <p class="text-[8.5px] text-neutral-500">${it.variant !== 'Std' ? '(' + it.variant + ') · ' : ''}₹${it.price}</p>
            </div>
            <div class="flex items-center space-x-1 flex-shrink-0">
              <button onclick="updateQty('${key}', -1)" class="w-4 h-4 rounded bg-neutral-200 text-black font-bold flex items-center justify-center text-[10px]">-</button>
              <span class="w-3 text-center font-mono font-bold text-black text-[10px]">${it.qty}</span>
              <button onclick="updateQty('${key}', 1)" class="w-4 h-4 rounded bg-neutral-200 text-black font-bold flex items-center justify-center text-[10px]">+</button>
              <span class="w-9 text-right font-mono font-bold text-neutral-900 text-[10px]">₹${it.price * it.qty}</span>
              <button onclick="removeItem('${key}')" class="text-neutral-400 hover:text-black pl-0.5 text-[9px]"><i class="fa-solid fa-xmark"></i></button>
            </div>
          `;
          container.appendChild(row);
        });
      }

      recalcCart();
    }

    function recalcCart() {
      let sub = 0;
      let totalItemsCount = 0;
      let bogoEligibleUnits = [];

      Object.values(cart).forEach(it => {
        sub += it.price * it.qty;
        totalItemsCount += it.qty;
        if (isBogoActive && ['1 Veg', '2 Veg', '3 Veg'].includes(it.category) && (it.variant === 'm' || it.variant === 'l')) {
          for (let q = 0; q < it.qty; q++) {
            bogoEligibleUnits.push(it.price);
          }
        }
      });

      bogoEligibleUnits.sort((a, b) => a - b);
      let freePizzaCount = Math.floor(bogoEligibleUnits.length / 2);
      let bogoDiscount = 0;
      for (let i = 0; i < freePizzaCount; i++) {
        bogoDiscount += bogoEligibleUnits[i];
      }

      const manualDisc = Math.max(0, parseFloat(document.getElementById('cart-discount').value) || 0);
      const totalDisc = Math.min(sub, bogoDiscount + manualDisc);
      const grand = Math.max(0, sub - totalDisc);

      document.getElementById('cart-subtotal').innerText = `₹${sub}`;
      document.getElementById('cart-grand').innerText = `₹${grand}`;

      const bogoInfo = document.getElementById('bogo-applied-info');
      if (isBogoActive && bogoDiscount > 0) {
        bogoInfo.classList.remove('hidden');
        document.getElementById('bogo-discount-amount').innerText = `-₹${bogoDiscount} (${freePizzaCount} Free)`;
      } else {
        bogoInfo.classList.add('hidden');
      }

      return { sub, disc: manualDisc, bogoDiscount, totalDisc, grand, totalItemsCount };
    }

    function setOrderMode(mode, btn) {
      currentOrderMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.className = 'mode-btn py-0.5 rounded text-[9px] font-bold bg-white border border-neutral-300 text-neutral-700 truncate';
      });

      if (mode === 'Dine In') {
        btn.className = 'mode-btn py-0.5 rounded text-[9px] font-black bg-black text-white truncate';
        document.getElementById('table-select-row').classList.remove('hidden');
        document.getElementById('delivery-phone-wrap').classList.add('hidden');
      } else if (mode === 'Takeaway') {
        btn.className = 'mode-btn py-0.5 rounded text-[9px] font-black bg-black text-white truncate';
        document.getElementById('table-select-row').classList.add('hidden');
        document.getElementById('delivery-phone-wrap').classList.add('hidden');
      } else if (mode === 'Delivery') {
        btn.className = 'mode-btn py-0.5 rounded text-[9px] font-black bg-black text-white truncate';
        document.getElementById('table-select-row').classList.add('hidden');
        document.getElementById('delivery-phone-wrap').classList.remove('hidden');
        document.getElementById('delivery-phone-input').focus();
      }
    }

    function setTable(table, btn) {
      selectedTable = table;
      document.querySelectorAll('.table-chip').forEach(c => {
        c.className = 'table-chip px-1.5 py-0.5 rounded bg-white text-neutral-700 border border-neutral-300 text-[9px]';
      });
      btn.className = 'table-chip px-1.5 py-0.5 rounded bg-black text-white border border-black text-[9px] font-black';
      document.getElementById('current-invoice-tag').innerText = `#TBL-${table}`;
    }

    function setPayment(mode, btn) {
      selectedPayment = mode;
      document.querySelectorAll('.pay-btn').forEach(b => {
        b.className = 'pay-btn py-1 rounded text-[9px] font-bold bg-white border border-neutral-300 text-neutral-700';
      });
      btn.className = 'pay-btn py-1 rounded text-[9px] font-black bg-amber-400 text-black border border-amber-500';
    }

    function openTableRegister(tbl) {
      selectedTable = tbl;
      currentOrderMode = 'Dine In';
      switchView('register');
      const tBtn = Array.from(document.querySelectorAll('.table-chip')).find(b => b.innerText === `T${tbl}`);
      if (tBtn) setTable(tbl, tBtn);
      const mBtn = Array.from(document.querySelectorAll('.mode-btn')).find(b => b.innerText.includes('Dine'));
      if (mBtn) setOrderMode('Dine In', mBtn);
    }

    function setModeAndOpen(mode) {
      currentOrderMode = mode;
      switchView('register');
      const btn = Array.from(document.querySelectorAll('.mode-btn')).find(b => b.innerText.includes(mode === 'Takeaway' ? 'Pick' : 'Deliv'));
      if (btn) setOrderMode(mode, btn);
    }

    function startDirectOrder() {
      openTableRegister('1');
    }

    // SALES REPORT ENGINE (LOCAL CALENDAR MATCHING)
    function filterSales(timeFrame) {
      activeSalesFilter = timeFrame;
      const btnToday = document.getElementById('btn-sales-today');
      const btnYest = document.getElementById('btn-sales-yesterday');

      if (timeFrame === 'today') {
        btnToday.className = 'px-3 py-1 bg-black text-white rounded text-[10px] font-bold shadow-sm';
        btnYest.className = 'px-3 py-1 bg-neutral-100 hover:bg-neutral-200 border border-neutral-300 rounded text-[10px] font-bold text-neutral-700';
        document.getElementById('sales-report-date-tag').innerText = 'Sales Report : Today';
      } else {
        btnYest.className = 'px-3 py-1 bg-black text-white rounded text-[10px] font-bold shadow-sm';
        btnToday.className = 'px-3 py-1 bg-neutral-100 hover:bg-neutral-200 border border-neutral-300 rounded text-[10px] font-bold text-neutral-700';
        document.getElementById('sales-report-date-tag').innerText = 'Sales Report : Yesterday';
      }

      renderSalesReport();
    }

    function renderSalesReport() {
      const tbody = document.getElementById('sales-table-body');
      tbody.innerHTML = '';

      const now = new Date();
      const targetDate = new Date();
      if (activeSalesFilter === 'yesterday') {
        targetDate.setDate(now.getDate() - 1);
      }

      const pad = n => n.toString().padStart(2, '0');
      const targetLocalStr = `${targetDate.getFullYear()}-${pad(targetDate.getMonth() + 1)}-${pad(targetDate.getDate())}`;

      const filtered = orders.filter(o => {
        const d = new Date(o.time);
        const orderLocalStr = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        return orderLocalStr === targetLocalStr;
      });

      let totalSales = 0;
      filtered.forEach(o => totalSales += Number(o.grand_total) || 0);

      document.getElementById('sales-total-amount').innerText = `₹${totalSales.toFixed(2)}`;
      document.getElementById('sales-total-bills').innerText = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-neutral-400 text-xs">No settled sales recorded for this period.</td></tr>`;
        return;
      }

      filtered.forEach(o => {
        const dateObj = new Date(o.time);
        const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dateStr = `${pad(dateObj.getDate())}-${pad(dateObj.getMonth() + 1)}-${dateObj.getFullYear()}`;
        const discountVal = (Number(o.discount) || 0) + (Number(o.bogo_discount) || 0);

        const tr = document.createElement('tr');
        tr.className = 'border-b border-neutral-200 hover:bg-neutral-50';
        tr.innerHTML = `
          <td class="p-2 font-mono font-bold text-neutral-900 border-r border-neutral-200">${o.invoice_no}</td>
          <td class="p-2 text-neutral-600 border-r border-neutral-200">${dateStr} ${timeStr}</td>
          <td class="p-2 border-r border-neutral-200"><span class="px-1.5 py-0.5 rounded text-[9px] bg-neutral-100 border border-neutral-300 font-bold">${o.payment_mode || 'Cash'}</span></td>
          <td class="p-2 border-r border-neutral-200 font-medium">${o.mode}${o.table ? ' (T' + o.table + ')' : ''}</td>
          <td class="p-2 border-r border-neutral-200 text-right font-mono text-neutral-500">${discountVal.toFixed(2)}</td>
          <td class="p-2 text-right font-mono font-black text-neutral-900">₹${Number(o.grand_total).toFixed(2)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // PRINT ENGINES
    function generateKOTHTML() {
      const itemsInCart = Object.values(cart);
      let totalUnits = 0;
      let rowsHTML = '';
      let index = 1;

      itemsInCart.forEach(it => {
        totalUnits += it.qty;
        const displayName = `${it.name.toUpperCase()} ${it.variant !== 'Std' ? '(' + it.variant.toUpperCase() + ')' : ''}`;
        rowsHTML += `
          <tr style="border-top: 1px dotted #000;">
            <td style="padding: 5px 2px; vertical-align: top; width: 10%; font-size: 14px; font-weight: 800;">${index++}</td>
            <td style="padding: 5px 4px; vertical-align: top; width: 62%; font-size: 13.5px; font-weight: 800; word-break: break-word;">${displayName}</td>
            <td style="padding: 5px 2px; vertical-align: top; text-align: center; width: 14%; font-size: 13px; font-weight: 800;">QTY</td>
            <td style="padding: 5px 2px; vertical-align: top; text-align: right; width: 14%; font-size: 15px; font-weight: 900;">${it.qty}</td>
          </tr>
        `;
      });

      let orderTypeLabel = 'DINE IN';
      if (currentOrderMode === 'Dine In') {
        orderTypeLabel = `DINE IN (TABLE ${selectedTable})`;
      } else if (currentOrderMode === 'Takeaway') {
        orderTypeLabel = 'PICKUP / TAKEAWAY';
      } else if (currentOrderMode === 'Delivery') {
        orderTypeLabel = 'DELIVERY';
      }

      return `
        <!DOCTYPE html>
        <html>
        <head>
          <title>KOT</title>
          <style>
            @page { margin: 0; size: 72mm auto; }
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #000; margin: 0; padding: 6px 10px; width: 68mm; font-size: 13px; line-height: 1.25; }
            .center { text-align: center; }
            .header-title { font-size: 18px; font-weight: 900; letter-spacing: 1px; }
            .type-banner { font-size: 13px; font-weight: 900; margin-top: 2px; padding: 2px 0; border-bottom: 2px solid #000; }
            table { width: 100%; border-collapse: collapse; margin-top: 4px; }
            th { font-size: 14px; font-weight: 900; padding: 4px 2px; border-bottom: 2px solid #000; }
            .total-box-container { display: flex; justify-content: flex-end; margin-top: 8px; }
            .total-box { border: 1.5px solid #000; padding: 3px 8px; display: flex; justify-content: space-between; width: 62%; font-size: 14px; font-weight: 900; }
            .user-tag { text-align: right; font-size: 12px; font-weight: 700; margin-top: 4px; }
          </style>
        </head>
        <body>
          <div class="center header-title">KOT</div>
          <div class="center type-banner">${orderTypeLabel}</div>
          <table>
            <thead>
              <tr>
                <th style="text-align: left; width: 10%;">#</th>
                <th style="text-align: left; width: 62%;">Product</th>
                <th style="text-align: center; width: 14%;">Uom</th>
                <th style="text-align: right; width: 14%;">Qty</th>
              </tr>
            </thead>
            <tbody>${rowsHTML}</tbody>
          </table>
          <div class="total-box-container">
            <div class="total-box"><span>Total :</span><span>${totalUnits}</span></div>
          </div>
          <div class="user-tag">User: ADMIN</div>
        </body>
        </html>
      `;
    }

    function generateBillHTML(invoiceNo, now, customerPhone) {
      const itemsPurchased = Object.values(cart);
      const { sub, disc, bogoDiscount, grand, totalItemsCount } = recalcCart();
      const pad = n => n.toString().padStart(2, '0');
      const dateFormatted = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear().toString().slice(-2)}`;
      const timeFormatted = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

      let itemRows = '';
      itemsPurchased.forEach(it => {
        const displayName = `${it.name.toUpperCase()} ${it.variant !== 'Std' ? '(' + it.variant + ')' : ''}`;
        const unitPrice = parseFloat(it.price).toFixed(2);
        const lineTotal = parseFloat(it.price * it.qty).toFixed(2);

        itemRows += `
          <tr style="vertical-align: top;">
            <td style="padding: 2px 0; font-weight: 700; width: 44%; word-break: break-word;">${displayName}</td>
            <td style="padding: 2px 0; text-align: center; width: 14%;">${it.qty}</td>
            <td style="padding: 2px 0; text-align: right; width: 21%;">${unitPrice}</td>
            <td style="padding: 2px 0; text-align: right; width: 21%;">${lineTotal}</td>
          </tr>
        `;
      });

      if (bogoDiscount > 0) {
        itemRows += `
          <tr style="vertical-align: top; font-weight: 700;">
            <td style="padding: 2px 0;">BOGO FREE PIZZA</td>
            <td style="padding: 2px 0; text-align: center;">1</td>
            <td style="padding: 2px 0; text-align: right;">-${parseFloat(bogoDiscount).toFixed(2)}</td>
            <td style="padding: 2px 0; text-align: right;">-${parseFloat(bogoDiscount).toFixed(2)}</td>
          </tr>
        `;
      }

      if (disc > 0) {
        itemRows += `
          <tr style="vertical-align: top; font-weight: 700;">
            <td colspan="3" style="padding: 2px 0;">DISCOUNT</td>
            <td style="padding: 2px 0; text-align: right;">-${parseFloat(disc).toFixed(2)}</td>
          </tr>
        `;
      }

      return `
        <!DOCTYPE html>
        <html>
        <head>
          <title>Delicious Eatz</title>
          <style>
            @page { margin: 0; size: 72mm auto; }
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #000; margin: 0; padding: 6px 10px; width: 68mm; font-size: 13.5px; line-height: 1.25; }
            .center { text-align: center; }
            .bold { font-weight: 800; }
            .title { font-size: 16px; font-weight: 900; letter-spacing: 0.2px; }
            .subtitle { font-size: 11.5px; line-height: 1.2; margin-top: 2px; font-weight: 500; }
            .solid-hr { border: 0; border-top: 1.5px solid #000; margin: 5px 0; }
            .thick-hr { border: 0; border-top: 2.2px solid #000; margin: 4px 0; }
            .name-row { font-size: 13px; font-weight: 700; padding: 2px 0; }
            .phone-row { font-size: 13px; font-weight: 800; padding: 2px 0; }
            .meta-grid { display: flex; justify-content: space-between; font-size: 12.5px; line-height: 1.35; padding: 1px 0; }
            table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 2px; }
            th { font-weight: 700; padding: 3px 0; }
            .grand-box { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 15.5px; font-weight: 900; }
          </style>
        </head>
        <body>
          <div class="center">
            <div class="title">Delicious Eatz</div>
            <div class="subtitle">Vop Budhabarh Tehsil Hajipur Dist Hoshiarpur</div>
            <div class="subtitle" style="font-weight: 600;">Ph: 7888950664, 8360084534</div>
          </div>
          <hr class="solid-hr" />
          <div class="name-row">Name:</div>
          ${currentOrderMode === 'Delivery' && customerPhone ? `<div class="phone-row">Contact: ${customerPhone}</div>` : ''}
          <hr class="solid-hr" />
          <div class="meta-grid">
            <div>Date: ${dateFormatted}</div>
            <div class="bold">${currentOrderMode === 'Dine In' ? 'Dine In: ' + selectedTable : currentOrderMode}</div>
          </div>
          <div class="meta-grid">
            <div>${timeFormatted}</div>
            <div></div>
          </div>
          <div class="meta-grid">
            <div>Cashier: biller</div>
            <div>Bill No.: ${invoiceNo}</div>
          </div>
          <hr class="thick-hr" />
          <table>
            <thead>
              <tr>
                <th style="text-align: left; width: 44%;">Item</th>
                <th style="text-align: center; width: 14%;">Qty.</th>
                <th style="text-align: right; width: 21%;">Price</th>
                <th style="text-align: right; width: 21%;">Amount</th>
              </tr>
            </thead>
          </table>
          <hr class="thick-hr" />
          <table><tbody>${itemRows}</tbody></table>
          <hr class="solid-hr" style="margin-top: 6px;" />
          <div class="meta-grid bold" style="font-size: 13px;">
            <div>Total Qty: ${totalItemsCount}</div>
            <div style="text-align: right;">Sub Total &nbsp; ${parseFloat(sub).toFixed(2)}</div>
          </div>
          <hr class="thick-hr" />
          <div class="grand-box">
            <span style="font-size: 14.5px;">Grand Total</span>
            <span>₹ ${parseFloat(grand).toFixed(2)}</span>
          </div>
          <hr class="thick-hr" />
          <div class="center bold" style="font-size: 13.5px; padding: 4px 0 2px;">
            Thanks
          </div>
        </body>
        </html>
      `;
    }

    function printHTML(content, callback) {
      let iframe = document.getElementById('printer-bridge-frame');
      if (!iframe) {
        iframe = document.createElement('iframe');
        iframe.id = 'printer-bridge-frame';
        iframe.style.position = 'fixed';
        iframe.style.right = '0';
        iframe.style.bottom = '0';
        iframe.style.width = '0';
        iframe.style.height = '0';
        iframe.style.border = '0';
        document.body.appendChild(iframe);
      }

      const doc = iframe.contentWindow.document;
      doc.open();
      doc.write(content);
      doc.close();

      setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        window.focus();
        if (callback) setTimeout(callback, 600);
      }, 250);
    }

    function printOnlyKOT() {
      if (Object.keys(cart).length === 0) return alert('No items in cart for KOT!');
      printHTML(generateKOTHTML(), null);
    }

    function settleBillAndPrint() {
      const itemsPurchased = Object.values(cart);
      if (itemsPurchased.length === 0) return alert('Add items to order first!');

      const phone = document.getElementById('delivery-phone-input').value.trim();
      if (currentOrderMode === 'Delivery' && !phone) {
        alert('Please enter customer contact number for Delivery!');
        document.getElementById('delivery-phone-input').focus();
        return;
      }

      const { sub, disc, bogoDiscount, grand } = recalcCart();
      const invoiceNo = `${Math.floor(1000 + Math.random() * 9000)}`;
      const now = new Date();

      const record = {
        invoice_no: invoiceNo,
        time: now.toISOString(),
        mode: currentOrderMode,
        table: currentOrderMode === 'Dine In' ? selectedTable : null,
        phone: currentOrderMode === 'Delivery' ? phone : null,
        items: itemsPurchased,
        subtotal: sub,
        bogo_discount: bogoDiscount,
        discount: disc,
        grand_total: grand,
        payment_mode: selectedPayment
      };

      orders.unshift(record);

      if (activeResumedHoldId) {
        heldOrders = heldOrders.filter(h => h.hold_id !== activeResumedHoldId);
        activeResumedHoldId = null;
      }

      saveState();

      const billHTML = generateBillHTML(invoiceNo, now, phone);
      const kotHTML = generateKOTHTML();

      printHTML(billHTML, () => {
        printHTML(kotHTML, () => {
          resetCartFields();
          switchView('tables');
          window.focus();
        });
      });
    }

    function toggleAddForm() {
      const card = document.getElementById('add-item-card');
      card.classList.toggle('hidden');
      if (!card.classList.contains('hidden')) {
        populateCategoryDropdown();
        document.getElementById('new-item-name').focus();
      }
    }

    function populateCategoryDropdown() {
      const select = document.getElementById('new-item-category');
      select.innerHTML = '';
      getUniqueCategories().forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.innerText = c;
        select.appendChild(opt);
      });
    }

    function toggleSizeInputs(type) {
      if (type === 'sizes') {
        document.getElementById('new-single-price-wrap').classList.add('hidden');
        document.getElementById('new-sizes-price-wrap').classList.remove('hidden');
      } else {
        document.getElementById('new-single-price-wrap').classList.remove('hidden');
        document.getElementById('new-sizes-price-wrap').classList.add('hidden');
      }
    }

    function saveNewItem() {
      const name = document.getElementById('new-item-name').value.trim();
      const category = document.getElementById('new-item-category').value;
      const type = document.getElementById('new-item-type').value;

      if (!name) return alert('Enter item name');

      const newItem = { id: Date.now(), name, category, available: true };
      if (type === 'sizes') {
        newItem.price_regular = parseFloat(document.getElementById('new-item-price-reg').value) || 0;
        newItem.price_medium = parseFloat(document.getElementById('new-item-price-med').value) || 0;
        newItem.price_large = parseFloat(document.getElementById('new-item-price-lrg').value) || 0;
      } else {
        newItem.price_regular = parseFloat(document.getElementById('new-item-price').value) || 0;
      }

      menu.unshift(newItem);
      saveState();
      toggleAddForm();
      renderCategories();
      renderItems();
      renderMenuEditor();
    }

    function deleteItem(id) {
      if (confirm('Delete item?')) {
        menu = menu.filter(it => it.id !== id);
        saveState();
        renderCategories();
        renderItems();
        renderMenuEditor();
      }
    }

    function renderMenuEditor() {
      const container = document.getElementById('menu-editor-list');
      container.innerHTML = '';

      menu.forEach(it => {
        const card = document.createElement('div');
        card.className = 'bg-white border border-neutral-300 p-2 rounded flex items-center justify-between text-xs shadow-xs';
        card.innerHTML = `
          <div class="flex-1 pr-2">
            <div class="flex items-center space-x-2">
              <p class="font-black text-neutral-900 text-[12px]">${it.name}</p>
              <button onclick="deleteItem(${it.id})" class="text-neutral-400 hover:text-black text-[10px]"><i class="fa-solid fa-trash"></i></button>
            </div>
            <p class="text-[9px] text-neutral-500 font-bold uppercase">${it.category}</p>
            <div class="flex items-center space-x-1.5 mt-1">
              <span class="text-[10px] text-black font-black">₹</span>
              <input type="number" value="${it.price_regular}" onchange="updatePrice(${it.id}, 'price_regular', this.value)" class="w-14 bg-neutral-50 border border-neutral-300 rounded px-1 py-0.5 text-black text-[11px] font-mono font-bold" />
            </div>
          </div>
          <button onclick="toggleItemStatus(${it.id})" class="px-2 py-1 rounded text-[10px] font-bold ${it.available ? 'bg-neutral-100 text-black border border-neutral-300' : 'bg-neutral-200 text-neutral-400 border border-neutral-300'}">
            ${it.available ? 'Active' : 'Disabled'}
          </button>
        `;
        container.appendChild(card);
      });
    }

    function updatePrice(id, field, value) {
      const item = menu.find(i => i.id === id);
      if (item) {
        item[field] = parseFloat(value) || 0;
        saveState();
        renderItems();
      }
    }

    function toggleItemStatus(id) {
      const item = menu.find(i => i.id === id);
      if (item) {
        item.available = !item.available;
        saveState();
        renderItems();
        renderMenuEditor();
      }
    }

    function switchView(view) {
      ['tables', 'register', 'sales', 'held', 'menu'].forEach(v => {
        document.getElementById(`view-${v}`).classList.add('hidden');
      });

      document.getElementById(`view-${view}`).classList.remove('hidden');

      if (view === 'sales') filterSales('today');
      if (view === 'held') renderHeldOrders();
      if (view === 'menu') renderMenuEditor();
    }

    renderCategories();
    renderItems();
    renderCart();
    updateHeldBadge();
  </script>
</body>
</html>
