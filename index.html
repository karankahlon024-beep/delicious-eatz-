    <!-- Totals & Payment Action Section -->

        <span>Discount (₹)</span>

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = 'cat-btn px-3 py-1.5 bg-gray-900 text-gray-400 font-bold rounded-lg whitespace-nowrap border border-gray-800';
      });
      document.getElementById('cat-' + cat).className = 'cat-btn px-3 py-1.5 bg-red-600 text-white font-bold rounded-lg whitespace-nowrap';
      renderMenu();
    }

    function handleSearch() {
      renderMenu();
    }

    function renderMenu() {
      const container = document.getElementById('menu-items');
      const query = document.getElementById('search-input').value.toLowerCase();
      
      let filtered = currentCategory === 'all' ? menu : menu.filter(i => i.category === currentCategory);
      if (query) {
        filtered = menu.filter(i => i.name.toLowerCase().includes(query));
      }
      
      container.innerHTML = filtered.map((item) => {
        const categoryLabel = item.category.toUpperCase();
        return `
          <button onclick="handleItemClick('${item.name.replace(/'/g, "\\'")}')" class="bg-gray-900 hover:bg-gray-800 border border-gray-800 p-2.5 rounded-lg text-left transition flex flex-col justify-between h-20 shadow">
            <div>
              <div class="text-[9px] text-gray-500 font-bold uppercase tracking-wider">${categoryLabel}</div>
              <div class="font-bold text-white text-xs truncate mt-0.5">${item.name}</div>
            </div>
            <div class="flex justify-between items-center mt-1">
              <span class="text-white font-bold text-xs">${item.price ? '₹' + item.price : 'From ₹' + Math.min(...Object.values(item.prices))}</span>
              ${item.prices ? '<span class="text-[10px] bg-gray-800 px-1.5 py-0.5 rounded text-gray-400">Sizes</span>' : ''}
            </div>
          </button>
        `;
      }).join('');
    }

    function handleItemClick(name) {
      const item = menu.find(i => i.name === name);
      if (!item) return;

      if (item.price) {
        addToCart(item.name, item.price);
      } else if (item.prices) {
        openVariantModal(item);
      }
    }

    function openVariantModal(item) {
      const modal = document.getElementById('variant-modal');
      const title = document.getElementById('modal-title');
      const options = document.getElementById('modal-options');

      title.innerText = `Select Size: ${item.name}`;
      options.innerHTML = Object.entries(item.prices).map(([size, price]) => `
        <button onclick="selectVariant('${item.name.replace(/'/g, "\\'")}', '${size}', ${price})" class="w-full flex justify-between items-center p-2.5 bg-gray-800 hover:bg-gray-700 rounded font-bold text-xs transition">
          <span>${size}</span>
          <span class="text-amber-400">₹${price}</span>
        </button>
      `).join('');

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function selectVariant(name, size, price) {
      addToCart(`${name} (${size})`, price);
      closeModal();
    }

    function closeModal() {
      document.getElementById('variant-modal').classList.remove('flex');
      document.getElementById('variant-modal').classList.add('hidden');
    }

    function setOrderType(type) {
      orderType = type;
      ['dine', 'away', 'deliv'].forEach(t => {
        const btn = document.getElementById('type-' + t);
        if (t.toLowerCase() === type.toLowerCase()) {
          btn.className = 'flex-1 py-1.5 bg-amber-500 rounded font-bold text-black';
        } else {
          btn.className = 'flex-1 py-1.5 bg-gray-800 rounded font-bold text-gray-300';
        }
      });
    }

    function setPayment(method) {
      paymentMethod = method;
      ['Cash', 'UPI', 'Card'].forEach(m => {
        const btn = document.getElementById('pay-' + m);
        if (m === method) {
          btn.className = 'flex-1 py-1.5 bg-amber-500 text-black font-bold rounded';
        } else {
          btn.className = 'flex-1 py-1.5 bg-gray-800 text-gray-400 font-bold rounded';
        }
      });
    }

    function addToCart(name, price) {
      const existing = cart.find(i => i.name === name);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ name, price, qty: 1 });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const list = document.getElementById('cart-list');
      if (cart.length === 0) {
        list.innerHTML = `
          <div class="text-center text-gray-500 py-12 flex flex-col items-center justify-center">
            <span class="text-2xl mb-1">📄</span>
            <span>No items added</span>
          </div>
        `;
        document.getElementById('cart-subtotal').innerText = '₹0';
        document.getElementById('cart-net').innerText = '₹0';
        document.getElementById('bill-id-tag').innerText = '#DE-PENDING';
        return;
      }

      document.getElementById('bill-id-tag').innerText = '#DE-' + Math.floor(1000 + Math.random() * 9000);

      list.innerHTML = cart.map((i, index) => `
        <div class="flex justify-between items-center bg-gray-950 p-2 rounded border border-gray-800">
          <div>
            <div class="font-bold text-white">${i.name}</div>
            <div class="text-amber-400">₹${i.price * i.qty}</div>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="decreaseQty(${index})" class="w-5 h-5 bg-gray-800 hover:bg-gray-700 rounded font-bold">-</button>
            <span class="font-bold w-4 text-center">${i.qty}</span>
            <button onclick="increaseQty(${index})" class="w-5 h-5 bg-gray-800 hover:bg-gray-700 rounded font-bold">+</button>
          </div>
        </div>
      `).join('');

      const subtotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const discount = parseFloat(document.getElementById('discount-input').value) || 0;
      const net = Math.max(0, subtotal - discount);

      document.getElementById('cart-subtotal').innerText = '₹' + subtotal;
      document.getElementById('cart-net').innerText = '₹' + net;
    }

    function increaseQty(index) {
      cart[index].qty++;
      updateCartUI();
    }

    function decreaseQty(index) {
      cart[index].qty--;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      updateCartUI();
    }

    function clearCart() {
      cart = [];
      updateCartUI();
    }

    function checkoutOrder() {
      if (cart.length === 0) {
        alert('Please add items to the cart first!');
        return;
      }

      const invoiceNum = Math.floor(1000 + Math.random() * 9000);
      const subtotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const discount = parseFloat(document.getElementById('discount-input').value) || 0;
      const totalAmount = Math.max(0, subtotal - discount);
      const itemsString = cart.map(i => `${i.name} x${i.qty}`).join(', ');
      const phone = document.getElementById('customer-phone').value || 'Walk-in';

      const orderData = {
        Invoice: invoiceNum,
        Type: orderType,
        Phone: phone,
        Items: itemsString,
        Total: totalAmount,
        Payment: paymentMethod,
        Timestamp: new Date().toLocaleString()
      };

      fetch(SHEETDB_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: [orderData] })
      })
      .then(res => res.json())
      .then(() => {
        alert('Order #' + invoiceNum + ' settled successfully! Printing on counter...');
        clearCart();
        document.getElementById('customer-phone').value = '';
      })
      .catch(err => {
        alert('Error syncing order. Check your connection.');
        console.error(err);
      });
    }

    renderMenu();
  </script>
</body>
</html>
