<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Delicious Eatz - POS Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #0f172a; overflow: hidden; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pos-btn:active { transform: translateY(1px); }
  </style>
</head>
<body class="h-screen w-screen flex flex-col bg-[#0f172a]">

  <header class="bg-[#090d16] border-b border-[#1e293b] px-3 py-1.5 flex items-center justify-between text-white flex-shrink-0 z-30">
    <div class="flex items-center space-x-2">
      <div class="bg-white text-black px-2 py-0.5 rounded font-black text-xs tracking-wider flex items-center">
        <i class="fa-solid fa-bolt mr-1 text-[10px]"></i> POS
      </div>
      <span class="font-extrabold text-sm tracking-tight text-white">EATZ</span>
      <span class="text-[10px] text-neutral-400 bg-[#1e293b] px-2 py-0.5 rounded font-mono">CLOUD SYNC ACTIVE</span>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="switchView('tables')" id="nav-btn-tables" class="px-3 py-1 bg-white text-black font-extrabold text-xs rounded shadow-sm flex items-center">
        <i class="fa-solid fa-table-cells mr-1.5 text-[11px]"></i> Tables
      </button>
      <button onclick="switchView('sales')" id="nav-btn-sales" class="px-3 py-1 bg-[#1e293b] hover:bg-[#334155] text-white font-bold text-xs rounded border border-[#334155] flex items-center">
        <i class="fa-solid fa-chart-line mr-1.5 text-[11px]"></i> Sales Report
      </button>
      <button onclick="switchView('held')" id="nav-btn-held" class="px-2.5 py-1 bg-[#1e293b] hover:bg-[#334155] text-amber-400 font-bold text-xs rounded border border-[#334155] flex items-center">
        <i class="fa-solid fa-pause mr-1 text-[10px]"></i> Held (<span id="held-count-badge">0</span>)
      </button>
      <button onclick="switchView('menu')" id="nav-btn-menu" class="px-2.5 py-1 bg-[#1e293b] hover:bg-[#334155] text-neutral-300 font-bold text-xs rounded border border-[#334155]">
        <i class="fa-solid fa-sliders text-[11px]"></i>
      </button>
    </div>
  </header>

  <main id="view-tables" class="flex-1 flex flex-col p-3 bg-[#0b1120] overflow-y-auto">
    <div class="bg-[#131d31] border border-[#1e293b] rounded-xl p-2.5 flex items-center justify-between mb-3 shadow-lg">
      <div class="flex items-center space-x-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="text-xs font-black text-white uppercase tracking-wider">Floor Plan & Orders</span>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="setModeAndOpen('Delivery')" class="pos-btn px-4 py-2 bg-black hover:bg-neutral-900 border border-[#334155] text-amber-400 font-extrabold text-xs rounded-lg shadow flex items-center">
          <i class="fa-solid fa-motorcycle mr-1.5 text-sm"></i> NEW DELIVERY
        </button>
        <button onclick="setModeAndOpen('Takeaway')" class="pos-btn px-4 py-2 bg-black hover:bg-neutral-900 border border-[#334155] text-white font-extrabold text-xs rounded-lg shadow flex items-center">
          <i class="fa-solid fa-bag-shopping mr-1.5 text-sm"></i> TAKEAWAY / PICKUP
        </button>
      </div>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3" id="table-cards-container"></div>
  </main>

  <main id="view-register" class="flex-1 flex flex-row overflow-hidden hidden bg-white">
    <section class="w-[62%] flex flex-col overflow-hidden bg-[#f8fafc] border-r border-[#cbd5e1]">
      <div class="p-2 border-b border-[#cbd5e1] bg-white flex items-center space-x-2 flex-shrink-0">
        <button onclick="switchView('tables')" class="px-3 py-1.5 bg-[#0f172a] hover:bg-black text-white rounded-lg text-xs font-black flex items-center">
          <i class="fa-solid fa-arrow-left mr-1.5"></i> TABLES
        </button>
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-neutral-400"></i>
          <input id="item-search" type="text" placeholder="Search menu..." oninput="renderItems()" class="w-full pl-8 pr-3 py-1.5 bg-[#f1f5f9] border border-[#cbd5e1] rounded-lg text-xs font-bold text-black focus:outline-none focus:border-black" />
        </div>
      </div>

      <div class="flex items-center bg-[#e2e8f0] border-b border-[#cbd5e1] p-1 flex-shrink-0">
        <button onclick="scrollCategories(-140)" class="w-6 h-7 bg-white hover:bg-neutral-200 border border-[#cbd5e1] rounded flex items-center justify-center text-xs font-black mr-1 flex-shrink-0">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div id="category-bar" onwheel="handleCatWheel(event)" class="flex-1 flex items-center space-x-1.5 overflow-x-auto no-scrollbar scroll-smooth"></div>
        <button onclick="scrollCategories(140)" class="w-6 h-7 bg-white hover:bg-neutral-200 border border-[#cbd5e1] rounded flex items-center justify-center text-xs font-black ml-1 flex-shrink-0">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <div id="items-grid" class="flex-1 overflow-y-auto p-2 grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2 content-start no-scrollbar"></div>
    </section>

    <section class="w-[38%] flex flex-col overflow-hidden bg-white">
      <div class="p-2 bg-[#f8fafc] border-b border-[#cbd5e1] space-y-1.5 flex-shrink-0 shadow-sm">
        <div class="flex items-center justify-between">
          <div class="grid grid-cols-3 gap-1 flex-1 mr-2">
            <button onclick="setOrderMode('Dine In', this)" class="mode-btn py-1 rounded text-[10px] font-black uppercase tracking-wider bg-black text-white">Dine In</button>
            <button onclick="setOrderMode('Takeaway', this)" class="mode-btn py-1 rounded text-[10px] font-bold uppercase tracking-wider bg-white border border-[#cbd5e1] text-neutral-700">Pickup</button>
            <button onclick="setOrderMode('Delivery', this)" class="mode-btn py-1 rounded text-[10px] font-bold uppercase tracking-wider bg-white border border-[#cbd5e1] text-neutral-700">Delivery</button>
          </div>
          <span id="current-invoice-tag" class="font-mono text-black text-xs font-black bg-[#e2e8f0] px-2 py-0.5 rounded">#TBL-1</span>
        </div>

        <div id="delivery-phone-wrap" class="hidden">
          <div class="flex items-center bg-white border-2 border-amber-500 rounded-lg px-2 py-1">
            <i class="fa-solid fa-phone text-amber-600 text-xs mr-2"></i>
            <input id="delivery-phone-input" type="tel" placeholder="Customer Contact Number..." class="w-full bg-transparent text-xs font-bold font-mono text-black placeholder-neutral-400 focus:outline-none" />
          </div>
        </div>

        <div class="bg-white p-2 rounded-lg border border-[#cbd5e1] flex flex-col space-y-1">
          <div class="flex items-center justify-between text-xs">
            <span class="text-neutral-500 font-bold">Subtotal: <strong id="cart-subtotal" class="text-black font-mono">₹0</strong></span>
            <div class="flex items-center space-x-1">
              <span class="text-neutral-500 font-bold">Disc:</span>
              <input id="cart-discount" type="number" value="0" min="0" oninput="recalcCart()" class="w-12 bg-[#f1f5f9] border border-[#cbd5e1] rounded px-1.5 py-0.5 text-right font-mono font-bold text-xs" />
            </div>
            <div>
              <span class="text-[10px] font-bold text-neutral-400">NET:</span>
              <span id="cart-grand" class="text-black font-mono font-black text-base ml-1">₹0</span>
            </div>
          </div>
          <div id="bogo-applied-info" class="hidden text-emerald-700 text-[10px] font-black flex justify-between border-t border-neutral-200 pt-1">
            <span><i class="fa-solid fa-gift mr-1"></i> BOGO Applied:</span>
            <span id="bogo-discount-amount" class="font-mono">-₹0</span>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-1">
          <button onclick="setPayment('Cash', this)" class="pay-btn py-1.5 rounded text-[10px] font-black uppercase bg-amber-400 text-black border border-amber-500 shadow-xs">Cash</button>
          <button onclick="setPayment('UPI', this)" class="pay-btn py-1.5 rounded text-[10px] font-bold uppercase bg-white border border-[#cbd5e1] text-neutral-700">UPI</button>
          <button onclick="setPayment('Card', this)" class="pay-btn py-1.5 rounded text-[10px] font-bold uppercase bg-white border border-[#cbd5e1] text-neutral-700">Card</button>
        </div>

        <div class="grid grid-cols-6 gap-1 pt-0.5">
          <button onclick="printOnlyKOT()" class="pos-btn py-2 rounded-lg bg-[#334155] hover:bg-[#1e293b] text-white text-[10px] font-black uppercase tracking-tight shadow">KOT</button>
          <button id="btn-bogo-toggle" onclick="toggleBogo()" class="pos-btn py-2 rounded-lg bg-white text-neutral-800 border border-[#cbd5e1] text-[10px] font-black uppercase tracking-tight">BOGO</button>
          <button onclick="saveBillOnly()" class="pos-btn py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-black uppercase tracking-tight shadow">SAVE</button>
          <button onclick="holdCurrentCart()" class="pos-btn py-2 rounded-lg bg-amber-500 hover:bg-amber-600 text-black text-[10px] font-black uppercase tracking-tight">HOLD</button>
          <button onclick="clearCart()" class="pos-btn py-2 rounded-lg bg-[#e2e8f0] hover:bg-[#cbd5e1] text-neutral-800 text-[10px] font-black uppercase tracking-tight">CLR</button>
          <button onclick="settleBillAndPrint()" class="pos-btn py-2 rounded-lg bg-black hover:bg-neutral-900 text-white text-[10px] font-black uppercase tracking-wider shadow-lg">SETTLE</button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-2 space-y-1.5 no-scrollbar bg-white" id="cart-items-container"></div>
    </section>
  </main>

  <main id="view-sales" class="flex-1 flex flex-col p-3 bg-[#0b1120] overflow-y-auto hidden">
    <div class="bg-white rounded-xl shadow-xl overflow-hidden flex flex-col flex-1 border border-neutral-300">
      <div class="p-3 bg-[#0f172a] text-white flex items-center justify-between">
        <div>
          <h2 class="text-sm font-black uppercase tracking-wider">Sales Ledger & Cloud Sync</h2>
          <p id="sales-report-date-tag" class="text-[11px] text-neutral-400 font-mono">Today</p>
        </div>

        <div class="flex items-center space-x-1.5">
          <button id="btn-sales-month" onclick="filterSales('month')" class="px-2.5 py-1.5 bg-[#1e293b] hover:bg-[#334155] border border-neutral-700 rounded-lg text-xs font-bold text-white">Full Month</button>
          <button id="btn-sales-yesterday" onclick="filterSales('yesterday')" class="px-2.5 py-1.5 bg-[#1e293b] hover:bg-[#334155] border border-neutral-700 rounded-lg text-xs font-bold text-white">Yesterday</button>
          <button id="btn-sales-today" onclick="filterSales('today')" class="px-2.5 py-1.5 bg-white text-black rounded-lg text-xs font-black shadow">Today</button>
          <button onclick="switchView('tables')" class="px-2.5 py-1.5 bg-neutral-700 text-white rounded-lg text-xs font-bold">Close</button>
        </div>
      </div>

      <div class="bg-[#f8fafc] border-b border-[#cbd5e1] p-3 flex items-center justify-between">
        <span class="text-sm font-bold text-neutral-600">Net Revenue: <strong id="sales-total-amount" class="text-xl text-black font-mono font-black ml-1">₹0.00</strong></span>
        <span class="text-xs font-bold text-neutral-500">Invoices Count: <strong id="sales-total-bills" class="font-mono text-black text-sm ml-1">0</strong></span>
      </div>

      <div class="flex-1 overflow-y-auto no-scrollbar">
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-[#f1f5f9] border-b border-[#cbd5e1] text-neutral-700 font-extrabold sticky top-0">
            <tr>
              <th class="p-2.5 border-r border-[#cbd5e1]">Bill #</th>
              <th class="p-2.5 border-r border-[#cbd5e1]">Timestamp</th>
              <th class="p-2.5 border-r border-[#cbd5e1]">Tender</th>
              <th class="p-2.5 border-r border-[#cbd5e1]">Type</th>
              <th class="p-2.5 border-r border-[#cbd5e1] text-right">Discount</th>
              <th class="p-2.5 text-right">Net Amount</th>
            </tr>
          </thead>
          <tbody id="sales-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <main id="view-held" class="flex-1 overflow-y-auto p-3 bg-[#0b1120] hidden">
    <div class="max-w-xl mx-auto space-y-3">
      <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow-md border border-neutral-300">
        <h2 class="text-xs font-black uppercase text-neutral-900 tracking-wider"><i class="fa-solid fa-pause text-amber-500 mr-2"></i> Held Tickets Queue</h2>
        <span id="held-total-badge" class="px-2.5 py-1 rounded bg-[#f1f5f9] border border-[#cbd5e1] text-xs text-neutral-800 font-mono font-black">0 Held</span>
      </div>
      <div id="held-orders-list" class="space-y-2"></div>
    </div>
  </main>

  <main id="view-menu" class="flex-1 overflow-y-auto p-3 bg-[#0b1120] hidden">
    <div class="max-w-xl mx-auto space-y-3">
      <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow-md border border-neutral-300">
        <h2 class="text-xs font-black uppercase text-neutral-900 tracking-wider"><i class="fa-solid fa-sliders text-neutral-700 mr-2"></i> Menu Editor</h2>
        <div class="flex space-x-2">
          <button onclick="toggleAddForm()" class="px-3 py-1 bg-black text-white text-xs font-black rounded-lg">+ Add Item</button>
          <button onclick="resetMenuToOriginal()" class="px-3 py-1 bg-[#e2e8f0] text-black text-xs font-bold rounded-lg">Reset Defaults</button>
        </div>
      </div>

      <div id="add-item-card" class="bg-white border border-[#cbd5e1] p-3 rounded-xl hidden space-y-2 shadow-lg">
        <h3 class="text-xs font-black text-black uppercase">Create New Item</h3>
        <div class="space-y-2">
          <div>
            <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Item Name</label>
            <input id="new-item-name" type="text" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-2 text-xs font-bold text-black focus:outline-none" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Category</label>
              <select id="new-item-category" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-2 text-xs font-bold text-black"></select>
            </div>
            <div>
              <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Pricing Type</label>
              <select id="new-item-type" onchange="toggleSizeInputs(this.value)" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-2 text-xs font-bold text-black">
                <option value="single">Single Price</option>
                <option value="sizes">Sizes (R/M/L)</option>
              </select>
            </div>
          </div>
          <div id="new-single-price-wrap">
            <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Price (₹)</label>
            <input id="new-item-price" type="number" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-2 text-xs font-bold text-black font-mono" />
          </div>
          <div id="new-sizes-price-wrap" class="hidden grid grid-cols-3 gap-2">
            <div>
              <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Regular</label>
              <input id="new-item-price-reg" type="number" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-1.5 text-xs font-bold text-black font-mono" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Medium</label>
              <input id="new-item-price-med" type="number" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-1.5 text-xs font-bold text-black font-mono" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-neutral-500 block mb-0.5">Large</label>
              <input id="new-item-price-lrg" type="number" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded p-1.5 text-xs font-bold text-black font-mono" />
            </div>
          </div>
          <div class="flex justify-end space-x-2 pt-2">
            <button onclick="toggleAddForm()" class="px-3 py-1.5 bg-[#e2e8f0] rounded text-xs font-bold">Cancel</button>
            <button onclick="saveNewItem()" class="px-4 py-1.5 bg-black rounded text-xs text-white font-black">Save Item</button>
          </div>
        </div>
      </div>

      <div id="menu-editor-list" class="space-y-2"></div>
    </div>
  </main>

  <div id="size-modal" class="fixed inset-0 bg-black/75 flex items-center justify-center p-3 z-50 hidden">
    <div class="bg-white border border-[#cbd5e1] w-full max-w-xs rounded-2xl p-4 shadow-2xl">
      <div class="flex justify-between items-center mb-3">
        <h4 id="size-modal-title" class="text-sm font-black text-black">Select Portion</h4>
        <button onclick="closeSizeModal()" class="text-neutral-400 hover:text-black text-sm"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="size-modal-options" class="space-y-2"></div>
    </div>
  </div>

    const DEFAULT_CATEGORIES = ['1. Pizza Mania', '2. Special Veg Pizza', '1 Veg', '2 Veg', '3 Veg', 'Burger', 'Sandwich', 'Pasta', 'Wraps', 'Veg Sides', 'Soup & Salad', 'Shakes', 'Beverages', 'Meals'];

    let heldOrders = JSON.parse(localStorage.getItem('de_held_orders_v30')) || [];
    let cart = {};
    let activeCategory = 'All';
    let currentOrderMode = 'Dine In';
    let selectedTable = '1';
    let selectedPayment = 'Cash';
    let isBogoActive = false;
    let activeSalesFilter = 'today';
    let activeResumedHoldId = null;

    function saveState() {
      localStorage.setItem('de_menu_v30', JSON.stringify(menu));
      localStorage.setItem('de_petpooja_orders_v30', JSON.stringify(orders));
      localStorage.setItem('de_held_orders_v30', JSON.stringify(heldOrders));
      updateHeldBadge();
      renderTableCards();
    }

    function updateHeldBadge() {
      document.getElementById('held-count-badge').innerText = heldOrders.length;
    }

    function scrollCategories(amount) {
      document.getElementById('category-bar').scrollBy({ left: amount, behavior: 'smooth' });
    }

    function handleCatWheel(e) {
      if (e.deltaY !== 0) {
        e.preventDefault();
        document.getElementById('category-bar').scrollLeft += e.deltaY;
      }
    }

    function toggleBogo() {
      isBogoActive = !isBogoActive;
      const btn = document.getElementById('btn-bogo-toggle');
      if (isBogoActive) {
        btn.classList.remove('bg-white', 'text-neutral-800', 'border-[#cbd5e1]');
        btn.classList.add('bg-black', 'text-white', 'border-black');
      } else {
        btn.classList.add('bg-white', 'text-neutral-800', 'border-[#cbd5e1]');
        btn.classList.remove('bg-black', 'text-white', 'border-black');
      }
      recalcCart();
    }

    function resetMenuToOriginal() {
      if (confirm('Reset menu back to factory prices?')) {
        menu = JSON.parse(JSON.stringify(DEFAULT_MENU));
        saveState();
        renderCategories();
        renderItems();
        renderMenuEditor();
      }
    }

    function getUniqueCategories() {
      const cats = new Set(DEFAULT_CATEGORIES);
      menu.forEach(it => cats.add(it.category));
      return Array.from(cats);
    }

    function renderTableCards() {
      const container = document.getElementById('table-cards-container');
      container.innerHTML = '';
      const tableList = ['1', '2', '3', '4', '5', '6', '7', '8'];

      tableList.forEach(t => {
        const runningHeld = heldOrders.find(h => h.mode === 'Dine In' && h.table === t);
        const isOccupied = !!runningHeld;

        const card = document.createElement('button');
        card.onclick = () => openTableRegister(t, runningHeld ? runningHeld.hold_id : null);
        card.className = `pos-btn p-3 rounded-2xl border-2 flex flex-col justify-between text-left h-28 transition shadow-md ${
          isOccupied ? 'bg-amber-500/10 border-amber-500 hover:bg-amber-500/20' : 'bg-[#131d31] border-[#1e293b] hover:border-white hover:bg-[#1a263f]'
        }`;

        card.innerHTML = `
          <div class="flex justify-between items-start w-full">
            <span class="text-2xl font-black ${isOccupied ? 'text-amber-400 font-mono' : 'text-white'}">${t}</span>
            <span class="text-[9px] font-black uppercase px-2 py-0.5 rounded-full ${isOccupied ? 'bg-amber-500 text-black font-bold' : 'bg-[#1e293b] text-neutral-400'}">${isOccupied ? 'RUNNING' : 'VACANT'}</span>
          </div>
          <div class="w-full">
            <p class="text-[10px] font-bold text-neutral-400">TABLE ${t}</p>
            <p class="font-mono text-sm font-black ${isOccupied ? 'text-amber-400' : 'text-neutral-500'}">${isOccupied ? '₹' + runningHeld.grand : 'READY'}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderCategories() {
      const bar = document.getElementById('category-bar');
      bar.innerHTML = '';
      const allCats = ['All', ...getUniqueCategories()];
      allCats.forEach(cat => {
        const btn = document.createElement('button');
        btn.innerText = cat;
        btn.className = `pos-btn px-3 py-1.5 rounded-lg font-black whitespace-nowrap text-xs transition flex-shrink-0 ${
          cat === activeCategory ? 'bg-black text-white shadow' : 'bg-white text-neutral-800 hover:bg-neutral-200 border border-[#cbd5e1]'
        }`;
        btn.onclick = () => {
          activeCategory = cat;
          renderCategories();
          renderItems();
        };
        bar.appendChild(btn);
      });
    }

    function renderItems() {
      const grid = document.getElementById('items-grid');
      grid.innerHTML = '';
      const query = (document.getElementById('item-search').value || '').toLowerCase();

      const items = menu.filter(it => {
        const matchesCat = activeCategory === 'All' || it.category === activeCategory;
        const matchesQuery = it.name.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      items.forEach(it => {
        const hasSizes = it.price_medium !== undefined && it.price_medium !== null && it.price_medium > 0;
        const btn = document.createElement('button');
        btn.className = `pos-btn bg-white hover:bg-[#f1f5f9] border border-[#cbd5e1] active:border-black rounded-xl p-2.5 flex flex-col justify-between text-left h-24 transition shadow-xs ${!it.available ? 'opacity-40' : ''}`;
        btn.onclick = () => handleItemSelect(it);

        btn.innerHTML = `
          <div>
            <span class="text-[8px] font-black text-neutral-400 block uppercase tracking-wider">${it.category}</span>
            <p class="text-[12.5px] font-black text-neutral-900 line-clamp-2 leading-tight mt-0.5">${it.name}</p>
          </div>
          <div class="flex justify-between items-center w-full mt-1">
            <span class="font-mono text-sm font-black text-black">₹${it.price_regular}</span>
            ${hasSizes ? '<span class="text-[8px] px-1.5 py-0.5 rounded bg-neutral-100 text-black border border-neutral-300 font-extrabold">SIZES</span>' : ''}
          </div>
        `;
        grid.appendChild(btn);
      });
    }
