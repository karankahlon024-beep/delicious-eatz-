<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Eatz - POS Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar for clean POS look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Header Bar -->
    <header class="bg-slate-900 text-white px-4 py-2.5 flex justify-between items-center shadow-md select-none">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-500 text-slate-900 font-bold px-3 py-1 rounded text-lg tracking-wide">
                <i class="fa-solid fa-utensils mr-1.5"></i> DELICIOUS EATZ
            </div>
            <span class="text-xs bg-slate-800 text-slate-300 px-2 py-1 rounded border border-slate-700">
                <i class="fa-solid fa-circle text-emerald-400 text-[8px] mr-1"></i> Terminal: PC-01 (Khudda)
            </span>
        </div>
        <div class="flex items-center space-x-4 text-sm">
            <span id="live-clock" class="font-medium text-slate-300"></span>
            <button onclick="syncData()" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded transition text-slate-200">
                <i class="fa-solid fa-rotate mr-1"></i> Sync
            </button>
        </div>
    </header>

    <!-- Main 3-Column POS Workspace -->
    <main class="flex-1 grid grid-cols-12 gap-2 p-2 overflow-hidden">

        <!-- COLUMN 1: Categories & Menu Grid (Cols 1 to 6) -->
        <section class="col-span-6 bg-white rounded-lg shadow-sm border border-slate-200 flex flex-col overflow-hidden">
            <!-- Search & Order Type Bar -->
            <div class="p-3 border-b border-slate-200 bg-slate-50 flex gap-2 items-center">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                    <input type="text" id="menu-search" oninput="filterMenu()" placeholder="Search items by name or code..." 
                           class="w-full pl-9 pr-3 py-2 bg-white border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div class="flex bg-slate-200 p-1 rounded-md text-xs font-semibold">
                    <button onclick="setOrderType('Dine-In')" id="type-dine" class="px-3 py-1.5 rounded bg-white text-slate-900 shadow-sm transition">Dine-In</button>
                    <button onclick="setOrderType('Takeaway')" id="type-take" class="px-3 py-1.5 rounded text-slate-600 transition">Takeaway</button>
                </div>
            </div>

            <!-- Category Filter Tabs -->
            <div id="category-tabs" class="flex gap-2 p-2.5 bg-slate-100 border-b border-slate-200 overflow-x-auto whitespace-nowrap">
                <!-- Dynamically loaded category buttons -->
            </div>

            <!-- Product Grid Cards -->
            <div id="product-grid" class="flex-1 p-3 grid grid-cols-3 gap-3 overflow-y-auto bg-slate-50/50">
                <!-- Dynamically loaded product cards -->
            </div>
        </section>

        <!-- COLUMN 2: Active Cart / KOT Panel (Cols 7 to 10) -->
        <section class="col-span-4 bg-white rounded-lg shadow-sm border border-slate-200 flex flex-col overflow-hidden">
            <!-- Cart Header -->
            <div class="p-3 bg-slate-900 text-white flex justify-between items-center">
                <div class="font-semibold text-sm flex items-center">
                    <i class="fa-solid fa-receipt mr-2 text-amber-400"></i> Current Order
                    <span id="cart-count-badge" class="ml-2 bg-amber-500 text-slate-950 font-bold px-2 py-0.5 rounded-full text-xs">0</span>
                </div>
                <button onclick="clearCart()" class="text-xs text-rose-300 hover:text-rose-100 transition">
                    <i class="fa-solid fa-trash mr-1"></i> Clear
                </button>
            </div>

            <!-- Cart Items List -->
            <div id="cart-items" class="flex-1 overflow-y-auto divide-y divide-slate-100 p-2">
                <!-- Empty state placeholder -->
                <div class="h-full flex flex-col items-center justify-center text-slate-400 text-sm select-none">
                    <i class="fa-solid fa-basket-shopping text-3xl mb-2 text-slate-300"></i>
                    <span>Cart is empty</span>
                    <span class="text-xs text-slate-400 mt-1">Select items from the menu</span>
                </div>
            </div>

            <!-- Cart Summary & Actions -->
            <div class="p-3 border-t border-slate-200 bg-slate-50 space-y-2">
                <div class="space-y-1 text-xs text-slate-600">
                    <div class="flex justify-between"><span>Subtotal:</span> <span id="summary-subtotal" class="font-medium text-slate-800">₹0.00</span></div>
                    <div class="flex justify-between"><span>GST (5%):</span> <span id="summary-tax" class="font-medium text-slate-800">₹0.00</span></div>
                    <div class="flex justify-between text-sm font-bold text-slate-900 pt-1 border-t border-slate-200">
                        <span>Total Amount:</span> <span id="summary-total" class="text-amber-600">₹0.00</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="printKOT()" class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-semibold py-2 px-3 rounded text-xs transition border border-amber-300">
                        <i class="fa-solid fa-print mr-1"></i> Print KOT
                    </button>
                    <button onclick="settleBill('Cash')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-3 rounded text-xs transition shadow-sm">
                        <i class="fa-solid fa-cash-register mr-1"></i> Settle (Cash)
                    </button>
                </div>
            </div>
        </section>

        <!-- COLUMN 3: Quick Controls & Running Orders (Cols 11 to 12) -->
        <section class="col-span-2 bg-white rounded-lg shadow-sm border border-slate-200 flex flex-col overflow-hidden">
            <div class="p-3 bg-slate-800 text-white font-semibold text-xs tracking-wide uppercase border-b border-slate-700">
                <i class="fa-solid fa-bolt mr-1 text-amber-400"></i> Quick Actions
            </div>
            <div class="p-3 space-y-2.5 flex-1 overflow-y-auto">
                <button onclick="applyBogo()" class="w-full text-left bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-900 p-2.5 rounded text-xs font-medium transition">
                    <i class="fa-solid fa-tag text-indigo-600 mr-1.5"></i> Apply BOGO Offer
                </button>
                <button onclick="holdOrder()" class="w-full text-left bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-900 p-2.5 rounded text-xs font-medium transition">
                    <i class="fa-solid fa-pause text-amber-600 mr-1.5"></i> Hold Current Order
                </button>
                <button onclick="viewHeldOrders()" class="w-full text-left bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-800 p-2.5 rounded text-xs font-medium transition">
                    <i class="fa-solid fa-list-check text-slate-600 mr-1.5"></i> Held Orders
                </button>
                <button onclick="openDailyLedger()" class="w-full text-left bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-800 p-2.5 rounded text-xs font-medium transition">
                    <i class="fa-solid fa-chart-line text-slate-600 mr-1.5"></i> Sales Ledger
                </button>
            </div>
            <div class="p-3 bg-slate-50 border-t border-slate-200 text-center">
                <span class="text-[10px] text-slate-400">Delicious Eatz POS v3.2</span>
            </div>
        </section>

    </main>

    <!-- JavaScript POS Core Logic -->
    <script>
        // Sample Menu Data (Easily replaceable with your full menu items)
        const menuData = [
            { id: 1, name: 'Margherita Pizza', category: 'Pizzas', price: 199, code: 'P01' },
            { id: 2, name: 'Farmhouse Pizza', category: 'Pizzas', price: 299, code: 'P02' },
            { id: 3, name: 'Paneer Makhani Pizza', category: 'Pizzas', price: 349, code: 'P03' },
            { id: 4, name: 'Veggie Burger', category: 'Burgers', price: 99, code: 'B01' },
            { id: 5, name: 'Crispy Chicken Burger', category: 'Burgers', price: 149, code: 'B02' },
            { id: 6, name: 'Double Cheese Burger', category: 'Burgers', price: 189, code: 'B03' },
            { id: 7, name: 'Hakka Noodles', category: 'Chinese', price: 130, code: 'C01' },
            { id: 8, name: 'Veg Manchurian', category: 'Chinese', price: 150, code: 'C02' },
            { id: 9, name: 'Cold Coffee', category: 'Beverages', price: 90, code: 'D01' },
            { id: 10, name: 'Chocolate Shake', category: 'Beverages', price: 120, code: 'D02' }
        ];

        let cart = [];
        let currentCategory = 'All';
        let currentOrderType = 'Dine-In';

        // Initialize UI
        window.onload = function() {
            updateClock();
            setInterval(updateClock, 1000);
            renderCategories();
            renderProducts(menuData);
        };

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + ' | ' + now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
        }

        function setOrderType(type) {
            currentOrderType = type;
            document.getElementById('type-dine').className = type === 'Dine-In' ? 'px-3 py-1.5 rounded bg-white text-slate-900 shadow-sm transition' : 'px-3 py-1.5 rounded text-slate-600 transition';
            document.getElementById('type-take0' || 'type-take').className = type === 'Takeaway' ? 'px-3 py-1.5 rounded bg-white text-slate-900 shadow-sm transition' : 'px-3 py-1.5 rounded text-slate-600 transition';
        }

        function renderCategories() {
            const categories = ['All', ...new Set(menuData.map(item => item.category))];
            const container = document.getElementById('category-tabs');
            container.innerHTML = categories.map(cat => `
                <button onclick="filterByCategory('${cat}')" class="px-3 py-1.5 rounded-md text-xs font-medium transition ${currentCategory === cat ? 'bg-amber-500 text-slate-950 font-bold shadow-sm' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                    ${cat}
                </button>
            `).join('');
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            renderCategories();
            filterMenu();
        }

        function filterMenu() {
            const query = document.getElementById('menu-search').value.toLowerCase();
            const filtered = menuData.filter(item => {
                const matchesCat = currentCategory === 'All' || item.category === currentCategory;
                const matchesQuery = item.name.toLowerCase().includes(query) || item.code.toLowerCase().includes(query);
                return matchesCat && matchesQuery;
            });
            renderProducts(filtered);
        }

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center py-10 text-slate-400 text-sm">No items found</div>`;
                return;
            }
            grid.innerHTML = items.map(item => `
                <button onclick="addToCart(${item.id})" class="bg-white p-3 rounded-lg border border-slate-200 hover:border-amber-400 hover:shadow-md transition text-left flex flex-col justify-between group h-24">
                    <div class="font-semibold text-xs text-slate-700 group-hover:text-amber-700 line-clamp-2">${item.name}</div>
                    <div class="flex justify-between items-end w-full">
                        <span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-mono">${item.code}</span>
                        <span class="text-sm font-bold text-slate-900">₹${item.price}</span>
                    </div>
                </button>
            `).join('');
        }

        function addToCart(id) {
            const product = menuData.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
        }

        function updateQuantity(id, change) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
        }

        function clearCart() {
            cart = [];
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const badge = document.getElementById('cart-count-badge');
            
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.innerText = totalQty;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 text-sm select-none">
                        <i class="fa-solid fa-basket-shopping text-3xl mb-2 text-slate-300"></i>
                        <span>Cart is empty</span>
                        <span class="text-xs text-slate-400 mt-1">Select items from the menu</span>
                    </div>`;
                document.getElementById('summary-subtotal').innerText = '₹0.00';
                document.getElementById('summary-tax').innerText = '₹0.00';
                document.getElementById('summary-total').innerText = '₹0.00';
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="py-2 flex justify-between items-center text-xs">
                    <div class="flex-1 pr-2">
                        <div class="font-medium text-slate-800">${item.name}</div>
                        <div class="text-slate-500 text-[11px]">₹${item.price} × ${item.qty}</div>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <button onclick="updateQuantity(${item.id}, -1)" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded flex items-center justify-center font-bold">-</button>
                        <span class="w-5 text-center font-semibold">${item.qty}</span>
                        <button onclick="updateQuantity(${item.id}, 1)" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded flex items-center justify-center font-bold">+</button>
                    </div>
                    <div class="w-14 text-right font-bold text-slate-900">₹${item.price * item.qty}</div>
                </div>
            `).join('');

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const tax = subtotal * 0.05; // 5% GST
            const total = subtotal + tax;

            document.getElementById('summary-subtotal').innerText = `₹${subtotal.toFixed(2)}`;
            document.getElementById('summary-tax').innerText = `₹${tax.toFixed(2)}`;
            document.getElementById('summary-total').innerText = `₹${total.toFixed(2)}`;
        }

        function printKOT() {
            if (cart.length === 0) { alert('Cart is empty!'); return; }
            alert('KOT sent to printer successfully!');
        }

        function settleBill(mode) {
            if (cart.length === 0) { alert('Cart is empty!'); return; }
            alert(`Order settled via ${mode}! Bill printed successfully.`);
            clearCart();
        }

        function applyBogo() { alert('BOGO offer applied to eligible items.'); }
        function holdOrder() { alert('Order placed on hold.'); clearCart(); }
        function viewHeldOrders() { alert('No held orders found.'); }
        function openDailyLedger() { alert('Opening daily sales ledger...'); }
        function syncData() { alert('Data synchronized successfully!'); }
    </script>
</body>
</html>
