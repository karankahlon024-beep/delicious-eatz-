<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Eatz - POS Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- Top Petpooja Header Bar (Removed Khudda) -->
    <header class="bg-[#d32f2f] text-white px-3 py-2 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-white text-[#d32f2f] font-extrabold px-2.5 py-1 rounded text-sm tracking-wide shadow-inner flex items-center">
                <i class="fa-solid fa-utensils mr-1.5 text-amber-500"></i> DELICIOUS EATZ <span class="text-[10px] text-slate-500 ml-1.5 font-normal">(R405167)</span>
            </div>
            <span class="text-xs bg-red-800 text-red-100 px-2.5 py-1 rounded font-medium border border-red-700">
                <i class="fa-solid fa-circle text-emerald-400 text-[8px] mr-1 animate-pulse"></i> Terminal Active: PC-01
            </span>
        </div>
        <div class="flex items-center space-x-4 text-xs font-medium">
            <div class="bg-red-900 px-3 py-1 rounded text-red-200 border border-red-800">
                <i class="fa-solid fa-clock mr-1"></i> <span id="live-clock"></span>
            </div>
            <button onclick="syncData()" class="bg-white text-[#d32f2f] hover:bg-red-50 px-3 py-1 rounded font-bold shadow transition">
                <i class="fa-solid fa-rotate mr-1"></i> Sync Data
            </button>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <main class="flex-1 flex overflow-hidden bg-slate-200">

        <!-- 1. COMPACT CATEGORY SIDEBAR -->
        <aside class="w-48 bg-white flex flex-col border-r border-slate-200 overflow-y-auto flex-shrink-0">
            <div class="p-2 bg-slate-50 border-b border-slate-200 font-bold text-[11px] text-slate-600 uppercase tracking-wide">
                Categories
            </div>
            <div id="category-list" class="flex flex-col divide-y divide-slate-100">
                <!-- Injected categories -->
            </div>
        </aside>

        <!-- 2. PRODUCT ITEM GRID -->
        <section class="flex-1 bg-slate-50 flex flex-col overflow-hidden border-r border-slate-200">
            <div class="p-2.5 bg-white border-b border-slate-200 flex items-center space-x-2">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                    <input type="text" id="menu-search" oninput="filterMenu()" placeholder="Search item by name or code..." 
                           class="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-300 rounded text-xs focus:outline-none focus:ring-1 focus:ring-red-500">
                </div>
                <div id="active-category-title" class="text-xs font-bold text-[#d32f2f] px-2 py-1 bg-red-50 rounded border border-red-200 whitespace-nowrap">
                    Pizza Mania
                </div>
            </div>

            <div id="product-grid" class="flex-1 p-3 grid grid-cols-3 gap-2.5 overflow-y-auto content-start">
                <!-- Injected products -->
            </div>
        </section>

        <!-- 3. ORDER CART & SETTLEMENT PANEL -->
        <section class="w-96 bg-white flex flex-col overflow-hidden flex-shrink-0">
            <div class="grid grid-cols-3 bg-slate-100 p-1 border-b border-slate-200 text-xs font-semibold text-center">
                <button onclick="setOrderType('Dine-In')" id="type-dine" class="py-1.5 bg-white rounded shadow-sm text-[#d32f2f] transition">Dine In</button>
                <button onclick="setOrderType('Delivery')" id="type-del" class="py-1.5 text-slate-600 rounded transition">Delivery</button>
                <button onclick="setOrderType('Pick Up')" id="type-pick" class="py-1.5 text-slate-600 rounded transition">Pick Up</button>
            </div>

            <div class="px-3 py-2 bg-red-50/50 border-b border-slate-200 flex justify-between items-center text-xs">
                <span class="font-bold text-slate-700"><i class="fa-solid fa-chair text-amber-600 mr-1"></i> Table: 3</span>
                <span class="text-slate-500 font-medium">Items: <span id="cart-item-count" class="font-bold text-slate-800">0</span></span>
            </div>

            <div class="grid grid-cols-12 bg-slate-200 px-3 py-1.5 text-[11px] font-bold text-slate-600">
                <div class="col-span-6">ITEMS</div>
                <div class="col-span-3 text-center">QTY</div>
                <div class="col-span-3 text-right">PRICE</div>
            </div>

            <div id="cart-items-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 px-2">
                <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs select-none py-10">
                    <i class="fa-solid fa-basket-shopping text-3xl mb-1 text-slate-300"></i>
                    <span>No items added yet</span>
                </div>
            </div>

            <!-- Cart Summary & Modifiers (Extra Charges & Discount) -->
            <div class="p-3 border-t border-slate-200 bg-slate-50 space-y-1.5 text-xs">
                <div class="flex justify-between text-slate-600"><span>Subtotal:</span> <span id="summary-subtotal" class="font-medium text-slate-800">₹0.00</span></div>
                
                <!-- Extra Charges & Discount Inputs -->
                <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-200">
                    <div class="flex items-center justify-between bg-white px-2 py-1 rounded border border-slate-200">
                        <span class="text-[11px] text-slate-500">Extra (+):</span>
                        <input type="number" id="extra-charges" oninput="updateCartUI()" value="0" min="0" class="w-14 text-right font-medium text-slate-800 focus:outline-none">
                    </div>
                    <div class="flex items-center justify-between bg-white px-2 py-1 rounded border border-slate-200">
                        <span class="text-[11px] text-slate-500">Disc (-):</span>
                        <input type="number" id="discount-amount" oninput="updateCartUI()" value="0" min="0" class="w-14 text-right font-medium text-slate-800 focus:outline-none">
                    </div>
                </div>

                <div class="flex justify-between text-sm font-extrabold text-slate-900 pt-1 border-t border-slate-200">
                    <span>Total Amount:</span> <span id="summary-total" class="text-[#d32f2f]">₹0.00</span>
                </div>
            </div>

            <div class="grid grid-cols-5 gap-1 p-2 bg-slate-100 border-t border-slate-200 text-[11px] font-semibold text-center">
                <button onclick="setPayMode('Cash')" id="pay-cash" class="bg-white border border-slate-300 py-1.5 rounded shadow-sm text-emerald-700">Cash</button>
                <button onclick="setPayMode('Card')" id="pay-card" class="bg-white border border-slate-300 py-1.5 rounded text-slate-600">Card</button>
                <button onclick="setPayMode('Due')" id="pay-due" class="bg-white border border-slate-300 py-1.5 rounded text-slate-600">Due</button>
                <button onclick="setPayMode('Other')" id="pay-other" class="bg-white border border-slate-300 py-1.5 rounded text-slate-600">Other</button>
                <button onclick="setPayMode('Paid')" id="pay-paid" class="bg-white border border-slate-300 py-1.5 rounded text-slate-600">Paid</button>
            </div>

            <div class="grid grid-cols-4 gap-1 p-2 bg-white border-t border-slate-200">
                <button onclick="saveOrder()" class="bg-slate-700 hover:bg-slate-800 text-white py-2 rounded text-xs font-bold transition shadow-sm">Save</button>
                <button onclick="printKOTDirect()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 py-2 rounded text-xs font-bold transition shadow-sm">KOT</button>
                <button onclick="printBillDirect()" class="bg-[#d32f2f] hover:bg-red-700 text-white py-2 rounded text-xs font-bold transition shadow-sm col-span-2">KOT & Print Bill</button>
            </div>
        </section>

    </main>

    <!-- SIZE SELECTOR MODAL -->
    <div id="size-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-80 p-5 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modal-item-name" class="font-bold text-sm text-slate-900">Select Size</h3>
                <button onclick="closeSizeModal()" class="text-slate-400 hover:text-slate-600 font-bold"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-size-options" class="space-y-2">
                <!-- Size options injected here -->
            </div>
            <button onclick="closeSizeModal()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded text-xs font-semibold transition">Cancel</button>
        </div>
    </div>

        window.onload = function() {
            updateClock();
            setInterval(updateClock, 1000);
            renderCategories();
            renderProducts(currentCategory);
        };

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + ' | ' + now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
        }

        function renderCategories() {
            const categories = Object.keys(menuDatabase);
            const container = document.getElementById('category-list');
            container.innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat}')" class="text-left px-3 py-2 text-xs font-medium transition flex justify-between items-center ${currentCategory === cat ? 'bg-red-50 text-[#d32f2f] font-bold border-l-4 border-[#d32f2f]' : 'text-slate-700 hover:bg-slate-50'}">
                    <span class="truncate">${cat}</span>
                    <i class="fa-solid fa-chevron-right text-[9px] text-slate-300"></i>
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            currentCategory = cat;
            document.getElementById('active-category-title').innerText = cat;
            renderCategories();
            renderProducts(cat);
        }

        function renderProducts(cat) {
            const items = menuDatabase[cat] || [];
            const grid = document.getElementById('product-grid');
            grid.innerHTML = items.map(item => {
                let priceHtml = '';
                if (item.prices.M && item.prices.M > 0) {
                    priceHtml = `<div class="text-[10px] text-slate-500">R:${item.prices.R} | M:${item.prices.M} | L:${item.prices.L}</div>`;
                } else if (item.prices.L && item.prices.L > 0) {
                    priceHtml = `<div class="text-[10px] text-slate-500">R:${item.prices.R} | L:${item.prices.L}</div>`;
                } else {
                    priceHtml = `<div class="text-xs font-bold text-slate-900">₹${item.prices.R}</div>`;
                }

                const itemJson = encodeURIComponent(JSON.stringify(item));
                return `
                    <button onclick="handleItemClick('${itemJson}')" class="bg-white p-2.5 rounded border border-slate-200 hover:border-red-400 hover:shadow-sm transition text-left flex flex-col justify-between h-20 group">
                        <div class="font-semibold text-xs text-slate-800 group-hover:text-[#d32f2f] line-clamp-2">${item.name}</div>
                        <div>${priceHtml}</div>
                    </button>
                `;
            }).join('');
        }

        function handleItemClick(encodedItem) {
            const item = JSON.parse(decodeURIComponent(encodedItem));
            const hasMultipleSizes = (item.prices.M && item.prices.M > 0) || (item.prices.L && item.prices.L > 0 && !item.prices.M);
            
            if (hasMultipleSizes) {
                openSizeModal(item);
            } else {
                addToCart(item.id, item.name, 'Regular', item.prices.R);
            }
        }

        function openSizeModal(item) {
            activeItemForModal = item;
            document.getElementById('modal-item-name').innerText = item.name;
            const container = document.getElementById('modal-size-options');
            
            let html = `<button onclick="selectSizeAndAdd('Regular', ${item.prices.R})" class="w-full bg-slate-50 hover:bg-red-50 border border-slate-200 hover:border-red-400 p-2.5 rounded flex justify-between items-center text-xs font-semibold transition">
                <span>Regular (R)</span> <span class="text-[#d32f2f] font-bold">₹${item.prices.R}</span>
            </button>`;

            if (item.prices.M && item.prices.M > 0) {
                html += `<button onclick="selectSizeAndAdd('Medium', ${item.prices.M})" class="w-full bg-slate-50 hover:bg-red-50 border border-slate-200 hover:border-red-400 p-2.5 rounded flex justify-between items-center text-xs font-semibold transition">
                    <span>Medium (M)</span> <span class="text-[#d32f2f] font-bold">₹${item.prices.M}</span>
                </button>`;
            }

            if (item.prices.L && item.prices.L > 0) {
                html += `<button onclick="selectSizeAndAdd('Large', ${item.prices.L})" class="w-full bg-slate-50 hover:bg-red-50 border border-slate-200 hover:border-red-400 p-2.5 rounded flex justify-between items-center text-xs font-semibold transition">
                    <span>Large (L)</span> <span class="text-[#d32f2f] font-bold">₹${item.prices.L}</span>
                </button>`;
            }

            container.innerHTML = html;
            document.getElementById('size-modal').classList.remove('hidden');
        }

        function closeSizeModal() {
            document.getElementById('size-modal').classList.add('hidden');
            activeItemForModal = null;
        }

        function selectSizeAndAdd(size, price) {
            if (activeItemForModal) {
                addToCart(activeItemForModal.id, `${activeItemForModal.name} (${size})`, size, price);
                closeSizeModal();
            }
        }

        function filterMenu() {
            const query = document.getElementById('menu-search').value.toLowerCase();
            const grid = document.getElementById('product-grid');
            let results = [];
            
            Object.keys(menuDatabase).forEach(cat => {
                menuDatabase[cat].forEach(item => {
                    if (item.name.toLowerCase().includes(query) || item.id.toLowerCase().includes(query)) {
                        results.push(item);
                    }
                });
            });

            if (results.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center py-10 text-slate-400 text-xs">No matching items found</div>`;
                return;
            }

            grid.innerHTML = results.map(item => {
                const itemJson = encodeURIComponent(JSON.stringify(item));
                return `
                    <button onclick="handleItemClick('${itemJson}')" class="bg-white p-2.5 rounded border border-slate-200 hover:border-red-400 hover:shadow-sm transition text-left flex flex-col justify-between h-20 group">
                        <div class="font-semibold text-xs text-slate-800 group-hover:text-[#d32f2f] line-clamp-2">${item.name}</div>
                        <div class="text-xs font-bold text-slate-900">₹${item.prices.R}</div>
                    </button>
                `;
            }).join('');
        }

        function addToCart(id, name, size, price) {
            const cartId = `${id}-${size}`;
            const existing = cart.find(i => i.cartId === cartId);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ cartId, id, name, size, price, qty: 1 });
            }
            updateCartUI();
        }

        function updateQty(cartId, change) {
            const item = cart.find(i => i.cartId === cartId);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.cartId !== cartId);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-list');
            const totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
            document.getElementById('cart-item-count').innerText = totalQty;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs select-none py-10">
                        <i class="fa-solid fa-basket-shopping text-3xl mb-1 text-slate-300"></i>
                        <span>No items added yet</span>
                    </div>`;
                document.getElementById('summary-subtotal').innerText = '₹0.00';
                document.getElementById('summary-total').innerText = '₹0.00';
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="py-2 grid grid-cols-12 items-center text-xs">
                    <div class="col-span-6 pr-1 font-medium text-slate-800 truncate">${item.name}</div>
                    <div class="col-span-3 flex items-center justify-center space-x-1">
                        <button onclick="updateQty('${item.cartId}', -1)" class="w-5 h-5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-bold">-</button>
                        <span class="w-4 text-center font-bold">${item.qty}</span>
                        <button onclick="updateQty('${item.cartId}', 1)" class="w-5 h-5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-bold">+</button>
                    </div>
                    <div class="col-span-3 text-right font-bold text-slate-900">₹${item.price * item.qty}</div>
                </div>
            `).join('');

            const subtotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const extra = parseFloat(document.getElementById('extra-charges').value) || 0;
            const discount = parseFloat(document.getElementById('discount-amount').value) || 0;
            const total = subtotal + extra - discount;

            document.getElementById('summary-subtotal').innerText = `₹${subtotal.toFixed(2)}`;
            document.getElementById('summary-total').innerText = `₹${Math.max(0, total).toFixed(2)}`;
        }

        function setOrderType(type) {
            currentOrderType = type;
            ['dine', 'del', 'pick'].forEach(t => {
                const el = document.getElementById(`type-${t}`);
                el.className = el.innerText.toLowerCase().includes(type.toLowerCase()) 
                    ? 'py-1.5 bg-white rounded shadow-sm text-[#d32f2f] font-bold transition' 
                    : 'py-1.5 text-slate-600 rounded transition';
            });
        }

        function setPayMode(mode) {
            currentPayMode = mode;
            ['cash', 'card', 'due', 'other', 'paid'].forEach(m => {
                const el = document.getElementById(`pay-${m}`);
                el.className = el.innerText.toLowerCase() === mode.toLowerCase() 
                    ? 'bg-emerald-600 text-white border border-emerald-700 py-1.5 rounded shadow-sm font-bold' 
                    : 'bg-white border border-slate-300 py-1.5 rounded text-slate-600';
            });
        }

        function saveOrder() {
            if (cart.length === 0) { alert('Cart is empty'); return; }
            alert('Order saved successfully.');
            cart = [];
            document.getElementById('extra-charges').value = 0;
            document.getElementById('discount-amount').value = 0;
            updateCartUI();
        }

        function printKOTDirect() {
            if (cart.length === 0) { alert('Cart is empty'); return; }
            triggerThermalPrint('KOT');
        }

        function printBillDirect() {
            if (cart.length === 0) { alert('Cart is empty'); return; }
            triggerThermalPrint('BILL');
            cart = [];
            document.getElementById('extra-charges').value = 0;
            document.getElementById('discount-amount').value = 0;
            updateCartUI();
        }

        function triggerThermalPrint(type) {
            const extra = parseFloat(document.getElementById('extra-charges').value) || 0;
            const discount = parseFloat(document.getElementById('discount-amount').value) || 0;
            
            fetch('http://localhost:5000/print', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: type, orderType: currentOrderType, payMode: currentPayMode, extra: extra, discount: discount, items: cart })
            }).catch(err => {
                console.warn('Local print bridge connection skipped:', err);
            });
            alert(`${type} dispatched directly to thermal printer!`);
        }

        function syncData() {
            alert('Sales summary & data synchronized successfully with cloud ledger.');
        }
    </script>
</body>
</html>
