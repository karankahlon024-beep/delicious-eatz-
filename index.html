<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Eatz - POS Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); }
        }
        .toast-anim { animation: fadeInOut 2.5s ease-in-out forwards; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- Top Petpooja Header Bar -->
    <header class="bg-[#d32f2f] text-white px-3 py-2 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-white text-[#d32f2f] font-extrabold px-2.5 py-1 rounded text-sm tracking-wide shadow-inner flex items-center">
                <i class="fa-solid fa-utensils mr-1.5 text-amber-500"></i> DELICIOUS EATZ <span class="text-[10px] text-slate-500 ml-1.5 font-normal">(R405167)</span>
            </div>
            <span class="text-xs bg-red-800 text-red-100 px-2.5 py-1 rounded font-medium border border-red-700">
                <i class="fa-solid fa-circle text-emerald-400 text-[8px] mr-1 animate-pulse"></i> Terminal Active: PC-01
            </span>
        </div>
        <div class="flex items-center space-x-3 text-xs font-medium">
            <div class="bg-red-900 px-3 py-1 rounded text-red-200 border border-red-800">
                <i class="fa-solid fa-clock mr-1"></i> <span id="live-clock"></span>
            </div>
            <button onclick="openMenuEditor()" class="bg-white text-[#d32f2f] hover:bg-red-50 px-2.5 py-1 rounded font-bold shadow transition">
                <i class="fa-solid fa-pen-to-square mr-1"></i> Edit Menu
            </button>
            <button onclick="viewHeldOrdersModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-2.5 py-1 rounded font-bold shadow transition">
                <i class="fa-solid fa-pause mr-1"></i> Held (<span id="held-count">0</span>)
            </button>
            <button onclick="syncData()" class="bg-white text-[#d32f2f] hover:bg-red-50 px-2.5 py-1 rounded font-bold shadow transition">
                <i class="fa-solid fa-rotate mr-1"></i> Sync
            </button>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <main class="flex-1 flex overflow-hidden bg-slate-200">

        <!-- 1. COMPACT CATEGORY SIDEBAR -->
        <aside class="w-48 bg-white flex flex-col border-r border-slate-200 overflow-y-auto flex-shrink-0">
            <div class="p-2 bg-slate-50 border-b border-slate-200 font-bold text-[11px] text-slate-600 uppercase tracking-wide">
                Categories
            </div>
            <div id="category-list" class="flex flex-col divide-y divide-slate-100"></div>
        </aside>

        <!-- 2. PRODUCT ITEM GRID -->
        <section class="flex-1 bg-slate-50 flex flex-col overflow-hidden border-r border-slate-200">
            <div class="p-2.5 bg-white border-b border-slate-200 flex items-center space-x-2">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                    <input type="text" id="menu-search" oninput="filterMenu()" placeholder="Search item by name or code..." 
                           class="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-300 rounded text-xs focus:outline-none focus:ring-1 focus:ring-red-500">
                </div>
                <div id="active-category-title" class="text-xs font-bold text-[#d32f2f] px-2 py-1 bg-red-50 rounded border border-red-200 whitespace-nowrap">
                    Pizza Mania
                </div>
            </div>

            <div id="product-grid" class="flex-1 p-3 grid grid-cols-3 gap-2.5 overflow-y-auto content-start"></div>
        </section>

        <!-- 3. ORDER CART & SETTLEMENT PANEL -->
        <section class="w-96 bg-white flex flex-col overflow-hidden flex-shrink-0">
            <div class="grid grid-cols-3 bg-slate-100 p-1 border-b border-slate-200 text-xs font-semibold text-center">
                <button onclick="setOrderType('Dine-In')" id="type-dine" class="py-1.5 bg-white rounded shadow-sm text-[#d32f2f] transition">Dine In</button>
                <button onclick="setOrderType('Delivery')" id="type-del" class="py-1.5 text-slate-600 rounded transition">Delivery</button>
                <button onclick="setOrderType('Pick Up')" id="type-pick" class="py-1.5 text-slate-600 rounded transition">Pick Up</button>
            </div>

            <!-- Customer Details & Contact Input -->
            <div class="p-2 bg-red-50/40 border-b border-slate-200 grid grid-cols-2 gap-1.5 text-xs">
                <input type="text" id="customer-name" placeholder="Customer Name" class="bg-white border border-slate-300 px-2 py-1 rounded focus:outline-none focus:border-red-500">
                <input type="tel" id="customer-phone" placeholder="Phone / Contact" class="bg-white border border-slate-300 px-2 py-1 rounded focus:outline-none focus:border-red-500">
            </div>

            <div class="grid grid-cols-12 bg-slate-200 px-3 py-1.5 text-[11px] font-bold text-slate-600">
                <div class="col-span-6">ITEMS</div>
                <div class="col-span-3 text-center">QTY</div>
                <div class="col-span-3 text-right">PRICE</div>
            </div>

            <div id="cart-items-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 px-2">
                <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs select-none py-10">
                    <i class="fa-solid fa-basket-shopping text-3xl mb-1 text-slate-300"></i>
                    <span>No items added yet</span>
                </div>
            </div>

            <!-- Cart Summary & Modifiers -->
            <div class="p-3 border-t border-slate-200 bg-slate-50 space-y-1.5 text-xs">
                <div class="flex justify-between text-slate-600"><span>Subtotal:</span> <span id="summary-subtotal" class="font-medium text-slate-800">₹0.00</span></div>
                
                <div class="grid grid-cols-3 gap-1.5 pt-1 border-t border-slate-200">
                    <button onclick="toggleBogo()" id="bogo-btn" class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 py-1 rounded text-[11px] font-bold transition flex items-center justify-center">
                        <i class="fa-solid fa-tag text-amber-500 mr-1"></i> BOGO: <span id="bogo-status" class="ml-1 text-slate-400">OFF</span>
                    </button>
                    <div class="flex items-center justify-between bg-white px-2 py-1 rounded border border-slate-200">
                        <span class="text-[10px] text-slate-500">Extra:</span>
                        <input type="number" id="extra-charges" oninput="updateCartUI()" value="0" min="0" class="w-10 text-right font-medium text-slate-800 focus:outline-none">
                    </div>
                    <div class="flex items-center justify-between bg-white px-2 py-1 rounded border border-slate-200">
                        <span class="text-[10px] text-slate-500">Disc:</span>
                        <input type="number" id="discount-amount" oninput="updateCartUI()" value="0" min="0" class="w-10 text-right font-medium text-slate-800 focus:outline-none">
                    </div>
                </div>

                <div class="flex justify-between text-sm font-extrabold text-slate-900 pt-1 border-t border-slate-200">
                    <span>Total Amount:</span> <span id="summary-total" class="text-[#d32f2f]">₹0.00</span>
                </div>
            </div>

            <div class="grid grid-cols-5 gap-1 p-2 bg-slate-100 border-t border-slate-200 text-[11px] font-semibold text-center">
                <button onclick="setPayMode('Cash')" id="pay-cash" class="bg-white border border-slate-300 py-1.5 rounded shadow-sm text-emerald-700">Cash</button>
                <button onclick="setPayMode('Card')" id="pay-card" class="bg-white border border-slate-300 py-1.5 rounded text-slate-600">Card</button>
                <button onclick="setPayMode('Due')" id="pay-due" class="bg-white border border-slate-300 py-1.5 rounded text-slate-600">Due</button>
                <button onclick="setPayMode('Other')" id="pay-other" class="bg-white border border-slate-300 py-1.5 rounded text-slate-600">Other</button>
                <button onclick="setPayMode('Paid')" id="pay-paid" class="bg-white border border-slate-300 py-1.5 rounded text-slate-600">Paid</button>
            </div>

            <!-- Action Footer with Dustbin Delete Option -->
            <div class="grid grid-cols-6 gap-1 p-2 bg-white border-t border-slate-200">
                <button onclick="clearActiveOrder()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 py-2 rounded text-xs font-bold transition flex items-center justify-center" title="Delete Order"><i class="fa-solid fa-trash-can"></i></button>
                <button onclick="holdCurrentOrder()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 py-2 rounded text-xs font-bold transition shadow-sm">Hold</button>
                <button onclick="printKOTDirect()" class="bg-slate-700 hover:bg-slate-800 text-white py-2 rounded text-xs font-bold transition shadow-sm">KOT</button>
                <button onclick="printBillDirect()" class="bg-[#d32f2f] hover:bg-red-700 text-white py-2 rounded text-xs font-bold transition shadow-sm col-span-3">Print Bill</button>
            </div>
        </section>

    </main>

    <!-- SIZE SELECTOR MODAL -->
    <div id="size-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-80 p-5 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modal-item-name" class="font-bold text-sm text-slate-900">Select Size</h3>
                <button onclick="closeSizeModal()" class="text-slate-400 hover:text-slate-600 font-bold"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-size-options" class="space-y-2"></div>
            <button onclick="closeSizeModal()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded text-xs font-semibold transition">Cancel</button>
        </div>
    </div>

    <!-- HELD ORDERS MODAL -->
    <div id="held-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-96 p-5 space-y-4 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-slate-900"><i class="fa-solid fa-pause text-amber-500 mr-1.5"></i> Held Orders</h3>
                <button onclick="closeHeldOrdersModal()" class="text-slate-400 hover:text-slate-600 font-bold"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="held-orders-list" class="flex-1 overflow-y-auto space-y-2"></div>
            <button onclick="closeHeldOrdersModal()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded text-xs font-semibold transition">Close</button>
        </div>
    </div>

    <!-- EDIT MENU MODAL -->
    <div id="menu-editor-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-[500px] p-5 space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-slate-900"><i class="fa-solid fa-pen-to-square text-[#d32f2f] mr-1.5"></i> Edit Menu & Prices</h3>
                <button onclick="closeMenuEditor()" class="text-slate-400 hover:text-slate-600 font-bold"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex gap-2">
                <select id="editor-cat-select" onchange="renderEditorItems()" class="bg-slate-50 border border-slate-300 rounded px-2 py-1.5 text-xs flex-1 focus:outline-none"></select>
                <button onclick="openAddItemModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded text-xs transition">+ Add Item</button>
            </div>
            <div id="editor-items-list" class="flex-1 overflow-y-auto space-y-2 divide-y divide-slate-100"></div>
            <button onclick="closeMenuEditor()" class="w-full bg-slate-700 hover:bg-slate-800 text-white py-2 rounded text-xs font-semibold transition">Done</button>
        </div>
    </div>

    <!-- ADD/EDIT ITEM MODAL -->
    <div id="item-form-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-80 p-5 space-y-3">
            <h3 id="item-form-title" class="font-bold text-sm text-slate-900 border-b pb-1">Add New Item</h3>
            <input type="hidden" id="form-item-id">
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Item Name</label>
                <input type="text" id="form-item-name" class="w-full bg-slate-50 border border-slate-300 px-2.5 py-1.5 rounded text-xs focus:outline-none focus:border-red-500">
            </div>
            <div class="grid grid-cols-3 gap-2">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Regular (R)</label>
                    <input type="number" id="form-item-r" class="w-full bg-slate-50 border border-slate-300 px-2 py-1.5 rounded text-xs focus:outline-none focus:border-red-500" value="0">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Medium (M)</label>
                    <input type="number" id="form-item-m" class="w-full bg-slate-50 border border-slate-300 px-2 py-1.5 rounded text-xs focus:outline-none focus:border-red-500" value="0">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Large (L)</label>
                    <input type="number" id="form-item-l" class="w-full bg-slate-50 border border-slate-300 px-2 py-1.5 rounded text-xs focus:outline-none focus:border-red-500" value="0">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="saveMenuItem()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded text-xs font-bold transition">Save</button>
                <button onclick="closeItemFormModal()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded text-xs font-semibold transition">Cancel</button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

                { id: "MK2", name: "Mango Mojito", prices: { R: 80 } },
                { id: "MK3", name: "Lemon Soda", prices: { R: 70 } },
                { id: "MK4", name: "Strawberry Mojito", prices: { R: 80 } },
                { id: "MK5", name: "Pineapple Mojito", prices: { R: 80 } },
                { id: "MK6", name: "Green Apple Mojito", prices: { R: 80 } },
                { id: "MK7", name: "Blueberry Mojito", prices: { R: 80 } },
                { id: "MK8", name: "Orange Mojito", prices: { R: 80 } },
                { id: "MK9", name: "Bubble Gum Mojito", prices: { R: 80 } }
            ],
            "Desserts": [
                { id: "DS1", name: "Vanilla Ice Cream", prices: { R: 60 } },
                { id: "DS2", name: "Chocolate Ice Cream", prices: { R: 70 } },
                { id: "DS3", name: "Kit Kat Dessert", prices: { R: 90 } },
                { id: "DS4", name: "Butterscotch Dessert", prices: { R: 80 } },
                { id: "DS5", name: "Oreo Dessert", prices: { R: 90 } },
                { id: "DS6", name: "Brownie With Ice Cream", prices: { R: 110 } },
                { id: "DS7", name: "Brownie", prices: { R: 80 } },
                { id: "DS8", name: "Sizzle Brownie", prices: { R: 130 } }
            ],
            "Coffee": [
                { id: "CF1", name: "Hot Coffee", prices: { R: 50 } },
                { id: "CF2", name: "Beat Coffee", prices: { R: 60 } },
                { id: "CF3", name: "Cold Coffee", prices: { R: 90 } },
                { id: "CF4", name: "Black Coffee", prices: { R: 50 } }
            ],
            "Meals": [
                { id: "ML1", name: "Aloo Tikki Meal", prices: { R: 130 } },
                { id: "ML2", name: "Single Meal", prices: { R: 150 } },
                { id: "ML3", name: "Couple Meal", prices: { R: 310 } },
                { id: "ML4", name: "Family Meal", prices: { R: 700 } }
            ]
        };

        let currentCategory = Object.keys(menuDatabase)[0];
        let currentOrderType = "Dine-In";
        let currentPayMode = "Cash";
        let cart = [];
        let heldOrders = [];
        let bogoActive = false;
        let activeItemForModal = null;

        window.onload = function() {
            updateClock();
            setInterval(updateClock, 1000);
            renderCategories();
            renderProducts(currentCategory);
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-slate-900 text-white border-slate-700' : 'bg-red-600 text-white border-red-700';
            toast.className = `toast-anim ${bgColor} px-3 py-2 rounded-md shadow-lg text-xs font-semibold border flex items-center space-x-2`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-triangle-exclamation text-white'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + ' | ' + now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
        }

        function renderCategories() {
            const categories = Object.keys(menuDatabase);
            const container = document.getElementById('category-list');
            container.innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat}')" class="text-left px-3 py-2 text-xs font-medium transition flex justify-between items-center ${currentCategory === cat ? 'bg-red-50 text-[#d32f2f] font-bold border-l-4 border-[#d32f2f]' : 'text-slate-700 hover:bg-slate-50'}">
                    <span class="truncate">${cat}</span>
                    <i class="fa-solid fa-chevron-right text-[9px] text-slate-300"></i>
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            currentCategory = cat;
            document.getElementById('active-category-title').innerText = cat;
            renderCategories();
            renderProducts(cat);
        }

        function renderProducts(cat) {
            const items = menuDatabase[cat] || [];
            const grid = document.getElementById('product-grid');
            grid.innerHTML = items.map(item => {
                let priceHtml = '';
                if (item.prices.M && item.prices.M > 0) {
                    priceHtml = `<div class="text-[10px] text-slate-500">R:${item.prices.R} | M:${item.prices.M} | L:${item.prices.L}</div>`;
                } else if (item.prices.L && item.prices.L > 0) {
                    priceHtml = `<div class="text-[10px] text-slate-500">R:${item.prices.R} | L:${item.prices.L}</div>`;
                } else {
                    priceHtml = `<div class="text-xs font-bold text-slate-900">₹${item.prices.R}</div>`;
                }

                const itemJson = encodeURIComponent(JSON.stringify(item));
                return `
                    <button onclick="handleItemClick('${itemJson}')" class="bg-white p-2.5 rounded border border-slate-200 hover:border-red-400 hover:shadow-sm transition text-left flex flex-col justify-between h-20 group">
                        <div class="font-semibold text-xs text-slate-800 group-hover:text-[#d32f2f] line-clamp-2">${item.name}</div>
                        <div>${priceHtml}</div>
                    </button>
                `;
            }).join('');
        }

        function handleItemClick(encodedItem) {
            const item = JSON.parse(decodeURIComponent(encodedItem));
            const hasMultipleSizes = (item.prices.M && item.prices.M > 0) || (item.prices.L && item.prices.L > 0 && !item.prices.M);
            
            if (hasMultipleSizes) {
                openSizeModal(item);
            } else {
                addToCart(item.id, item.name, 'Regular', item.prices.R, currentCategory);
            }
        }

        function openSizeModal(item) {
            activeItemForModal = item;
            document.getElementById('modal-item-name').innerText = item.name;
            const container = document.getElementById('modal-size-options');
            
            let html = `<button onclick="selectSizeAndAdd('Regular', ${item.prices.R})" class="w-full bg-slate-50 hover:bg-red-50 border border-slate-200 hover:border-red-400 p-2.5 rounded flex justify-between items-center text-xs font-semibold transition">
                <span>Regular (R)</span> <span class="text-[#d32f2f] font-bold">₹${item.prices.R}</span>
            </button>`;

            if (item.prices.M && item.prices.M > 0) {
                html += `<button onclick="selectSizeAndAdd('Medium', ${item.prices.M})" class="w-full bg-slate-50 hover:bg-red-50 border border-slate-200 hover:border-red-400 p-2.5 rounded flex justify-between items-center text-xs font-semibold transition">
                    <span>Medium (M)</span> <span class="text-[#d32f2f] font-bold">₹${item.prices.M}</span>
                </button>`;
            }

            if (item.prices.L && item.prices.L > 0) {
                html += `<button onclick="selectSizeAndAdd('Large', ${item.prices.L})" class="w-full bg-slate-50 hover:bg-red-50 border border-slate-200 hover:border-red-400 p-2.5 rounded flex justify-between items-center text-xs font-semibold transition">
                    <span>Large (L)</span> <span class="text-[#d32f2f] font-bold">₹${item.prices.L}</span>
                </button>`;
            }

            container.innerHTML = html;
            document.getElementById('size-modal').classList.remove('hidden');
        }

        function closeSizeModal() {
            document.getElementById('size-modal').classList.add('hidden');
            activeItemForModal = null;
        }

        function selectSizeAndAdd(size, price) {
            if (activeItemForModal) {
                addToCart(activeItemForModal.id, `${activeItemForModal.name} (${size})`, size, price, currentCategory);
                closeSizeModal();
            }
        }

        function filterMenu() {
            const query = document.getElementById('menu-search').value.toLowerCase();
            const grid = document.getElementById('product-grid');
            let results = [];
            
            Object.keys(menuDatabase).forEach(cat => {
                menuDatabase[cat].forEach(item => {
                    if (item.name.toLowerCase().includes(query) || item.id.toLowerCase().includes(query)) {
                        results.push({ ...item, category: cat });
                    }
                });
            });

            if (results.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center py-10 text-slate-400 text-xs">No matching items found</div>`;
                return;
            }

            grid.innerHTML = results.map(item => {
                const itemJson = encodeURIComponent(JSON.stringify(item));
                return `
                    <button onclick="handleItemClick('${itemJson}')" class="bg-white p-2.5 rounded border border-slate-200 hover:border-red-400 hover:shadow-sm transition text-left flex flex-col justify-between h-20 group">
                        <div class="font-semibold text-xs text-slate-800 group-hover:text-[#d32f2f] line-clamp-2">${item.name}</div>
                        <div class="text-xs font-bold text-slate-900">₹${item.prices.R}</div>
                    </button>
                `;
            }).join('');
        }

        function addToCart(id, name, size, price, category) {
            const cartId = `${id}-${size}`;
            const existing = cart.find(i => i.cartId === cartId);
            
            // Check if item belongs to veg pizza categories (Special Veg Pizza, 1 Veg, 2 Veg, 3 Veg) and is Medium or Large
            const pizzaCategories = ["Special Veg Pizza", "1 Veg", "2 Veg", "3 Veg"];
            const isEligibleBogo = pizzaCategories.includes(category) && (size === 'Medium' || size === 'Large');

            if (existing) {
                existing.qty++;
            } else {
                cart.push({ cartId, id, name, size, price, qty: 1, isEligibleBogo });
            }
            updateCartUI();
        }

        function updateQty(cartId, change) {
            const item = cart.find(i => i.cartId === cartId);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.cartId !== cartId);
                }
            }
            updateCartUI();
        }

        function toggleBogo() {
            bogoActive = !bogoActive;
            const btn = document.getElementById('bogo-btn');
            const status = document.getElementById('bogo-status');
            if (bogoActive) {
                btn.className = "bg-amber-100 border border-amber-400 text-amber-900 py-1 rounded text-[11px] font-bold transition flex items-center justify-center shadow-inner";
                status.innerText = "ON";
                status.className = "ml-1 text-amber-700 font-extrabold";
            } else {
                btn.className = "bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 py-1 rounded text-[11px] font-bold transition flex items-center justify-center";
                status.innerText = "OFF";
                status.className = "ml-1 text-slate-400";
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-list');
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs select-none py-10">
                        <i class="fa-solid fa-basket-shopping text-3xl mb-1 text-slate-300"></i>
                        <span>No items added yet</span>
                    </div>`;
                document.getElementById('summary-subtotal').innerText = '₹0.00';
                document.getElementById('summary-total').innerText = '₹0.00';
                return;
            }

            // Expand cart for BOGO calculation strictly on eligible Medium/Large veg pizzas
            let expandedItems = [];
            cart.forEach(item => {
                for (let q = 0; q < item.qty; q++) {
                    expandedItems.push({ ...item, unitQty: 1 });
                }
            });

            if (bogoActive) {
                let eligibleExpanded = expandedItems.filter(i => i.isEligibleBogo);
                let ineligibleExpanded = expandedItems.filter(i => !i.isEligibleBogo);

                if (eligibleExpanded.length >= 2) {
                    eligibleExpanded.sort((a, b) => a.price - b.price);
                    const freeCount = Math.floor(eligibleExpanded.length / 2);
                    for (let i = 0; i < freeCount; i++) eligibleExpanded[i].effectivePrice = 0;
                    for (let i = freeCount; i < eligibleExpanded.length; i++) eligibleExpanded[i].effectivePrice = eligibleExpanded[i].price;
                } else {
                    eligibleExpanded.forEach(i => i.effectivePrice = i.price);
                }
                ineligibleExpanded.forEach(i => i.effectivePrice = i.price);
                expandedItems = [...eligibleExpanded, ...ineligibleExpanded];
            } else {
                expandedItems.forEach(i => i.effectivePrice = i.price);
            }

            container.innerHTML = cart.map(item => {
                const itemEffTotal = expandedItems.filter(ei => ei.cartId === item.cartId).reduce((sum, ei) => sum + ei.effectivePrice, 0);
                const hasDiscountApplied = bogoActive && item.isEligibleBogo && itemEffTotal < (item.price * item.qty);
                return `
                    <div class="py-2 grid grid-cols-12 items-center text-xs">
                        <div class="col-span-6 pr-1 font-medium text-slate-800 truncate">
                            ${item.name}
                            ${hasDiscountApplied ? '<span class="text-[9px] bg-amber-100 text-amber-800 px-1 rounded ml-1 font-bold">BOGO</span>' : ''}
                        </div>
                        <div class="col-span-3 flex items-center justify-center space-x-1">
                            <button onclick="updateQty('${item.cartId}', -1)" class="w-5 h-5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-bold">-</button>
                            <span class="w-4 text-center font-bold">${item.qty}</span>
                            <button onclick="updateQty('${item.cartId}', 1)" class="w-5 h-5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-bold">+</button>
                        </div>
                        <div class="col-span-3 text-right font-bold text-slate-900">
                            ${hasDiscountApplied ? `<span class="line-through text-slate-400 text-[10px] mr-1">₹${item.price * item.qty}</span>` : ''}
                            ₹${itemEffTotal}
                        </div>
                    </div>
                `;
            }).join('');

            const subtotal = expandedItems.reduce((sum, i) => sum + i.effectivePrice, 0);
            const extra = parseFloat(document.getElementById('extra-charges').value) || 0;
            const discount = parseFloat(document.getElementById('discount-amount').value) || 0;
            const total = subtotal + extra - discount;

            document.getElementById('summary-subtotal').innerText = `₹${subtotal.toFixed(2)}`;
            document.getElementById('summary-total').innerText = `₹${Math.max(0, total).toFixed(2)}`;
        }

        // EDIT MENU FUNCTIONS
        function openMenuEditor() {
            const select = document.getElementById('editor-cat-select');
            select.innerHTML = Object.keys(menuDatabase).map(cat => `<option value="${cat}">${cat}</option>`).join('');
            renderEditorItems();
            document.getElementById('menu-editor-modal').classList.remove('hidden');
        }

        function closeMenuEditor() {
            document.getElementById('menu-editor-modal').classList.add('hidden');
            renderProducts(currentCategory);
        }

        function renderEditorItems() {
            const cat = document.getElementById('editor-cat-select').value;
            const items = menuDatabase[cat] || [];
            const container = document.getElementById('editor-items-list');

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 text-xs py-5">No items in this category</div>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="py-2 flex justify-between items-center text-xs">
                    <div>
                        <div class="font-bold text-slate-800">${item.name}</div>
                        <div class="text-slate-500 text-[11px]">R: ₹${item.prices.R} ${item.prices.M ? `| M: ₹${item.prices.M}` : ''} ${item.prices.L ? `| L: ₹${item.prices.L}` : ''}</div>
                    </div>
                    <div class="space-x-1">
                        <button onclick="openEditItemModal('${cat}', '${item.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded font-semibold">Edit</button>
                        <button onclick="deleteMenuItem('${cat}', '${item.id}')" class="bg-rose-100 hover:bg-rose-200 text-rose-700 px-2.5 py-1 rounded font-semibold">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function openAddItemModal() {
            document.getElementById('item-form-title').innerText = "Add New Item";
            document.getElementById('form-item-id').value = '';
            document.getElementById('form-item-name').value = '';
            document.getElementById('form-item-r').value = '0';
            document.getElementById('form-item-m').value = '0';
            document.getElementById('form-item-l').value = '0';
            document.getElementById('item-form-modal').classList.remove('hidden');
        }

        function openEditItemModal(cat, id) {
            const item = menuDatabase[cat].find(i => i.id === id);
            if (!item) return;
            document.getElementById('item-form-title').innerText = "Edit Item";
            document.getElementById('form-item-id').value = id;
            document.getElementById('form-item-name').value = item.name;
            document.getElementById('form-item-r').value = item.prices.R || 0;
            document.getElementById('form-item-m').value = item.prices.M || 0;
            document.getElementById('form-item-l').value = item.prices.L || 0;
            document.getElementById('item-form-modal').classList.remove('hidden');
        }

        function closeItemFormModal() {
            document.getElementById('item-form-modal').classList.add('hidden');
        }

        function saveMenuItem() {
            const cat = document.getElementById('editor-cat-select').value;
            const id = document.getElementById('form-item-id').value;
            const name = document.getElementById('form-item-name').value.trim();
            const r = parseFloat(document.getElementById('form-item-r').value) || 0;
            const m = parseFloat(document.getElementById('form-item-m').value) || 0;
            const l = parseFloat(document.getElementById('form-item-l').value) || 0;

            if (!name) { showToast('Please enter item name', 'error'); return; }

            let prices = { R: r };
            if (m > 0) prices.M = m;
            if (l > 0) prices.L = l;

            if (id) {
                const item = menuDatabase[cat].find(i => i.id === id);
                if (item) {
                    item.name = name;
                    item.prices = prices;
                }
            } else {
                const newId = 'CUSTOM_' + Date.now();
                menuDatabase[cat].push({ id: newId, name, prices });
            }

            localStorage.setItem('delicious_eatz_menu', JSON.stringify(menuDatabase));
            closeItemFormModal();
            renderEditorItems();
            showToast('Menu saved successfully!');
        }

        function deleteMenuItem(cat, id) {
            menuDatabase[cat] = menuDatabase[cat].filter(i => i.id !== id);
            localStorage.setItem('delicious_eatz_menu', JSON.stringify(menuDatabase));
            renderEditorItems();
            showToast('Item deleted successfully!');
        }

        function holdCurrentOrder() {
            if (cart.length === 0) { showToast('Cart is empty!', 'error'); return; }
            const name = document.getElementById('customer-name').value || 'Walk-in';
            const phone = document.getElementById('customer-phone').value || '';
            
            heldOrders.push({
                id: Date.now(),
                name,
                phone,
                orderType: currentOrderType,
                cart: [...cart],
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            document.getElementById('held-count').innerText = heldOrders.length;
            showToast('Order placed on hold successfully.');
            clearActiveOrder();
        }

        function viewHeldOrdersModal() {
            const list = document.getElementById('held-orders-list');
            if (heldOrders.length === 0) {
                list.innerHTML = `<div class="text-center text-slate-400 text-xs py-10">No held orders found</div>`;
            } else {
                list.innerHTML = heldOrders.map(o => `
                    <div class="bg-slate-50 border border-slate-200 p-2.5 rounded flex justify-between items-center text-xs">
                        <div>
                            <div class="font-bold text-slate-800">${o.name} (${o.phone || 'No phone'})</div>
                            <div class="text-slate-500 text-[11px]">${o.orderType} | Items: ${o.cart.reduce((s,i)=>s+i.qty,0)} | ${o.time}</div>
                        </div>
                        <button onclick="restoreHeldOrder(${o.id})" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-1.5 rounded transition">Restore</button>
                    </div>
                `).join('');
            }
            document.getElementById('held-modal').classList.remove('hidden');
        }

        function closeHeldOrdersModal() {
            document.getElementById('held-modal').classList.add('hidden');
        }

        function restoreHeldOrder(id) {
            const idx = heldOrders.findIndex(o => o.id === id);
            if (idx !== -1) {
                cart = heldOrders[idx].cart;
                document.getElementById('customer-name').value = heldOrders[idx].name;
                document.getElementById('customer-phone').value = heldOrders[idx].phone;
                setOrderType(heldOrders[idx].orderType);
                heldOrders.splice(idx, 1);
                document.getElementById('held-count').innerText = heldOrders.length;
                closeHeldOrdersModal();
                updateCartUI();
                showToast('Order restored successfully.');
            }
        }

        function clearActiveOrder() {
            cart = [];
            document.getElementById('customer-name').value = '';
            document.getElementById('customer-phone').value = '';
            document.getElementById('extra-charges').value = 0;
            document.getElementById('discount-amount').value = 0;
            if (bogoActive) toggleBogo();
            updateCartUI();
            showToast('Order cleared.');
        }

        function setOrderType(type) {
            currentOrderType = type;
            ['dine', 'del', 'pick'].forEach(t => {
                const el = document.getElementById(`type-${t}`);
                el.className = el.innerText.toLowerCase().includes(type.toLowerCase()) 
                    ? 'py-1.5 bg-white rounded shadow-sm text-[#d32f2f] font-bold transition' 
                    : 'py-1.5 text-slate-600 rounded transition';
            });
        }

        function setPayMode(mode) {
            currentPayMode = mode;
            ['cash', 'card', 'due', 'other', 'paid'].forEach(m => {
                const el = document.getElementById(`pay-${m}`);
                el.className = el.innerText.toLowerCase() === mode.toLowerCase() 
                    ? 'bg-emerald-600 text-white border border-emerald-700 py-1.5 rounded shadow-sm font-bold' 
                    : 'bg-white border border-slate-300 py-1.5 rounded text-slate-600';
            });
        }

        function printKOTDirect() {
            if (cart.length === 0) { showToast('Cart is empty!', 'error'); return; }
            triggerThermalPrint('KOT');
        }

        function printBillDirect() {
            if (cart.length === 0) { showToast('Cart is empty!', 'error'); return; }
            triggerThermalPrint('BILL');
            clearActiveOrder();
        }

        function triggerThermalPrint(type) {
            const name = document.getElementById('customer-name').value || 'Walk-in';
            const phone = document.getElementById('customer-phone').value || '';
            const extra = parseFloat(document.getElementById('extra-charges').value) || 0;
            const discount = parseFloat(document.getElementById('discount-amount').value) || 0;
            
            fetch('http://localhost:5000/print', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, orderType: currentOrderType, payMode: currentPayMode, name, phone, bogo: bogoActive, extra, discount, items: cart })
            }).catch(err => {
                console.warn('Local print bridge connection skipped:', err);
            });
            showToast(`${type} dispatched directly to thermal printer for ${name}!`);
        }

        function syncData() {
            showToast('Sales summary & data synchronized successfully.');
        }
    </script>
</body>
